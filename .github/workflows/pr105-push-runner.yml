name: Temporary PR 105 main trigger

on:
  push:
    branches:
      - main
    paths:
      - .starintel-triggers/pr105-main-trigger

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/dark-academia-rand-bilderberg-wave-2
          fetch-depth: 0

      - name: Rebuild RAND and Bilderberg changes on current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main archive/pr-105-pre-takeover-f8035f2
          rm -rf /tmp/pr105-old
          git worktree add --detach /tmp/pr105-old origin/archive/pr-105-pre-takeover-f8035f2
          git reset --hard origin/main
          git show origin/main:scripts/pr105_takeover.py > /tmp/pr105_takeover.py
          python3 /tmp/pr105_takeover.py

          rm -f \
            .github/workflows/pr105-takeover-runner.yml \
            .github/workflows/pr105-push-runner.yml \
            .starintel-triggers/pr105-main-trigger \
            .starintel-triggers/pr105-takeover \
            scripts/pr105_takeover.py

          python3 scripts/starintel.py validate --root .
          python3 scripts/validate-for-merge.py

          git config user.name "starintel-auto-dig-maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No RAND or Bilderberg delta remains after reconciliation"
            exit 0
          fi
          git commit -m "Reconcile RAND and Bilderberg expansion with current main"
          git push --force-with-lease origin HEAD:agent/dark-academia-rand-bilderberg-wave-2
