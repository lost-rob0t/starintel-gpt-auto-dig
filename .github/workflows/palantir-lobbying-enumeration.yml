name: Enumerate Palantir lobbying

on:
  workflow_dispatch:
    inputs:
      year_start:
        description: Optional first filing year
        required: false
        type: string
      year_end:
        description: Optional last filing year
        required: false
        type: string
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  enumerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install requests
      - name: Fetch and normalize LDA filings
        env:
          LDA_API_TOKEN: ${{ secrets.LDA_API_TOKEN }}
          YEAR_START: ${{ inputs.year_start }}
          YEAR_END: ${{ inputs.year_end }}
        run: |
          args=(
            --client-name "Palantir Technologies"
            --dataset palantir-deep-dive-2026-07-25
            --output-dir artifacts/palantir-lobbying
            --emit-starintel
          )
          [[ -n "$YEAR_START" ]] && args+=(--year-start "$YEAR_START")
          [[ -n "$YEAR_END" ]] && args+=(--year-end "$YEAR_END")
          python scripts/enumerate_palantir_lobbying.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: palantir-lobbying-${{ github.run_id }}
          path: artifacts/palantir-lobbying/
          if-no-files-found: error
          retention-days: 30
