name: Reconcile importer conflicts

on:
  push:
    branches:
      - fix/importer-corpus-duplicate-contract
    paths:
      - scripts/reconcile-importer-conflict-versions.py
      - .github/workflows/reconcile-importer-conflicts.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/importer-corpus-duplicate-contract
      - name: Apply bounded packet-version reconciliation
        run: python scripts/reconcile-importer-conflict-versions.py
      - name: Verify importer corpus invariant
        run: python -m unittest tests.test_import_starintel_corpus -v
      - name: Check patch
        run: git diff --check
      - name: Commit reconciled packets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digs/
          if git diff --cached --quiet; then
            echo "No reconciliation changes needed."
            exit 0
          fi
          git commit -m "fix(import): version current-main conflicting packet records"
          git push origin HEAD:fix/importer-corpus-duplicate-contract
