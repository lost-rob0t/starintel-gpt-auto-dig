name: Discover Global Shapers frontend data

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/discover_global_shapers_frontend_data.py"
      - ".github/workflows/discover-global-shapers-frontend-data.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discover-global-shapers-frontend-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install browser discovery dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Capture frontend state and network data
        run: |
          python scripts/discover_global_shapers_frontend_data.py \
            --output reports/global-shapers-frontend-data.json \
            --hub-url-file imports/global-shapers/frontend-hub-urls.txt \
            --profile-url-file imports/global-shapers/frontend-profile-urls.txt \
            --max-clicks 700 \
            --scroll-rounds 900 \
            --timeout-ms 120000

      - name: Print high-signal response summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/global-shapers-frontend-data.json").read_text(encoding="utf-8"))
          responses = []
          for item in report["responses"]:
              if item.get("interesting") or item.get("member_urls") or item.get("hub_urls") or item.get("salesforce_ids"):
                  responses.append({
                      "url": item.get("url"),
                      "status": item.get("status"),
                      "resource_type": item.get("resource_type"),
                      "content_type": item.get("content_type"),
                      "bytes": item.get("bytes"),
                      "member_urls": item.get("member_urls"),
                      "hub_urls": item.get("hub_urls"),
                      "salesforce_ids": item.get("salesforce_ids"),
                      "top_keys": (item.get("json_summary") or {}).get("top_keys", [])[:20],
                  })
          print(json.dumps({
              "hub_url_count": report["hub_url_count"],
              "member_url_count": report["member_url_count"],
              "salesforce_id_count": report["salesforce_id_count"],
              "pages": report["pages"],
              "interesting_responses": responses,
              "errors": report["errors"],
          }, indent=2))
          PY

      - name: Upload frontend discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-shapers-frontend-data
          path: |
            reports/global-shapers-frontend-data.json
            imports/global-shapers/frontend-hub-urls.txt
            imports/global-shapers/frontend-profile-urls.txt
          if-no-files-found: error
          retention-days: 14
