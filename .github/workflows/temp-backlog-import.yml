name: TEMP import StarIntel backlog

on:
  pull_request:
    paths:
      - "scripts/import-starintel-backlog.py"
      - "tests/test_import_starintel_backlog.py"
      - ".github/workflows/temp-backlog-import.yml"
  push:
    branches:
      - main
      - autodig/worker-1-seeded-ai-lab-dispatch-20260915
    paths:
      - ".github/workflows/temp-backlog-import.yml"
  workflow_dispatch:
    inputs:
      start_offset:
        description: "Canonical sorted-document offset to start from"
        required: true
        default: "0"
        type: string
      max_documents:
        description: "Maximum documents this run; 0 means through end of corpus"
        required: true
        default: "0"
        type: string
      resume_run_id:
        description: "Optional prior workflow run ID whose ledger artifact should be downloaded and resumed"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: temp-starintel-backlog-import-${{ github.ref }}
  cancel-in-progress: false

env:
  NIM_VERSION: 2.2.4
  STAR_INGEST_URL: https://ingest.starintel.actor
  OUTER_CHUNK_SIZE: "10000"
  SERVER_BATCH_SIZE: "250"
  SEEDED_DISPATCH_BRANCH: autodig/worker-1-seeded-ai-lab-dispatch-20260915

jobs:
  dispatch-seeded-ai-lab-targets:
    if: github.event_name == 'push' && github.ref_name == 'autodig/worker-1-seeded-ai-lab-dispatch-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical source commit
        uses: actions/checkout@v6

      - name: Preflight ingest credential
        env:
          STAR_SERVER_API_KEY: ${{ secrets.STAR_SERVER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          credential="${STAR_SERVER_API_KEY#Bearer }"
          if [[ -z "$credential" ]]; then
            echo "STAR_SERVER_API_KEY is missing." >&2
            exit 2
          fi
          response_file="$(mktemp)"
          code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${credential}" \
            "${STAR_INGEST_URL}/auth/context")"
          if [[ "$code" != "200" ]]; then
            safe_code="$(jq -r '.code // "unknown"' "$response_file" 2>/dev/null || printf '%s' unknown)"
            echo "Ingest credential preflight failed: HTTP ${code}, server code ${safe_code}." >&2
            exit 3
          fi
          jq -e '.scopes | index("targets:dispatch") != null' "$response_file" >/dev/null
          jq -c '{status:"credential-ok",principal_type,credential_id,scopes}' "$response_file"

      - name: Dispatch canonical seeded AI-lab targets
        env:
          STAR_SERVER_API_KEY: ${{ secrets.STAR_SERVER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          credential="${STAR_SERVER_API_KEY#Bearer }"
          out="$RUNNER_TEMP/seeded-ai-lab-target-dispatch.jsonl"
          : > "$out"

          dispatch() {
            local label="$1"
            local slug="$2"
            local target_id="$3"
            local response_file code payload
            response_file="$(mktemp)"
            payload="$(jq -nc \
              --arg actor "org-member" \
              --arg target "$slug" \
              --arg dataset "ai-lab-workforce-seeded-queue-2026-09-15" \
              --arg key "$target_id" \
              '{actor:$actor,target:$target,dataset:$dataset,options:[],idempotency_key:$key}')"
            code="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --header "Authorization: Bearer ${credential}" \
              --data "$payload" \
              "${STAR_INGEST_URL}/api/v1/targets")"

            if [[ "$code" != "200" && "$code" != "201" ]]; then
              jq -nc \
                --arg label "$label" \
                --arg slug "$slug" \
                --arg target_id "$target_id" \
                --arg http_status "$code" \
                --arg server_code "$(jq -r '.code // "unknown"' "$response_file" 2>/dev/null || printf '%s' unknown)" \
                --arg correlation_id "$(jq -r '.correlation_id // ""' "$response_file" 2>/dev/null || true)" \
                '{record_type:"target-dispatch-failure",status:"failed",label:$label,slug:$slug,target_id:$target_id,http_status:$http_status,server_code:$server_code,correlation_id:$correlation_id}' \
                | tee -a "$out"
              return 1
            fi

            jq -ce \
              --arg label "$label" \
              --arg slug "$slug" \
              --arg requested_target_id "$target_id" \
              --arg http_status "$code" \
              '{record_type:"target-dispatch",status:"confirmed",label:$label,slug:$slug,requested_target_id:$requested_target_id,http_status:$http_status,receipt:{status:.status,target_id:.target_id,request_id:.request_id,correlation_id:.correlation_id}}' \
              "$response_file" | tee -a "$out"
          }

          dispatch "DeepSeek AI" "deepseek-ai" "starintel:target:ai-lab-workforce-deepseek-ai-org-member"
          dispatch "Anthropic" "anthropic" "starintel:target:ai-lab-workforce-anthropic-org-member"
          dispatch "OpenAI" "openai" "starintel:target:ai-lab-workforce-openai-org-member"

          test "$(wc -l < "$out")" -eq 3
          jq -e -s 'length == 3 and all(.[]; .record_type == "target-dispatch" and .status == "confirmed" and (.receipt.target_id | length) > 0 and (.receipt.request_id | length) > 0 and (.receipt.correlation_id | length) > 0)' "$out" >/dev/null

      - name: Upload seeded target dispatch receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seeded-ai-lab-target-dispatch-receipts
          path: ${{ runner.temp }}/seeded-ai-lab-target-dispatch.jsonl
          if-no-files-found: warn
          retention-days: 90

  import-backlog:
    if: github.ref_name != 'autodig/worker-1-seeded-ai-lab-dispatch-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout canonical source commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Build threaded ingest core
        run: nimble buildIngest

      - name: Test ingest resolver, adaptive backlog importer, and threaded core
        run: |
          python3 -m unittest \
            tests.test_export_starintel_documents \
            tests.test_import_starintel_documents \
            tests.test_import_starintel_backlog \
            tests.test_starintel_ingest_core

      - name: Prepare canonical ledgers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/backlog-import"
          touch "$RUNNER_TEMP/backlog-import/canonical-import.jsonl"
          touch "$RUNNER_TEMP/backlog-import/failed-import.jsonl"

      - name: Dry-run canonical backlog plan
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/import-starintel-backlog.py \
            --chunk-size "$OUTER_CHUNK_SIZE" \
            --batch-size "$SERVER_BATCH_SIZE" \
            --log-dir "$RUNNER_TEMP/backlog-import" \
            --dry-run \
            2> >(tee "$RUNNER_TEMP/backlog-import/console.jsonl" >&2)

      - name: Restore prior ledger for resume
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/backlog-import/canonical-import.jsonl" \
                "$RUNNER_TEMP/backlog-import/failed-import.jsonl"
          gh run download "$RESUME_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name starintel-backlog-import-ledgers \
            --dir "$RUNNER_TEMP/backlog-import"
          touch "$RUNNER_TEMP/backlog-import/canonical-import.jsonl"
          touch "$RUNNER_TEMP/backlog-import/failed-import.jsonl"

      - name: Restore exact corpus commit for resume
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id != ''
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(jq -r 'select(.source_commit != null) | .source_commit' \
            "$RUNNER_TEMP/backlog-import/canonical-import.jsonl" | tail -n 1)"
          if [[ -z "$source_commit" || "$source_commit" == "null" ]]; then
            echo "Prior canonical ledger has no source_commit; refusing an unsafe offset resume." >&2
            exit 4
          fi
          if ! git cat-file -e "${source_commit}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$source_commit"
          fi
          git checkout --detach "$source_commit"
          echo "Resuming the exact canonical corpus at $source_commit"

      - name: Preflight ingest credential
        if: github.event_name != 'pull_request'
        env:
          STAR_SERVER_API_KEY: ${{ secrets.STAR_SERVER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          credential="${STAR_SERVER_API_KEY#Bearer }"
          if [[ -z "$credential" ]]; then
            echo "STAR_SERVER_API_KEY is missing." >&2
            exit 2
          fi
          response_file="$(mktemp)"
          code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${credential}" \
            "${STAR_INGEST_URL}/auth/context")"
          if [[ "$code" != "200" ]]; then
            safe_code="$(jq -r '.code // "unknown"' "$response_file" 2>/dev/null || printf '%s' unknown)"
            echo "Ingest credential preflight failed: HTTP ${code}, server code ${safe_code}." >&2
            exit 3
          fi
          jq -c '{status:"credential-ok",principal_type,credential_id,scopes}' "$response_file"

      - name: Import canonical backlog
        if: github.event_name != 'pull_request'
        env:
          STAR_SERVER_API_KEY: ${{ secrets.STAR_SERVER_API_KEY }}
          START_OFFSET: ${{ github.event_name == 'workflow_dispatch' && inputs.start_offset || '0' }}
          MAX_DOCUMENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_documents || '0' }}
          RESUME_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          export STAR_SERVER_API_KEY="${STAR_SERVER_API_KEY#Bearer }"
          args=(
            --chunk-size "$OUTER_CHUNK_SIZE"
            --batch-size "$SERVER_BATCH_SIZE"
            --start-offset "$START_OFFSET"
            --max-documents "$MAX_DOCUMENTS"
            --log-dir "$RUNNER_TEMP/backlog-import"
          )
          if [[ -n "$RESUME_RUN_ID" ]]; then
            args+=(--resume-from-log)
          fi
          python3 scripts/import-starintel-backlog.py "${args[@]}" \
            2> >(tee "$RUNNER_TEMP/backlog-import/console.jsonl" >&2)

      - name: Upload canonical and failed ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starintel-backlog-import-ledgers
          path: |
            ${{ runner.temp }}/backlog-import/canonical-import.jsonl
            ${{ runner.temp }}/backlog-import/failed-import.jsonl
            ${{ runner.temp }}/backlog-import/console.jsonl
          if-no-files-found: warn
          retention-days: 90

# full retry with validated target routing fix
