name: Worker 5 materialize issue 2109 follow-up

on:
  push:
    branches:
      - autodig/worker-5-issue-2109-primary-context-20260915
    paths:
      - ".github/workflows/worker5-materialize-2109-followup.yml"

permissions:
  contents: write

concurrency:
  group: worker5-materialize-2109-followup
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Import packet transactionally
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/starintel.py import \
            digs/violent-offenders/2026-09-15-issue-2109-native-public-context-followup/starintel-documents.jsonl

      - name: Validate complete normalized corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/starintel.py validate --root .

      - name: Commit normalized DB surfaces and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/worker5-materialize-2109-followup.yml
          git add -A db/
          if git diff --cached --quiet; then
            echo "Importer produced no repository delta." >&2
            exit 2
          fi
          git commit -m "Materialize issue 2109 follow-up records"
          git push origin HEAD:autodig/worker-5-issue-2109-primary-context-20260915
