name: TEMP strip tenant_id from corpus

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-strip-tenant-id.yml"

permissions:
  contents: write

jobs:
  strip-tenant-id:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Strip tenant_id from canonical corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          roots = [Path('db'), Path('digs')]
          targets = []
          if roots[0].is_dir():
              targets.extend(sorted(roots[0].rglob('*.ndjson')))
          if roots[1].is_dir():
              targets.extend(sorted(roots[1].rglob('starintel-documents.jsonl')))

          changed_files = 0
          stripped_keys = 0

          def strip_tenant(value):
              global stripped_keys
              if isinstance(value, dict):
                  if 'tenant_id' in value:
                      del value['tenant_id']
                      stripped_keys += 1
                  for item in value.values():
                      strip_tenant(item)
              elif isinstance(value, list):
                  for item in value:
                      strip_tenant(item)

          for path in targets:
              raw = path.read_text(encoding='utf-8')
              out = []
              file_changed = False
              for line_no, line in enumerate(raw.splitlines(), start=1):
                  if not line.strip():
                      out.append(line)
                      continue
                  doc = json.loads(line)
                  before = json.dumps(doc, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
                  strip_tenant(doc)
                  after = json.dumps(doc, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
                  if before != after:
                      file_changed = True
                  out.append(json.dumps(doc, ensure_ascii=False, separators=(',', ':')))
              if file_changed:
                  path.write_text('\n'.join(out) + ('\n' if raw.endswith('\n') else ''), encoding='utf-8')
                  changed_files += 1

          print(json.dumps({
              'status': 'tenant-cleanup-complete',
              'changed_files': changed_files,
              'stripped_tenant_id_keys': stripped_keys,
          }, sort_keys=True))
          PY

      - name: Verify tenant_id absent from corpus
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --fixed-strings '"tenant_id"' db digs --include='*.ndjson' --include='starintel-documents.jsonl'; then
            echo 'tenant_id remains in canonical corpus' >&2
            exit 1
          fi

      - name: Commit cleaned corpus and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'starintel-ci'
          git config user.email 'starintel-ci@users.noreply.github.com'
          git rm .github/workflows/temp-strip-tenant-id.yml
          git add db digs
          if git diff --cached --quiet; then
            echo 'No tenant_id fields found; removing temp workflow only.'
          fi
          git commit -m 'data: strip server-side tenant_id from corpus'
          git push origin HEAD:main
