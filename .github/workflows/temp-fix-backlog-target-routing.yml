name: TEMP fix backlog target routing

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-fix-backlog-target-routing.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch backlog importer to route targets correctly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/import-starintel-backlog.py')
          text = path.read_text(encoding='utf-8')

          old_imports = '''import subprocess
          import sys
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Iterator
          '''
          new_imports = '''import subprocess
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Iterator
          '''
          if 'import urllib.request' not in text:
              if old_imports not in text:
                  raise SystemExit('import anchor not found')
              text = text.replace(old_imports, new_imports, 1)

          anchor = '''def common_event(run_id: str, source_commit: str) -> dict:
          '''
          helpers = '''def target_record_p(record) -> bool:
              dtype = record.document.get("dtype")
              return isinstance(dtype, str) and dtype.lower() == "target"


          def target_actor(record) -> str | None:
              document = record.document
              actor = document.get("actor")
              if not isinstance(actor, str) or not actor.strip():
                  data = document.get("data")
                  actor = data.get("actor") if isinstance(data, dict) else None
              if isinstance(actor, str) and actor.strip():
                  return actor.strip()
              return None


          def run_target(record) -> tuple[int, str]:
              """Dispatch one canonical target through the target compatibility route."""
              actor = target_actor(record)
              if actor is None:
                  return 2, f"target document {record.document_id!r} is missing data.actor"

              api_key = os.environ.get("STAR_SERVER_API_KEY", "").strip()
              if api_key.startswith("Bearer "):
                  api_key = api_key[len("Bearer "):]
              if not api_key:
                  return 2, "STAR_SERVER_API_KEY is required"

              server_url = os.environ.get(
                  "STAR_INGEST_URL", "https://ingest.starintel.actor"
              ).rstrip("/")
              encoded_actor = urllib.parse.quote(actor, safe="")
              url = f"{server_url}/new/target/{encoded_actor}"
              body = json.dumps(
                  record.document,
                  ensure_ascii=False,
                  separators=(",", ":"),
              ).encode("utf-8")
              request = urllib.request.Request(
                  url,
                  data=body,
                  headers={
                      "Accept": "application/json",
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                      "User-Agent": "starintel-auto-dig-backlog/1",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30.0) as response:
                      raw = response.read().decode("utf-8", errors="replace")
                      return 0, raw
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", errors="replace")
                  return 1, f"POST {url} failed with HTTP {exc.code}: {raw[:1000]}"
              except urllib.error.URLError as exc:
                  return 1, f"POST {url} failed ambiguously: {exc.reason}"


          def record_confirmed_target(
              *,
              import_log: Path,
              record,
              index: int,
              chunk_no: int,
              run_id: str,
              source_commit: str,
              actor: str,
              adaptive_depth: int,
          ) -> None:
              append_jsonl(
                  import_log,
                  {
                      **common_event(run_id, source_commit),
                      "record_type": "target-dispatch",
                      "status": "confirmed",
                      "chunk": chunk_no,
                      "batch_start_offset": index,
                      "batch_stop_offset": index + 1,
                      "confirmed_offset": index + 1,
                      "document_count": 1,
                      "document_ids": [record.document_id],
                      "actor": actor,
                      "route": "/new/target/:actor",
                      "adaptive_depth": adaptive_depth,
                  },
              )


          def common_event(run_id: str, source_commit: str) -> dict:
          '''
          if 'def target_record_p(record)' not in text:
              if anchor not in text:
                  raise SystemExit('helper anchor not found')
              text = text.replace(anchor, helpers, 1)

          ingest_anchor = '''    """Ingest a contiguous range, bisecting only clean 413 rejections."""
              rc, output = run_batch(core, records, first, past_last)
              document_ids = [record.document_id for record in records[first:past_last]]
          '''
          ingest_replacement = '''    """Ingest a contiguous range, routing target documents separately.

              Ordinary documents use /documents/bulk. Canonical target documents are
              dispatch work items and must use /new/target/:actor; mixing them into the
              generic bulk route adds a target resource scope and rejects an otherwise
              valid dispatch credential.
              """
              for target_index in range(first, past_last):
                  if not target_record_p(records[target_index]):
                      continue

                  if target_index > first:
                      if not ingest_range(
                          core=core,
                          records=records,
                          first=first,
                          past_last=target_index,
                          chunk_no=chunk_no,
                          import_log=import_log,
                          failed_log=failed_log,
                          run_id=run_id,
                          source_commit=source_commit,
                          state=state,
                          adaptive_depth=adaptive_depth + 1,
                      ):
                          return False

                  record = records[target_index]
                  actor = target_actor(record)
                  rc, output = run_target(record)
                  if rc != 0 or actor is None:
                      failure = {
                          **common_event(run_id, source_commit),
                          "record_type": "target-dispatch-failure",
                          "status": "failed-or-ambiguous",
                          "chunk": chunk_no,
                          "exit_code": rc,
                          "confirmed_offset": state["confirmed_offset"],
                          "failed_start_offset": target_index,
                          "failed_stop_offset": target_index + 1,
                          "document_count": 1,
                          "document_ids": [record.document_id],
                          "actor": actor,
                          "route": "/new/target/:actor",
                          "replay_requires_review": True,
                          "adaptive_depth": adaptive_depth,
                          "error": output,
                      }
                      append_jsonl(failed_log, failure)
                      emit(
                          {
                              "status": "target-dispatch-failed",
                              "document_id": record.document_id,
                              "actor": actor,
                              "confirmed_offset": state["confirmed_offset"],
                          }
                      )
                      return False

                  record_confirmed_target(
                      import_log=import_log,
                      record=record,
                      index=target_index,
                      chunk_no=chunk_no,
                      run_id=run_id,
                      source_commit=source_commit,
                      actor=actor,
                      adaptive_depth=adaptive_depth,
                  )
                  state["confirmed_offset"] = target_index + 1
                  state["completed_batches"] += 1
                  state["imported_documents"] += 1
                  emit(
                      {
                          "status": "checkpoint",
                          "confirmed_offset": target_index + 1,
                          "completed_server_batches": state["completed_batches"],
                          "imported_documents": state["imported_documents"],
                          "last_batch_documents": 1,
                          "transport": "target-dispatch",
                          "actor": actor,
                          "adaptive_depth": adaptive_depth,
                      }
                  )

                  if target_index + 1 < past_last:
                      return ingest_range(
                          core=core,
                          records=records,
                          first=target_index + 1,
                          past_last=past_last,
                          chunk_no=chunk_no,
                          import_log=import_log,
                          failed_log=failed_log,
                          run_id=run_id,
                          source_commit=source_commit,
                          state=state,
                          adaptive_depth=adaptive_depth + 1,
                      )
                  return True

              rc, output = run_batch(core, records, first, past_last)
              document_ids = [record.document_id for record in records[first:past_last]]
          '''
          if 'routing target documents separately' not in text:
              if ingest_anchor not in text:
                  raise SystemExit('ingest anchor not found')
              text = text.replace(ingest_anchor, ingest_replacement, 1)

          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_import_starintel_backlog.py')
          tests = test_path.read_text(encoding='utf-8')
          test_anchor = '''    def test_non_413_failure_stays_ambiguous_and_does_not_advance(self) -> None:
          '''
          target_test = '''    def test_target_is_dispatched_separately_from_bulk_documents(self) -> None:
              records = [
                  Record(
                      "target-1",
                      {
                          "_id": "target-1",
                          "dtype": "target",
                          "data": {"actor": "data-governance"},
                      },
                  ),
                  Record("doc-1", {"_id": "doc-1", "dtype": "source"}),
              ]
              with tempfile.TemporaryDirectory() as directory:
                  root = Path(directory)
                  state = {
                      "confirmed_offset": 0,
                      "completed_batches": 0,
                      "imported_documents": 0,
                  }
                  with patch.object(MODULE, "run_target", return_value=(0, '{"status":"ok"}')) as target_run, \\
                       patch.object(MODULE, "run_batch", return_value=(0, '{"status":"completed"}')) as bulk_run:
                      ok = MODULE.ingest_range(
                          core=Path("unused"),
                          records=records,
                          first=0,
                          past_last=2,
                          chunk_no=1,
                          import_log=root / "canonical-import.jsonl",
                          failed_log=root / "failed-import.jsonl",
                          run_id="test-run",
                          source_commit="abc123",
                          state=state,
                      )

                  self.assertTrue(ok)
                  target_run.assert_called_once_with(records[0])
                  bulk_run.assert_called_once()
                  self.assertEqual(bulk_run.call_args.args[2:], (1, 2))
                  self.assertEqual(state["confirmed_offset"], 2)
                  self.assertEqual(state["imported_documents"], 2)
                  events = [
                      json.loads(line)
                      for line in (root / "canonical-import.jsonl").read_text().splitlines()
                  ]
                  self.assertEqual(events[0]["record_type"], "target-dispatch")
                  self.assertEqual(events[0]["actor"], "data-governance")
                  self.assertEqual(events[-1]["document_ids"], ["doc-1"])


              def test_non_413_failure_stays_ambiguous_and_does_not_advance(self) -> None:
          '''
          if 'test_target_is_dispatched_separately_from_bulk_documents' not in tests:
              if test_anchor not in tests:
                  raise SystemExit('test anchor not found')
              tests = tests.replace(test_anchor, target_test, 1)
              # Fix indentation of the replaced existing test definition.
              tests = tests.replace(
                  '\n              def test_non_413_failure_stays_ambiguous_and_does_not_advance(self) -> None:\n',
                  '\n    def test_non_413_failure_stays_ambiguous_and_does_not_advance(self) -> None:\n',
                  1,
              )
          test_path.write_text(tests, encoding='utf-8')

          workflow = Path('.github/workflows/temp-backlog-import.yml')
          workflow_text = workflow.read_text(encoding='utf-8')
          marker = '# full retry after verifying tenant_id is absent from corpus'
          if marker in workflow_text:
              workflow_text = workflow_text.replace(
                  marker,
                  '# full retry after target-routing fix',
                  1,
              )
          elif '# full retry after target-routing fix' not in workflow_text:
              workflow_text += '\n# full retry after target-routing fix\n'
          workflow.write_text(workflow_text, encoding='utf-8')
          PY

      - name: Run backlog importer regression tests
        run: python3 -m unittest tests.test_import_starintel_backlog

      - name: Commit fix and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'starintel-ci'
          git config user.email 'starintel-ci@users.noreply.github.com'
          git rm .github/workflows/temp-fix-backlog-target-routing.yml
          git add scripts/import-starintel-backlog.py tests/test_import_starintel_backlog.py .github/workflows/temp-backlog-import.yml
          git commit -m 'fix: route backlog target documents through target dispatch'
          git push origin HEAD:main
