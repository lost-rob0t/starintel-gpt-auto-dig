name: Worker 7 materialize issue 2111 Zavala comparators

on:
  push:
    branches:
      - agent/worker7-zavala-comparator-baseline-20260915
    paths:
      - .github/workflows/worker7-materialize-2111-zavala-comparators.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair packet to executable schema
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("digs/drunk-drivers/2026-09-15-request-2111-zavala-habitual-dwi-comparators/starintel-documents.jsonl")
          docs = []
          for line in path.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              doc = json.loads(line)
              if doc.get("dtype") == "source":
                  data = doc.setdefault("data", {})
                  metadata = data.setdefault("metadata", {})
                  docket = data.pop("docket_number", None)
                  decision_date = data.pop("decision_date", None)
                  if docket is not None:
                      metadata["docket_number"] = docket
                  if decision_date is not None:
                      metadata["decision_date"] = decision_date
              docs.append(doc)
          path.write_text("\n".join(json.dumps(doc, separators=(",", ":"), ensure_ascii=False) for doc in docs) + "\n", encoding="utf-8")
          PY

      - name: Import packet through canonical writer
        run: python3 scripts/starintel.py import digs/drunk-drivers/2026-09-15-request-2111-zavala-habitual-dwi-comparators/starintel-documents.jsonl

      - name: Validate complete StarIntel corpus
        run: python3 scripts/starintel.py validate --root .

      - name: Commit schema repair and importer-generated DB records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digs/drunk-drivers/2026-09-15-request-2111-zavala-habitual-dwi-comparators/starintel-documents.jsonl db/
          if git diff --cached --quiet; then
            echo "No materialized changes"
            exit 0
          fi
          git commit -m "Materialize #2111 Zavala comparator records"
          git push origin HEAD:${GITHUB_REF_NAME}
