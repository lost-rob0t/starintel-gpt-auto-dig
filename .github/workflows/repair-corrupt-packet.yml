name: Diagnose corrupt packet transport

on:
  pull_request:
    types: [synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: diagnose-us-israel-pass-2-packet
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/wef-columbus-depth-6-primary-records'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/wef-columbus-depth-6-primary-records
          fetch-depth: 0

      - name: Recover and inspect raw deflate payload
        shell: python
        run: |
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import re
          import zlib
          from pathlib import Path

          path = Path('digs/us-israel-military-integration/2026-07-31/starintel-documents.jsonl.gz.b64')
          encoded = ''.join(path.read_text(encoding='utf-8').split())
          archive = base64.b64decode(encoded, validate=True)
          payload = zlib.decompress(archive[10:-8], wbits=-zlib.MAX_WBITS)
          text = payload.decode('utf-8')
          lines = [line for line in text.splitlines() if line.strip()]

          print(f'payload_bytes={len(payload)}')
          print(f'payload_sha256={hashlib.sha256(payload).hexdigest()}')
          print(f'line_count={len(lines)}')

          failures = 0
          for line_number, line in enumerate(lines, 1):
              try:
                  document = json.loads(line)
              except json.JSONDecodeError as exc:
                  failures += 1
                  guessed_id = re.search(r'"_id"\s*:\s*"([^"]+)"', line)
                  print(f'BROKEN line={line_number} id={guessed_id.group(1) if guessed_id else "unknown"}')
                  print(f'ERROR msg={exc.msg} pos={exc.pos} line={exc.lineno} col={exc.colno}')
                  start = max(0, exc.pos - 500)
                  end = min(len(line), exc.pos + 500)
                  print('CONTEXT_START')
                  print(line[start:end])
                  print('CONTEXT_END')
              else:
                  print(f'OK line={line_number} id={document.get("_id", "missing")!s}')

          if failures:
              raise SystemExit(f'malformed_records={failures}')
