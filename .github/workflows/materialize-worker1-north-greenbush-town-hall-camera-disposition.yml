name: Materialize Worker 1 North Greenbush packet

on:
  push:
    branches:
      - auto-dig/worker1-north-greenbush-town-hall-camera-disposition-20260915
    paths:
      - '.github/workflows/materialize-worker1-north-greenbush-town-hall-camera-disposition.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto-dig/worker1-north-greenbush-town-hall-camera-disposition-20260915
          fetch-depth: 0
      - name: Inspect live schema authority
        run: |
          set -euo pipefail
          python3 scripts/schema-release.py current
          python3 scripts/schema-release.py check
          python3 scripts/starintel.py types
          python3 scripts/starintel.py schema --dtype analysis >/tmp/analysis-schema.json
          python3 scripts/starintel.py schema --dtype research-pass >/tmp/research-pass-schema.json
      - name: Import bounded canonical packet
        run: |
          set -euo pipefail
          python3 scripts/starintel.py import digs/flock/2026-09-15-request-1897-north-greenbush-town-hall-camera-disposition/starintel-documents.jsonl
      - name: Commit generated canonical records and remove materializer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-worker1-north-greenbush-town-hall-camera-disposition.yml
          git add db/
          git diff --cached --check
          git commit -m "Auto-Dig #1897: materialize Town Hall camera disposition records"
          git push origin HEAD:auto-dig/worker1-north-greenbush-town-hall-camera-disposition-20260915
