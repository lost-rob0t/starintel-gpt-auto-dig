name: Worker 6 materialize request 1894 Woonsocket Newtown portal edges

on:
  push:
    branches:
      - agent/worker6-rensselaer-portal-expansion2-1894-20260915
    paths:
      - digs/flock/2026-09-15-request-1894-woonsocket-newtown-incoming-portal-edges/starintel-documents.jsonl
      - .github/workflows/worker6-materialize-1894-woonsocket-newtown.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import packet through canonical writer
        run: python3 scripts/starintel.py import digs/flock/2026-09-15-request-1894-woonsocket-newtown-incoming-portal-edges/starintel-documents.jsonl

      - name: Commit importer-generated DB records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/
          if git diff --cached --quiet; then
            echo "No importer-generated DB changes"
            exit 0
          fi
          git commit -m "Materialize #1894 Woonsocket/Newtown canonical records"
          git push origin HEAD:${GITHUB_REF_NAME}
