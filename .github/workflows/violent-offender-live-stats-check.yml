name: Violent offender live stats check

on:
  pull_request:
    paths:
      - ".github/workflows/violent-offender-live-stats-check.yml"

permissions:
  contents: read

jobs:
  collect-live-stats:
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: primary
            script: scripts/scrape_violent_offender_localities.py
          - group: expanded
            script: scripts/scrape_violent_offender_localities_extra.py
          - group: high-yield
            script: scripts/scrape_violent_offender_high_yield.py
          - group: batch2
            script: scripts/scrape_violent_offender_batch2.py
    name: collect-${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install collector dependencies
        run: python -m pip install -r requirements/violent-offender-scrapers.txt
      - name: Run ${{ matrix.group }} collectors and print stats
        env:
          GROUP: ${{ matrix.group }}
          SCRIPT: ${{ matrix.script }}
        run: |
          out="artifacts/live-stats/$GROUP"
          mkdir -p "$out"
          set +e
          python "$SCRIPT" --output "$out" --max-records-per-source 2500
          status=$?
          set -e
          echo "COLLECTOR_EXIT $status"
          test -f "$out/summary.json"
          python - "$out/summary.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          cap = 2500
          summary = json.loads(Path(sys.argv[1]).read_text())
          print("=== VIOLENT_OFFENDER_GROUP_STATS ===")
          print("GROUP_RECORDS", summary.get("record_count", 0))
          good = failed = 0
          capped = []
          for source in summary.get("sources", []):
              if source.get("error"):
                  failed += 1
              else:
                  good += 1
              candidates = source.get("candidates_seen", 0) or 0
              if candidates >= cap:
                  capped.append(source.get("source"))
              print(
                  "SOURCE",
                  source.get("source"),
                  "LOCALITY", json.dumps(source.get("locality")),
                  "RECORDS", source.get("records", 0),
                  "CANDIDATES", candidates,
                  "PAGES", source.get("pages_fetched", 0),
                  "ERROR", json.dumps(source.get("error")),
              )
          print("SUCCESSFUL_SOURCES", good)
          print("FAILED_SOURCES", failed)
          print("CAPPED_SOURCES", ",".join(capped) if capped else "none")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: violent-offender-live-stats-${{ matrix.group }}-${{ github.run_id }}
          path: artifacts/live-stats/${{ matrix.group }}/
          if-no-files-found: error
          retention-days: 1
