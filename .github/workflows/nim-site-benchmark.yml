name: One-shot Nim site benchmark

on:
  push:
    branches:
      - agent/gop-dataset-100k-expansion
    paths:
      - .github/workflows/nim-site-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nim-site-benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  NIM_VERSION: 2.2.4

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Install transport and benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gzip coreutils time

      - name: Build Nim site generator
        run: |
          mkdir -p bin
          nim c -d:release --opt:speed --mm:orc \
            --path:scripts \
            --out:bin/starintel-site \
            scripts/starintel_site.nim

      - name: Benchmark complete corpus site generation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/starintel-site /tmp/starintel-org
          /usr/bin/time \
            -f 'site_elapsed=%E\nsite_maxrss_kb=%M' \
            -o site-benchmark.log \
            bin/starintel-site \
              --input digs \
              --db db \
              --output /tmp/starintel-site \
              --org-output /tmp/starintel-org
          test -s /tmp/starintel-site/index.html
          test -s /tmp/starintel-site/search-index.json
          test -s /tmp/starintel-site/downloads/starintel-complete-corpus.jsonl
          test -s /tmp/starintel-site/dataset-gop/downloads/topic-manifest.json
          printf 'site_bytes=%s\n' "$(du -sb /tmp/starintel-site | cut -f1)" >> site-benchmark.log
          printf 'site_files=%s\n' "$(find /tmp/starintel-site -type f | wc -l)" >> site-benchmark.log
          cat site-benchmark.log

      - name: Upload benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nim-site-benchmark
          path: site-benchmark.log
          if-no-files-found: warn
          retention-days: 7
