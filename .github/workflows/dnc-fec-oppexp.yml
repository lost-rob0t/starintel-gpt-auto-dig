name: Generate DNC FEC operating expenditures

on:
  workflow_dispatch:
  push:
    branches:
      - agent/dnc-fec-project-veritas-seed
    paths:
      - scripts/import_dnc_fec_oppexp.py
      - .github/workflows/dnc-fec-oppexp.yml

permissions:
  contents: write

concurrency:
  group: dnc-fec-oppexp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate official FEC operating-expenditure corpus
        run: python3 scripts/import_dnc_fec_oppexp.py

      - name: Compress canonical transport into GitHub-safe parts
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          from pathlib import Path

          root = Path('digs/dnc/2026-07-31-fec-operating-expenditures-2026')
          source = root / 'starintel-documents.jsonl'
          payload = source.read_bytes()
          encoded = base64.b64encode(gzip.compress(payload, compresslevel=9, mtime=0)).decode('ascii')
          chunk_size = 32_000_000
          names: list[str] = []
          for index, start in enumerate(range(0, len(encoded), chunk_size)):
              name = f'starintel-documents.jsonl.gz.b64.part-{index:04d}'
              (root / name).write_text(encoded[start:start + chunk_size] + '\n', encoding='utf-8')
              names.append(name)
          (root / 'starintel-documents.jsonl.gz.b64.parts').write_text(
              ''.join(f'{name}\n' for name in names),
              encoding='utf-8',
          )
          source.unlink()
          print({'raw_bytes': len(payload), 'encoded_bytes': len(encoded), 'parts': len(names)})
          PY

      - name: Validate complete repository
        run: python3 scripts/validate-for-merge.py --site

      - name: Commit generated packet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add digs/dnc/2026-07-31-fec-operating-expenditures-2026
          if git diff --cached --quiet; then
            echo 'Generated packet is unchanged.'
            exit 0
          fi
          git commit -m 'Add 2026 DNC FEC operating-expenditure corpus [skip ci]'
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin HEAD:${TARGET_BRANCH}
