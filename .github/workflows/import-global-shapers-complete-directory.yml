name: Import complete Global Shapers directory

on:
  push:
    branches:
      - agent/global-shapers-13k-directory
    paths:
      - "imports/global-shapers/**"
      - "scripts/run_global_shapers_complete_import.py"
      - "scripts/build_research_site.py"
      - ".github/workflows/import-global-shapers-complete-directory.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write

concurrency:
  group: global-shapers-complete-directory
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install public-web and browser dependencies
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml playwright
          python -m playwright install --with-deps chromium

      - name: Verify and restore importer
        run: |
          python scripts/run_global_shapers_complete_import.py --help
          python -m compileall -q scripts starintel_doc

      - name: Remove superseded Global Shapers packet
        run: rm -rf digs/global-shapers/global-shapers-complete-public-directory-*

      - name: Enumerate current members and entire exposed alumni corpus
        run: |
          python scripts/run_global_shapers_complete_import.py \
            --root . \
            --minimum-people 13000 \
            --workers 32 \
            --max-hubs 650

      - name: Enforce permanent 13k site threshold
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("site-config.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          config["minimum_people_profiles"] = 13000
          path.write_text(json.dumps(config, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Validate corpus and generated people pages
        run: |
          python scripts/starintel.py validate --root .
          python scripts/build_research_site.py \
            --input digs \
            --db db \
            --output _site \
            --org-output .generated/org
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("_site")
          people = json.loads((root / "people" / "people.json").read_text(encoding="utf-8"))
          assert len(people) >= 13000, len(people)
          assert sum((root / "people" / record["url"]).is_file() for record in people) == len(people)
          imported = json.loads(Path("reports/global-shapers-complete-directory.json").read_text(encoding="utf-8"))
          assert imported["people"] >= 13000, imported["people"]
          print(json.dumps({
              "directory_people": len(people),
              "imported_global_shapers": imported["people"],
              "alumni_linked": sum("alumni" in record.get("statuses", []) for record in people),
          }, indent=2))
          PY

      - name: Commit complete public directory packet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            digs/global-shapers \
            reports/global-shapers-complete-directory.json \
            reports/global-shapers-complete-directory.md \
            site-config.json
          if git diff --cached --quiet; then
            echo "No directory changes to commit"
          else
            count=$(python -c 'import json; print(json.load(open("reports/global-shapers-complete-directory.json"))["people"])')
            git commit -m "Import ${count} Global Shapers and alumni profiles"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Commit crawl diagnostics after failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            reports/global-shapers-complete-directory.json \
            reports/global-shapers-complete-directory.md || true
          if ! git diff --cached --quiet; then
            git commit -m "Record incomplete Global Shapers crawl diagnostics"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload crawl report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-shapers-complete-directory-report
          path: |
            reports/global-shapers-complete-directory.json
            reports/global-shapers-complete-directory.md
          if-no-files-found: warn
          retention-days: 14
