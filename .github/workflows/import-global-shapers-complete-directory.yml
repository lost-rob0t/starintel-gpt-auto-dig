name: Import complete Global Shapers directory

on:
  pull_request:
    branches:
      - main
    paths:
      - "imports/global-shapers/**"
      - "imports/.wef-shapers-compact/**"
      - "scripts/import_legacy_shapers_alumni.py"
      - "scripts/salvage_legacy_shapers_prefix.py"
      - "scripts/enumerate_global_shapers_city_hubs.py"
      - "scripts/enumerate_global_shapers_archives.py"
      - "scripts/run_global_shapers_complete_import.py"
      - "scripts/build_research_site.py"
      - ".github/workflows/import-global-shapers-complete-directory.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write

concurrency:
  group: global-shapers-complete-directory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install crawler, archive, gazetteer, and browser dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            requests beautifulsoup4 lxml playwright geonamescache
          python -m playwright install --with-deps chromium

      - name: Verify import and discovery scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python scripts/salvage_legacy_shapers_prefix.py --help
          python scripts/enumerate_global_shapers_city_hubs.py --help
          python scripts/enumerate_global_shapers_archives.py --help
          python scripts/run_global_shapers_complete_import.py --help \
            | tee reports/global-shapers-importer-help.txt
          python -m compileall -q scripts starintel_doc

      - name: Salvage intact 2,736-person legacy prefix
        run: python scripts/salvage_legacy_shapers_prefix.py --root .

      - name: Enumerate world cities and resolve official hub URLs
        run: |
          python scripts/enumerate_global_shapers_city_hubs.py \
            --root . \
            --city-file imports/global-shapers/retained-city-seeds.txt \
            --output reports/global-shapers-city-hubs.json \
            --hub-url-file imports/global-shapers/generated-hub-urls.txt \
            --profile-url-file imports/global-shapers/generated-member-profile-urls.txt \
            --max-cities 7000 \
            --geonames-limit 6000 \
            --min-population 50000 \
            --minimum-hubs 400 \
            --workers 64 \
            --timeout 8 \
            --max-clicks 500

      - name: Enumerate archived official profile URLs
        run: |
          python scripts/enumerate_global_shapers_archives.py \
            --output imports/global-shapers/generated-archive-profile-urls.txt \
            --report reports/global-shapers-archive-urls.json \
            --common-crawl-indexes 12 \
            --workers 16 \
            --timeout 90 \
            --minimum-urls 1000

      - name: Merge live, hub, and archive profile seeds
        run: |
          cat \
            imports/global-shapers/generated-member-profile-urls.txt \
            imports/global-shapers/generated-archive-profile-urls.txt \
            | sed '/^[[:space:]]*$/d' \
            | sort -u \
            > imports/global-shapers/generated-all-profile-urls.txt
          cp imports/global-shapers/generated-all-profile-urls.txt \
            imports/global-shapers/generated-member-profile-urls.txt
          python - <<'PY'
          import json
          from pathlib import Path

          hubs = json.loads(Path("reports/global-shapers-city-hubs.json").read_text(encoding="utf-8"))
          archives = json.loads(Path("reports/global-shapers-archive-urls.json").read_text(encoding="utf-8"))
          prefix = json.loads(Path("reports/wef-global-shapers-intact-prefix.json").read_text(encoding="utf-8"))
          merged = sum(1 for line in Path("imports/global-shapers/generated-all-profile-urls.txt").read_text().splitlines() if line.strip())
          assert hubs["hub_url_count"] >= 400, hubs["hub_url_count"]
          assert archives["profile_url_count"] >= 1000, archives["profile_url_count"]
          assert prefix["prefix"]["people"] >= 2700, prefix["prefix"]["people"]
          print(json.dumps({
              "intact_legacy_people": prefix["prefix"]["people"],
              "resolved_hubs": hubs["hub_url_count"],
              "hub_profile_seeds": hubs["profile_seed_url_count"],
              "archive_profile_urls": archives["profile_url_count"],
              "merged_profile_urls": merged,
          }, indent=2))
          PY

      - name: Checkpoint discovery evidence before hydration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            digs/wef/global-shapers-legacy-intact-prefix \
            imports/global-shapers/retained-city-seeds.txt \
            imports/global-shapers/generated-hub-urls.txt \
            imports/global-shapers/generated-member-profile-urls.txt \
            imports/global-shapers/generated-archive-profile-urls.txt \
            imports/global-shapers/generated-all-profile-urls.txt \
            reports/global-shapers-importer-help.txt \
            reports/global-shapers-city-hubs.json \
            reports/global-shapers-archive-urls.json \
            reports/wef-global-shapers-intact-prefix.json \
            reports/wef-global-shapers-intact-prefix.md
          do
            if [[ -e "$path" ]]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            profiles=$(wc -l < imports/global-shapers/generated-all-profile-urls.txt)
            hubs=$(python -c 'import json; print(json.load(open("reports/global-shapers-city-hubs.json"))["hub_url_count"])')
            git commit -m "Enumerate ${hubs} hubs and ${profiles} profile URLs"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Remove superseded live Global Shapers packet
        run: rm -rf digs/global-shapers/global-shapers-complete-public-directory-*

      - name: Hydrate current and archived profile identities
        env:
          GLOBAL_SHAPERS_HUB_URL_FILE: imports/global-shapers/generated-hub-urls.txt
          GLOBAL_SHAPERS_PROFILE_URL_FILE: imports/global-shapers/generated-member-profile-urls.txt
        run: |
          python scripts/run_global_shapers_complete_import.py \
            --root . \
            --minimum-people 13000 \
            --workers 32 \
            --max-hubs 700

      - name: Enforce permanent 13k site threshold
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("site-config.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          config["minimum_people_profiles"] = 13000
          path.write_text(json.dumps(config, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Validate corpus and generated people pages
        run: |
          python scripts/starintel.py validate --root .
          python scripts/build_research_site.py \
            --input digs \
            --db db \
            --output _site \
            --org-output .generated/org
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("_site")
          people = json.loads((root / "people" / "people.json").read_text(encoding="utf-8"))
          assert len(people) >= 13000, len(people)
          assert sum((root / "people" / record["url"]).is_file() for record in people) == len(people)
          imported = json.loads(Path("reports/global-shapers-complete-directory.json").read_text(encoding="utf-8"))
          prefix = json.loads(Path("reports/wef-global-shapers-intact-prefix.json").read_text(encoding="utf-8"))
          hubs = json.loads(Path("reports/global-shapers-city-hubs.json").read_text(encoding="utf-8"))
          archives = json.loads(Path("reports/global-shapers-archive-urls.json").read_text(encoding="utf-8"))
          assert imported["people"] >= 13000, imported["people"]
          assert prefix["prefix"]["people"] >= 2700
          assert hubs["hub_url_count"] >= 400
          assert archives["profile_url_count"] >= 1000
          print(json.dumps({
              "directory_people": len(people),
              "imported_global_shapers": imported["people"],
              "intact_legacy_people": prefix["prefix"]["people"],
              "resolved_hubs": hubs["hub_url_count"],
              "archive_profile_urls": archives["profile_url_count"],
              "alumni_linked": sum("alumni" in record.get("statuses", []) for record in people),
          }, indent=2))
          PY

      - name: Commit complete public directory packet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            digs/global-shapers \
            reports/global-shapers-complete-directory.json \
            reports/global-shapers-complete-directory.md \
            site-config.json
          do
            if [[ -e "$path" ]]; then git add "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "No directory changes to commit"
          else
            count=$(python -c 'import json; print(json.load(open("reports/global-shapers-complete-directory.json"))["people"])')
            git commit -m "Import ${count} Global Shapers and alumni profiles"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Commit crawl diagnostics after failure
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            digs/wef/global-shapers-legacy-intact-prefix \
            imports/global-shapers/retained-city-seeds.txt \
            imports/global-shapers/generated-hub-urls.txt \
            imports/global-shapers/generated-member-profile-urls.txt \
            imports/global-shapers/generated-archive-profile-urls.txt \
            imports/global-shapers/generated-all-profile-urls.txt \
            reports/global-shapers-importer-help.txt \
            reports/global-shapers-city-hubs.json \
            reports/global-shapers-archive-urls.json \
            reports/wef-global-shapers-intact-prefix.json \
            reports/wef-global-shapers-intact-prefix.md \
            reports/global-shapers-complete-directory.json \
            reports/global-shapers-complete-directory.md
          do
            if [[ -e "$path" ]]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Record Global Shapers reconstruction diagnostics"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Upload reconstruction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-shapers-complete-directory-report
          path: |
            reports/global-shapers-importer-help.txt
            reports/global-shapers-city-hubs.json
            reports/global-shapers-archive-urls.json
            reports/wef-global-shapers-intact-prefix.json
            reports/wef-global-shapers-intact-prefix.md
            reports/global-shapers-complete-directory.json
            reports/global-shapers-complete-directory.md
            imports/global-shapers/retained-city-seeds.txt
            imports/global-shapers/generated-hub-urls.txt
            imports/global-shapers/generated-member-profile-urls.txt
            imports/global-shapers/generated-archive-profile-urls.txt
            imports/global-shapers/generated-all-profile-urls.txt
          if-no-files-found: warn
          retention-days: 14
