name: Upgrade Prolog-RLM 304

on:
  push:
    branches:
      - fix/use-prolog-rlm-304-context-peek

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin fixed Prolog-RLM
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/auto-dig-prolog-actor.yml')
          source = path.read_text()
          old = 'PROLOG_RLM_REF: eb2411afdaf981a0a121f55b7ddf23dc9fcef812'
          new = 'PROLOG_RLM_REF: b654831a0150a593821179da1d3886dfd64deb5c'
          if old in source:
              path.write_text(source.replace(old, new, 1))
          elif new not in source:
              raise SystemExit('expected Prolog-RLM pin not found')
          PY

      - name: Install SWI-Prolog
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends swi-prolog-nox

      - name: Check out fixed Prolog-RLM
        uses: actions/checkout@v4
        with:
          repository: lost-rob0t/prolog-rlm
          ref: b654831a0150a593821179da1d3886dfd64deb5c
          path: .prolog-rlm

      - name: Test consumer against fixed runtime
        shell: bash
        run: |
          set -euo pipefail
          (
            cd .prolog-rlm
            swipl -q -s test/check_runtime.pl
            swipl -q -s test/load_all.pl
            swipl -q -s test/rlm_direct_context_peek_contract_test.pl -g 'run_tests,halt'
            swipl -q -s test/rlm_direct_test.pl -g 'run_tests,halt'
          )
          swipl -q -p "library=$GITHUB_WORKSPACE/.prolog-rlm/prolog" \
            -s agents/test_auto_dig_rlm_runner.pl -g 'run_tests,halt'

      - name: Commit upgraded pin
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .prolog-rlm
          if git diff --quiet -- .github/workflows/auto-dig-prolog-actor.yml; then
            exit 0
          fi
          git config user.name 'auto-dig-upgrade[bot]'
          git config user.email 'auto-dig-upgrade@users.noreply.github.com'
          git add .github/workflows/auto-dig-prolog-actor.yml
          git commit -m 'fix: pin Prolog-RLM context peek contract fix'
          git push origin HEAD:fix/use-prolog-rlm-304-context-peek
