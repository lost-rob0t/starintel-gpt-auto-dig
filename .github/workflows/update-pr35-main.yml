name: Update PR35 from main

on:
  push:
    branches:
      - agent/us-israel-military-integration

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/us-israel-military-integration
          fetch-depth: 0

      - name: Merge main and fix Schema.org mapping
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          python - <<'PY'
          from pathlib import Path

          path = Path("starintel_doc/schema_org.py")
          text = path.read_text(encoding="utf-8")
          mapping = '    "research-node": ("CreativeWork",),\n'
          marker = '    "research-pass": ("CreativeWork",),\n'
          if mapping not in text:
              if marker not in text:
                  raise SystemExit("research-pass Schema.org mapping marker not found")
              text = text.replace(marker, marker + mapping, 1)
              path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/update-pr35-main.yml
          git add starintel_doc/schema_org.py .github/workflows/update-pr35-main.yml
          git commit -m "fix Schema.org mapping for research nodes"
          git push origin HEAD:agent/us-israel-military-integration
