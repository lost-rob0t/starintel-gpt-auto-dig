name: Worker 2 materialize request 2514 POSTC alignment

on:
  push:
    branches:
      - agent/worker2-danbury-postc-alignment-2514-20260915
    paths:
      - digs/danbury/2026-09-15-request-2514-postc-alignment/starintel-documents.jsonl
      - .github/workflows/worker2-materialize-2514-postc.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import packet through canonical writer
        run: python3 scripts/starintel.py import digs/danbury/2026-09-15-request-2514-postc-alignment/starintel-documents.jsonl

      - name: Validate complete StarIntel corpus
        run: python3 scripts/starintel.py validate --root .

      - name: Commit importer-generated DB records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/
          if git diff --cached --quiet; then
            echo "No importer-generated DB changes"
            exit 0
          fi
          git commit -m "Materialize #2514 POSTC alignment canonical records"
          git push origin HEAD:${GITHUB_REF_NAME}
