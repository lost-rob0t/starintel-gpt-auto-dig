name: Generate Columbus CPD Flock control-plane packet

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/.tmp-flock-cpd-control-plane.b64.*"
      - "scripts/.tmp-generate-flock-cpd-control-plane.py"
      - ".github/workflows/generate-flock-cpd-control-plane.yml"

permissions:
  actions: write
  contents: write
  pull-requests: read
  statuses: write

concurrency:
  group: generate-flock-columbus-cpd-control-plane
  cancel-in-progress: false

env:
  BRANCH: agent/flock-columbus-cpd-control-plane
  PACKET: digs/flock-safety/2026-07-26-columbus-cpd-control-plane

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate packet
        id: generate
        shell: bash
        run: |
          set +e
          python3 scripts/.tmp-generate-flock-cpd-control-plane.py > /tmp/flock-cpd.stdout 2> /tmp/flock-cpd.stderr
          status=$?
          set -e
          cat /tmp/flock-cpd.stdout
          if [ "$status" -ne 0 ]; then
            {
              echo "generator exit status: $status"
              echo
              cat /tmp/flock-cpd.stderr
            } > .tmp-flock-cpd-failure.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .tmp-flock-cpd-failure.log
            git commit -m "Capture CPD Flock generator failure" || true
            git push origin HEAD:${BRANCH}
            exit "$status"
          fi

      - name: Remove one-shot transport
        run: |
          rm -f .tmp-flock-cpd-failure.log
          git rm \
            .github/workflows/generate-flock-cpd-control-plane.yml \
            scripts/.tmp-generate-flock-cpd-control-plane.py \
            scripts/.tmp-flock-cpd-control-plane.b64.00 \
            scripts/.tmp-flock-cpd-control-plane.b64.01 \
            scripts/.tmp-flock-cpd-control-plane.b64.02 \
            scripts/.tmp-flock-cpd-control-plane.b64.03

      - name: Run mandatory merge gate on final tree
        run: python3 scripts/validate-for-merge.py --site

      - name: Commit generated packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${PACKET}" \
            .github/workflows/generate-flock-cpd-control-plane.yml \
            scripts/.tmp-generate-flock-cpd-control-plane.py \
            scripts/.tmp-flock-cpd-control-plane.b64.00 \
            scripts/.tmp-flock-cpd-control-plane.b64.01 \
            scripts/.tmp-flock-cpd-control-plane.b64.02 \
            scripts/.tmp-flock-cpd-control-plane.b64.03
          git commit -m "Publish Columbus CPD Flock control-plane packet"
          git push origin HEAD:${BRANCH}
          head_sha=$(git rev-parse HEAD)
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
            -f state=success \
            -f context='StarIntel merge gate' \
            -f description='Canonical validation and site build passed on generated tree'
