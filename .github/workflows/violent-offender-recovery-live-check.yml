name: Violent offender recovery live check

on:
  pull_request:
    paths:
      - "scripts/scrape_violent_offender_recovery.py"
      - "scripts/scrape_violent_offender_recovery_fixups.py"
      - "scripts/scrape_violent_offender_recovery_entry.py"
      - "scripts/scrape_violent_offender_localities.py"
      - "requirements/violent-offender-scrapers.txt"
      - ".github/workflows/violent-offender-recovery-live-check.yml"

permissions:
  contents: read

jobs:
  recover-franklin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scraper dependencies
        run: python -m pip install -r requirements/violent-offender-scrapers.txt
      - name: Run Franklin live recovery
        run: |
          out="artifacts/recovery-live/franklin"
          mkdir -p "$out"
          set +e
          timeout 12m python scripts/scrape_violent_offender_recovery_entry.py \
            --source franklin \
            --output "$out" \
            --timeout 30 \
            --max-records-per-source 500
          status=$?
          set -e
          echo "COLLECTOR_EXIT=$status"
          test -f "$out/summary.json"
          python - "$out/summary.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          summary = json.loads(Path(sys.argv[1]).read_text())
          source = summary["sources"][0]
          print(
              "LIVE_SOURCE", source.get("source"),
              "RECORDS", source.get("records", 0),
              "CANDIDATES", source.get("candidates_seen", 0),
              "PAGES", source.get("pages_fetched", 0),
              "ERROR", json.dumps(source.get("error")),
          )
          if source.get("error"):
              raise SystemExit(source["error"])
          if source.get("candidates_seen", 0) == 0:
              raise SystemExit("false-zero guard: Franklin returned zero candidates")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: violent-offender-recovery-franklin-${{ github.run_id }}
          path: artifacts/recovery-live/franklin/
          if-no-files-found: warn
          retention-days: 1
