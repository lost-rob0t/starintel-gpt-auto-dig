name: Worker 7 materialize request 2111 Zavala baseline

on:
  push:
    branches:
      - agent/worker7-zavala-sentencing-baseline-2111-20260915
    paths:
      - digs/drunk-drivers/2026-09-15-request-2111-zavala-sentencing-baseline/starintel-documents.jsonl
      - .github/workflows/worker7-materialize-2111-zavala.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import packet through canonical writer
        run: python3 scripts/starintel.py import digs/drunk-drivers/2026-09-15-request-2111-zavala-sentencing-baseline/starintel-documents.jsonl

      - name: Validate complete StarIntel corpus
        run: python3 scripts/starintel.py validate --root .

      - name: Commit importer-generated DB records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/
          if git diff --cached --quiet; then
            echo "No importer-generated DB changes"
            exit 0
          fi
          git commit -m "Materialize #2111 Zavala sentencing canonical records"
          git push origin HEAD:${GITHUB_REF_NAME}
