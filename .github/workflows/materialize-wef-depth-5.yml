name: Materialize WEF depth 5 packet

on:
  push:
    branches:
      - agent/wef-depth-5-policy-contract-implementation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wef-depth-5-policy-contract-implementation
          fetch-depth: 0

      - name: Write packet
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = """"""
          output = Path("digs/wef-columbus/2026-07-26-depth-5-policy-contract-implementation/starintel-documents.jsonl")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY

      - name: Validate
        run: python3 scripts/validate-for-merge.py --site

      - name: Commit packet
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add digs/wef-columbus/2026-07-26-depth-5-policy-contract-implementation/starintel-documents.jsonl
          git rm .github/workflows/materialize-wef-depth-5.yml
          git commit -m "Add WEF depth 5 implementation research"
          git push origin HEAD:agent/wef-depth-5-policy-contract-implementation
