name: Temporary PR 78 transport export

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.number == 1956
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/pr-78-takeover-fix
          fetch-depth: 0
      - name: Extract completed restoration commit
        shell: bash
        run: |
          set -euo pipefail
          commit=598be2c96681f63381e3579a126526c0cb5674d1
          mkdir -p completed-restoration
          git show --format='COMMIT %H%nPARENTS %P%nSUBJECT %s' --name-status --stat "$commit" > completed-restoration/commit.txt
          git ls-tree -r --name-only "$commit" \
            | grep -E '(^imports/\.wef-shapers-(compact|source)/|^digs/wef/global-shapers-legacy-alumni-4062/|^reports/wef-global-shapers-alumni-import\.(json|md)$|^scripts/(restore_legacy_global_shapers_packet|import_legacy_shapers_alumni)\.py$|^imports/global-shapers/retained-city-seeds\.txt$)' \
            > completed-restoration/paths.txt
          while IFS= read -r path; do
            mkdir -p "completed-restoration/$(dirname "$path")"
            git show "$commit:$path" > "completed-restoration/$path"
          done < completed-restoration/paths.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr78-completed-restoration
          path: completed-restoration
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
