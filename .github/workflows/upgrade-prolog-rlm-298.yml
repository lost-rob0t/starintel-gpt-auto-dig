name: Upgrade Prolog-RLM 298

on:
  push:
    branches:
      - fix/use-prolog-rlm-298-schema-fix

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin fixed Prolog-RLM and restore full research tools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/auto-dig-prolog-actor.yml')
          text = workflow.read_text()
          text = text.replace(
              'PROLOG_RLM_REF: a89175bf925df3afa358f8d05a370fe2a03e2117',
              'PROLOG_RLM_REF: eb2411afdaf981a0a121f55b7ddf23dc9fcef812',
              1,
          )
          workflow.write_text(text)

          tools = Path('agents/auto_dig_mcp_tools.pl')
          text = tools.read_text()
          marker = "auto_dig_mcp_read_tool(brave, brave_summarizer).\n"
          restored = marker + "auto_dig_mcp_read_tool(brave, brave_llm_context).\n"
          if 'auto_dig_mcp_read_tool(brave, brave_llm_context).' not in text:
              if marker not in text:
                  raise SystemExit('Brave summarizer marker not found')
              text = text.replace(marker, restored, 1)
          text = text.replace(
              ' * `brave_llm_context` is temporarily withheld from direct-mode projection.\n'
              ' * Its current MCP JSON Schema contains a union/unconstrained field that the\n'
              ' * pinned Prolog-RLM normalizes to type:any, while native provider rendering\n'
              ' * rejects type:any before the first model call. Prolog-RLM #298 tracks the\n'
              ' * proper renderer fix. Keep the other thirteen read-only tools available.\n',
              ' * The pinned Prolog-RLM now renders runtime type:any as unconstrained provider\n'
              ' * JSON Schema, so the complete trusted Brave + Fetch inventory is projectable.\n',
              1,
          )
          tools.write_text(text)

          tests = Path('agents/test_auto_dig_rlm_runner.pl')
          text = tests.read_text()
          text = text.replace(
              'test(mcp_registry_and_projectable_read_tool_inventory_are_projected) :-',
              'test(mcp_registry_and_complete_read_tool_inventory_are_projected) :-',
              1,
          )
          text = text.replace('assertion(CapabilityCount =:= 13),', 'assertion(CapabilityCount =:= 14),', 1)
          text = text.replace(
              "    assertion(\\+ memberchk(tool('mcp.brave.brave_llm_context'),\n"
              "                           McpCapabilities)),\n",
              '',
              1,
          )
          marker = "    assertion(memberchk(tool('mcp.brave.brave_summarizer'), Capabilities)),\n"
          restored = marker + "    assertion(memberchk(tool('mcp.brave.brave_llm_context'), Capabilities)),\n"
          if "tool('mcp.brave.brave_llm_context'), Capabilities" not in text:
              if marker not in text:
                  raise SystemExit('test summarizer marker not found')
              text = text.replace(marker, restored, 1)
          tests.write_text(text)
          PY

      - name: Install SWI-Prolog
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends swi-prolog-nox

      - name: Check out fixed Prolog-RLM
        uses: actions/checkout@v4
        with:
          repository: lost-rob0t/prolog-rlm
          ref: eb2411afdaf981a0a121f55b7ddf23dc9fcef812
          path: .prolog-rlm

      - name: Test Auto-Dig against fixed runtime
        shell: bash
        run: |
          set -euo pipefail
          (
            cd .prolog-rlm
            swipl -q -s test/check_runtime.pl
            swipl -q -s test/load_all.pl
            swipl -q -s test/rlm_native_tool_test.pl -g 'run_tests,halt'
            swipl -q -s test/rlm_native_any_schema_test.pl -g 'run_tests,halt'
          )
          swipl -q -p "library=$GITHUB_WORKSPACE/.prolog-rlm/prolog" \
            -s agents/test_auto_dig_rlm_runner.pl -g 'run_tests,halt'

      - name: Commit upgraded consumer
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/auto-dig-prolog-actor.yml agents/auto_dig_mcp_tools.pl agents/test_auto_dig_rlm_runner.pl; then
            exit 0
          fi
          git config user.name 'auto-dig-upgrade[bot]'
          git config user.email 'auto-dig-upgrade@users.noreply.github.com'
          git add .github/workflows/auto-dig-prolog-actor.yml agents/auto_dig_mcp_tools.pl agents/test_auto_dig_rlm_runner.pl
          git commit -m 'fix: use Prolog-RLM unconstrained schema support'
          git push origin HEAD:fix/use-prolog-rlm-298-schema-fix
