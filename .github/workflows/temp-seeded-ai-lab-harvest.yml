name: TEMP seeded AI-lab org-member harvest

on:
  pull_request:
    paths:
      - ".github/workflows/temp-seeded-ai-lab-harvest.yml"

permissions:
  actions: read
  contents: read

env:
  STAR_INGEST_URL: https://ingest.starintel.actor
  SEEDED_DISPATCH_BRANCH: autodig/worker-1-seeded-ai-lab-dispatch-20260915

jobs:
  harvest-seeded-ai-lab-output:
    if: github.head_ref == 'autodig/worker-1-seeded-ai-lab-dispatch-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inspect target state and canonical output visibility
        env:
          STAR_SERVER_API_KEY: ${{ secrets.STAR_SERVER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          credential="${STAR_SERVER_API_KEY#Bearer }"
          outdir="$RUNNER_TEMP/seeded-ai-lab-state"
          mkdir -p "$outdir"

          context_code="$(curl --silent --show-error --output "$outdir/auth-context.json" --write-out '%{http_code}' \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${credential}" \
            "${STAR_INGEST_URL}/auth/context")"
          test "$context_code" = "200"
          jq -e '.scopes | index("targets:read") != null' "$outdir/auth-context.json" >/dev/null

          targets_code="$(curl --silent --show-error --output "$outdir/org-member-targets.json" --write-out '%{http_code}' \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${credential}" \
            "${STAR_INGEST_URL}/targets/org-member")"

          for slug in deepseek-ai anthropic openai; do
            org_id="starintel:theorg:org:${slug}"
            encoded_id="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$org_id")"
            org_code="$(curl --silent --show-error --output "$outdir/${slug}-org.json" --write-out '%{http_code}' \
              --header "Accept: application/json" \
              --header "Authorization: Bearer ${credential}" \
              "${STAR_INGEST_URL}/api/v1/documents/${encoded_id}")"
            jq -nc --arg slug "$slug" --arg org_id "$org_id" --arg org_http_status "$org_code" \
              '{record_type:"org-member-output-visibility",slug:$slug,org_id:$org_id,org_http_status:$org_http_status}' \
              | tee -a "$outdir/coverage.jsonl"
          done

          jq -nc --arg http_status "$targets_code" --argjson bytes "$(wc -c < "$outdir/org-member-targets.json")" \
            '{record_type:"org-member-target-state",http_status:$http_status,bytes:$bytes}' \
            | tee -a "$outdir/coverage.jsonl"

      - name: Upload seeded target and output state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seeded-ai-lab-org-member-state
          path: ${{ runner.temp }}/seeded-ai-lab-state
          if-no-files-found: warn
          retention-days: 90
