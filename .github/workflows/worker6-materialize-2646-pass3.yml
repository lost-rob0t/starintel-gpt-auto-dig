name: Worker 6 materialize request 2646 pass 3

on:
  push:
    branches:
      - agent/worker6-beth-din-md-pass3-2646-20260915
    paths:
      - digs/religious-courts/2026-09-15-beth-din-maryland-civil-review-pass3/starintel-documents.jsonl
      - .github/workflows/worker6-materialize-2646-pass3.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import packet through canonical writer
        run: python3 scripts/starintel.py import digs/religious-courts/2026-09-15-beth-din-maryland-civil-review-pass3/starintel-documents.jsonl

      - name: Validate complete StarIntel corpus
        run: python3 scripts/starintel.py validate --root .

      - name: Commit importer-generated DB records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/
          if git diff --cached --quiet; then
            echo "No importer-generated DB changes"
            exit 0
          fi
          git commit -m "Materialize #2646 Maryland pass-3 canonical records"
          git push origin HEAD:${GITHUB_REF_NAME}
