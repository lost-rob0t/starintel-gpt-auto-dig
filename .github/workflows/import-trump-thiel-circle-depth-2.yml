name: Import trump-thiel-circle cabinet depth 2

on:
  pull_request:
    branches:
      - main
      - agent/bhr-partners-depth-1-5-rebased
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/import-trump-thiel-circle-depth-2.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v6
        with:
          ref: agent/trump-thiel-circle-cabinet-depth-2-rebased
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Restore exact validated packet
        run: |
          git fetch --no-tags --depth=1 origin 5ac24f2f98c5fddf5fca4321bf17da7e806a3e32
          git checkout 5ac24f2f98c5fddf5fca4321bf17da7e806a3e32 -- \
            digs/trump-thiel-circle/2026-07-31-cabinet-seed \
            digs/trump-thiel-circle/2026-07-31-depth-2

      - name: Run packet builders
        run: |
          python3 digs/trump-thiel-circle/2026-07-31-cabinet-seed/build-starintel.py
          python3 digs/trump-thiel-circle/2026-07-31-depth-2/build-depth2.py

      - name: Run mandatory merge gate
        run: python3 scripts/validate-for-merge.py

      - name: Commit imported packet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digs/trump-thiel-circle/2026-07-31-cabinet-seed \
                  digs/trump-thiel-circle/2026-07-31-depth-2
          git diff --cached --check
          git commit -m "Restore trump-thiel-circle cabinet depth 2 packet"
          git push origin HEAD:agent/trump-thiel-circle-cabinet-depth-2-rebased
