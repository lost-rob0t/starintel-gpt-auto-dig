name: Cleanup accidental benchmark workflow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-accidental-benchmark.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Remove accidental one-shot workflow and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/nim-site-benchmark-status.yml
          rm .github/workflows/cleanup-accidental-benchmark.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Remove accidental benchmark workflow'
          git push origin HEAD:main
