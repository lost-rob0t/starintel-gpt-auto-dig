# One-shot schema repair; remove after the normalized packet commit lands.
name: Repair federal executive packet

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/repair-fed-executive-packet.yml
      - scripts/repair-fed-executive-packet.py

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/fed-executive-cabinet-advisers-repaired

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Normalize packet to strict StarIntel v0.9
        run: python3 scripts/repair-fed-executive-packet.py

      - name: Run mandatory merge gate
        run: python3 scripts/validate-for-merge.py

      - name: Commit normalized packet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digs/fed/2026-07-31-executive-branch-cabinet-advisors-pass-1
          git diff --cached --check
          git commit -m "Normalize federal executive packet to StarIntel v0.9"
          git push origin HEAD:agent/fed-executive-cabinet-advisers-repaired
