# One-shot schema repair; remove after the normalized packet commit lands.
name: Repair federal executive packet

on:
  push:
    branches:
      - agent/fed-executive-cabinet-advisers-repaired
    paths:
      - .github/workflows/repair-fed-executive-packet.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/fed-executive-cabinet-advisers-repaired

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Normalize packet to strict StarIntel v0.9
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import json
          import re
          from pathlib import Path

          from starintel_doc.spec import DTYPE_ALIASES, TYPE_FIELDS
          from starintel_doc.validation import validate_document

          packet = Path("digs/fed/2026-07-31-executive-branch-cabinet-advisors-pass-1")
          transport_path = packet / "starintel-documents.jsonl.gz.b64"
          target_path = packet / "recursive-targets-pass-1.jsonl"
          manifest_path = packet / "manifest.json"
          readme_path = packet / "README.md"

          encoded = "".join(transport_path.read_text(encoding="utf-8").split())
          original_gzip = base64.b64decode(encoded, validate=True)
          original_jsonl = gzip.decompress(original_gzip).decode("utf-8")
          documents = [
              json.loads(line)
              for line in original_jsonl.splitlines()
              if line.strip()
          ]

          priority_map = {
              "low": 0.25,
              "medium": 0.5,
              "normal": 0.5,
              "high": 0.85,
              "urgent": 1.0,
              "critical": 1.0,
          }

          for document in documents:
              data = document.setdefault("data", {})
              extensions = document.setdefault("extensions", {})
              legacy = extensions.setdefault("legacy_data", {})
              dtype = DTYPE_ALIASES.get(str(document.get("dtype", "")), str(document.get("dtype", "")))

              if dtype in {"target", "investigation-target"}:
                  questions = data.get("questions")
                  if isinstance(questions, list) and questions:
                      data.setdefault("objectives", [str(item) for item in questions])
                      data.setdefault("research_question", str(questions[0]))
                  next_sources = data.get("next_sources")
                  if isinstance(next_sources, list) and next_sources:
                      data.setdefault("preferred_sources", [str(item) for item in next_sources])
                  priority = data.get("priority")
                  if isinstance(priority, str):
                      legacy.setdefault("priority", priority)
                      data["priority"] = priority_map.get(priority.lower(), 0.5)
                  data.setdefault(
                      "target",
                      document.get("title")
                      or document.get("summary")
                      or data.get("research_question")
                      or data.get("query")
                      or document["_id"],
                  )

              if dtype == "relation":
                  qualifiers = data.setdefault("qualifiers", {})
                  for key in ("appointment_status", "confirmation_date"):
                      if key in data:
                          qualifiers.setdefault(key, data[key])

              allowed = set(TYPE_FIELDS[dtype])
              for key in list(data):
                  if key not in allowed:
                      legacy.setdefault(key, data.pop(key))

              if not legacy:
                  extensions.pop("legacy_data", None)
              if not extensions:
                  document.pop("extensions", None)

              validate_document(document)

          payload = (
              "\n".join(
                  json.dumps(document, sort_keys=True, separators=(",", ":"), ensure_ascii=False)
                  for document in documents
              )
              + "\n"
          ).encode("utf-8")
          compressed = gzip.compress(payload, compresslevel=9, mtime=0)
          transport_path.write_text(
              base64.b64encode(compressed).decode("ascii") + "\n",
              encoding="utf-8",
          )

          targets = [
              document
              for document in documents
              if DTYPE_ALIASES.get(str(document.get("dtype", "")), str(document.get("dtype", "")))
              in {"target", "investigation-target"}
          ]
          target_path.write_text(
              "\n".join(
                  json.dumps(document, sort_keys=True, separators=(",", ":"), ensure_ascii=False)
                  for document in targets
              )
              + "\n",
              encoding="utf-8",
          )

          jsonl_hash = hashlib.sha256(payload).hexdigest()
          gzip_hash = hashlib.sha256(compressed).hexdigest()
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["starintel_documents_sha256"] = jsonl_hash
          manifest["gzip_transport_sha256"] = gzip_hash
          manifest.setdefault("validation", {})["strict_v0_9_schema"] = "passed"
          manifest["validation"]["legacy_fields"] = "preserved under extensions.legacy_data"
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          readme = readme_path.read_text(encoding="utf-8")
          readme = re.sub(r"Canonical JSONL SHA-256: `[^`]+`", f"Canonical JSONL SHA-256: `{jsonl_hash}`", readme)
          readme = re.sub(r"Gzip SHA-256: `[^`]+`", f"Gzip SHA-256: `{gzip_hash}`", readme)
          if "## Schema normalization" not in readme:
              readme += (
                  "\n\n## Schema normalization\n\n"
                  "Legacy packet-only fields were preserved under `extensions.legacy_data`; "
                  "target questions and preferred sources were mapped into declared StarIntel v0.9 fields.\n"
              )
          readme_path.write_text(readme, encoding="utf-8")

          print(f"normalized_documents={len(documents)} targets={len(targets)}")
          print(f"jsonl_sha256={jsonl_hash}")
          print(f"gzip_sha256={gzip_hash}")
          PY

      - name: Run mandatory merge gate
        run: python3 scripts/validate-for-merge.py

      - name: Commit normalized packet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digs/fed/2026-07-31-executive-branch-cabinet-advisors-pass-1
          git diff --cached --check
          git commit -m "Normalize federal executive packet to StarIntel v0.9"
          git push origin HEAD:agent/fed-executive-cabinet-advisers-repaired
