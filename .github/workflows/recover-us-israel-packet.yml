name: Recover corrupt US-Israel packet

on:
  push:
    branches:
      - agent/greater-israel-people-orgs-us-ties-2026-07-31
    paths:
      - .github/workflows/recover-us-israel-packet.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Recover and verify canonical JSONL
        shell: python
        run: |
          import base64
          import hashlib
          import json
          import struct
          import zlib
          from pathlib import Path

          directory = Path("digs/us-israel-military-integration/2026-07-31")
          source = directory / "starintel-documents.jsonl.gz.b64"
          target = directory / "starintel-documents.jsonl"
          expected = "5d22b16ee986db9906147090cf9b0f9ca965c58839054e939a969f2ff4a03626"

          data = base64.b64decode(source.read_bytes(), validate=False)
          if data[:3] != b"\x1f\x8b\x08":
              raise SystemExit("not a gzip/deflate transport")

          flags = data[3]
          offset = 10
          if flags & 0x04:
              extra_length = struct.unpack_from("<H", data, offset)[0]
              offset += 2 + extra_length
          for flag in (0x08, 0x10):
              if flags & flag:
                  offset = data.index(b"\x00", offset) + 1
          if flags & 0x02:
              offset += 2

          payload = zlib.decompress(data[offset:-8], -zlib.MAX_WBITS)
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f"decoded SHA-256 mismatch: {actual}")

          records = 0
          for number, line in enumerate(payload.splitlines(), 1):
              if not line.strip():
                  continue
              value = json.loads(line)
              if not isinstance(value, dict):
                  raise SystemExit(f"line {number}: expected JSON object")
              records += 1
          if records != 50:
              raise SystemExit(f"record-count mismatch: {records}")

          target.write_bytes(payload)
          source.unlink()
          print(f"recovered {records} records sha256={actual}")

      - name: Commit canonical packet
        run: |
          git config user.name "starintel-ci"
          git config user.email "actions@users.noreply.github.com"
          git add digs/us-israel-military-integration/2026-07-31/starintel-documents.jsonl
          git add -u digs/us-israel-military-integration/2026-07-31/starintel-documents.jsonl.gz.b64
          git commit -m "Recover US-Israel integration packet"
          git push origin HEAD:${GITHUB_REF_NAME}
