name: Validate Nim site build

on:
  pull_request:
    paths:
      - "scripts/build_research_site_fast.py"
      - "scripts/materialize_site_input.nim"
      - "scripts/validate-for-merge.py"
      - ".github/workflows/nim-site-build.yml"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nim-site-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build Nim materializer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nim
          mkdir -p .generated/bin
          nim c -d:release --opt:speed --hints:off --warnings:off \
            -o:.generated/bin/materialize-site-input \
            scripts/materialize_site_input.nim
          echo "STARINTEL_SITE_MATERIALIZER=$GITHUB_WORKSPACE/.generated/bin/materialize-site-input" >> "$GITHUB_ENV"

      - name: Run exact complete merge gate through Nim
        run: time python3 scripts/validate-for-merge.py --site
