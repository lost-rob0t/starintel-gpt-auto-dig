name: Generate Lattice AMI US government depth-4 records

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Assemble and decode research packet
        shell: bash
        run: |
          rm -f .github/depth4-decode-error.txt .github/depth4-validation-error.txt
          mkdir -p digs/wef/2026-07-27-lattice-ami-us-government-capture-risk-depth-4
          cat .github/depth4-payload/part-* > /tmp/depth4.tar.gz.b64
          test "$(wc -c < /tmp/depth4.tar.gz.b64)" = "15320"
          base64 -d /tmp/depth4.tar.gz.b64 > /tmp/depth4.tar.gz
          test "$(wc -c < /tmp/depth4.tar.gz)" = "11488"
          tar -xzf /tmp/depth4.tar.gz -C digs/wef/2026-07-27-lattice-ami-us-government-capture-risk-depth-4
          test -s digs/wef/2026-07-27-lattice-ami-us-government-capture-risk-depth-4/starintel-documents.jsonl
      - name: Run mandatory merge gate
        run: python3 scripts/validate-for-merge.py --site
      - name: Commit generated research packet
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digs/wef/2026-07-27-lattice-ami-us-government-capture-risk-depth-4 .github/depth4-decode-error.txt .github/depth4-validation-error.txt || true
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "data: add Lattice AMI US government capture-risk depth-4 records"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
