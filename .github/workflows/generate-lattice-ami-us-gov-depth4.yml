name: Generate Lattice AMI US government depth-4 records

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Decode research packet
        shell: bash
        run: |
          rm -f .github/depth4-decode-error.txt
          mkdir -p digs/wef/2026-07-27-lattice-ami-us-government-capture-risk-depth-4
          {
            echo "payload_bytes=$(wc -c < .github/depth4-payload/lattice-ami-us-gov-depth4.tar.gz.b64)"
            echo "payload_sha256=$(sha256sum .github/depth4-payload/lattice-ami-us-gov-depth4.tar.gz.b64 | cut -d' ' -f1)"
          } > .github/depth4-decode-error.txt
          if base64 -d .github/depth4-payload/lattice-ami-us-gov-depth4.tar.gz.b64 > /tmp/depth4.tar.gz 2>> .github/depth4-decode-error.txt; then
            echo "decoded_bytes=$(wc -c < /tmp/depth4.tar.gz)" >> .github/depth4-decode-error.txt
            echo "decoded_sha256=$(sha256sum /tmp/depth4.tar.gz | cut -d' ' -f1)" >> .github/depth4-decode-error.txt
            file /tmp/depth4.tar.gz >> .github/depth4-decode-error.txt
            if tar -xzf /tmp/depth4.tar.gz -C digs/wef/2026-07-27-lattice-ami-us-government-capture-risk-depth-4 2>> .github/depth4-decode-error.txt; then
              echo "tar_status=success" >> .github/depth4-decode-error.txt
            else
              echo "tar_status=failure" >> .github/depth4-decode-error.txt
            fi
          else
            echo "base64_status=failure" >> .github/depth4-decode-error.txt
          fi
      - name: Run mandatory merge gate
        shell: bash
        run: |
          rm -f .github/depth4-validation-error.txt
          if test -s digs/wef/2026-07-27-lattice-ami-us-government-capture-risk-depth-4/starintel-documents.jsonl; then
            if ! python3 scripts/validate-for-merge.py --site > /tmp/validate.log 2>&1; then
              cp /tmp/validate.log .github/depth4-validation-error.txt
            fi
          fi
      - name: Commit generated packet and diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digs/wef/2026-07-27-lattice-ami-us-government-capture-risk-depth-4 .github/depth4-decode-error.txt .github/depth4-validation-error.txt || true
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore: record depth-4 packet diagnostics"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
