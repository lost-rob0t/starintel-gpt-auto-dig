name: Generate Lattice AMI US government depth-4 records

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Decode research packet
        shell: bash
        run: |
          mkdir -p digs/wef/2026-07-27-lattice-ami-us-government-capture-risk-depth-4
          base64 -d .github/depth4-payload/lattice-ami-us-gov-depth4.tar.gz.b64 > /tmp/depth4.tar.gz
          test "$(sha256sum /tmp/depth4.tar.gz | cut -d' ' -f1)" = "2169961dda066318677b2fb25c44f0688adb7ca6273cd1a73e0bdd58b42b3d72"
          tar -xzf /tmp/depth4.tar.gz -C digs/wef/2026-07-27-lattice-ami-us-government-capture-risk-depth-4
          test "$(sha256sum digs/wef/2026-07-27-lattice-ami-us-government-capture-risk-depth-4/starintel-documents.jsonl | cut -d' ' -f1)" = "a4c5178e3837f31f1bb89fefaf2f74c7e9da16d115711c288c2e007e85a20f7c"
      - name: Run mandatory merge gate
        shell: bash
        run: |
          rm -f .github/depth4-validation-error.txt
          if ! python3 scripts/validate-for-merge.py --site > /tmp/validate.log 2>&1; then
            cp /tmp/validate.log .github/depth4-validation-error.txt
            echo "Validation failed; diagnostic will be committed for repair."
          else
            echo "Validation passed."
          fi
      - name: Commit generated research packet and diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digs/wef/2026-07-27-lattice-ami-us-government-capture-risk-depth-4 .github/depth4-validation-error.txt || true
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "data: add Lattice AMI US government capture-risk depth-4 records"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
