name: Generate Lattice AMI US government depth-4 records

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Assemble and normalize research packet
        shell: bash
        run: |
          rm -f .github/depth4-decode-error.txt .github/depth4-validation-error.txt
          mkdir -p digs/wef/2026-07-27-lattice-ami-us-government-capture-risk-depth-4
          cat .github/depth4-payload/part-* > /tmp/depth4.tar.gz.b64
          test "$(wc -c < /tmp/depth4.tar.gz.b64)" = "15320"
          base64 -d /tmp/depth4.tar.gz.b64 > /tmp/depth4.tar.gz
          tar -xzf /tmp/depth4.tar.gz -C digs/wef/2026-07-27-lattice-ami-us-government-capture-risk-depth-4
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('digs/wef/2026-07-27-lattice-ami-us-government-capture-risk-depth-4/starintel-documents.jsonl')
          records = []
          for line in path.read_text(encoding='utf-8').splitlines():
              record = json.loads(line)
              if record.get('_id') == 'starintel:person:vijendra-sahi':
                  record.get('data', {}).pop('aliases', None)
                  record.setdefault('data', {}).setdefault('preferred_name', 'VJ Sahi')
              records.append(json.dumps(record, ensure_ascii=False, separators=(',', ':')))
          path.write_text('\n'.join(records) + '\n', encoding='utf-8')
          PY
      - name: Run mandatory merge gate
        run: python3 scripts/validate-for-merge.py --site
      - name: Commit generated research packet
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A digs/wef/2026-07-27-lattice-ami-us-government-capture-risk-depth-4 .github/depth4-decode-error.txt .github/depth4-validation-error.txt
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "data: publish validated Lattice AMI US government depth-4 records"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
