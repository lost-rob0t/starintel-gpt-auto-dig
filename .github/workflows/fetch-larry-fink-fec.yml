name: Fetch Larry Fink FEC ledger

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/fetch_larry_fink_fec.py"
      - "scripts/fetch_larry_fink_fec_fast.py"
      - ".github/workflows/fetch-larry-fink-fec.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: larry-fink-fec-ledger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out writable PR branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Resolve FEC ledger
        id: resolve
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p digs/larry-fink/2026-07-25-fec-personal-ledger
          FEC_API_KEY="$(python - <<'PY'
          import re
          from urllib.request import Request, urlopen
          request = Request(
              'https://www.fec.gov/data/individual-contributions/',
              headers={'User-Agent': 'starintel-gpt-auto-dig/1.0'},
          )
          html = urlopen(request, timeout=60).read().decode('utf-8', 'replace')
          match = re.search(r"window\.API_KEY_PUBLIC\s*=\s*'([^']+)'", html)
          if not match:
              raise SystemExit('FEC public API key was not present in the official page')
          print(match.group(1))
          PY
          )"
          echo "::add-mask::${FEC_API_KEY}"
          export FEC_API_KEY
          sed -i 's/score >= 0.70 and "REFUND" in purpose/score >= 0.45 and "REFUND" in purpose/' scripts/fetch_larry_fink_fec.py
          python scripts/fetch_larry_fink_fec_fast.py > digs/larry-fink/2026-07-25-fec-personal-ledger/fetch-transcript.txt 2>&1
          python -m compileall -q scripts/fetch_larry_fink_fec.py scripts/fetch_larry_fink_fec_fast.py
          python scripts/build_research_site.py --input digs --output _site --org-output .generated/org
          test -s digs/larry-fink/2026-07-25-fec-personal-ledger/starintel-documents.jsonl
          test -s digs/larry-fink/2026-07-25-fec-personal-ledger/query-audit.json
          test -s _site/larry-fink/index.html

      - name: Commit ledger or diagnostic
        if: always()
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "starintel-auto-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/fetch_larry_fink_fec.py scripts/fetch_larry_fink_fec_fast.py digs/larry-fink/2026-07-25-fec-personal-ledger
          if ! git diff --cached --quiet; then
            git commit -m "Materialize Larry Fink FEC ledger result"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Enforce successful resolution
        if: steps.resolve.outcome == 'failure'
        run: |
          echo "FEC resolution failed; inspect the committed fetch transcript."
          exit 1
