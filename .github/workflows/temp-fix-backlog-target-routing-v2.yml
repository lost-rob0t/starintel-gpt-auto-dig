name: TEMP fix backlog target routing v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-fix-backlog-target-routing-v2.yml"

permissions:
  contents: write

jobs:
  patch-test-and-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reuse target-routing patch from first helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          helper = Path('.github/workflows/temp-fix-backlog-target-routing.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(helper) if "python3 - <<'PY'" in line) + 1
          stop = next(i for i in range(start, len(helper)) if helper[i].strip() == 'PY')
          source = textwrap.dedent('\n'.join(helper[start:stop]))
          exec(compile(source, '<target-routing-helper>', 'exec'))
          PY

      - name: Correct generated regression-test indentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test_import_starintel_backlog.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          marker = '    def test_target_is_dispatched_separately_from_bulk_documents(self) -> None:'
          start = lines.index(marker)
          stop = next(
              i for i in range(start + 1, len(lines))
              if lines[i].startswith('    def test_non_413_failure_stays_ambiguous_and_does_not_advance')
          )
          for i in range(start + 1, stop):
              if lines[i]:
                  lines[i] = '    ' + lines[i]
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Run backlog importer regression tests
        run: python3 -m unittest tests.test_import_starintel_backlog

      - name: Commit fix and remove both helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'starintel-ci'
          git config user.email 'starintel-ci@users.noreply.github.com'
          git rm .github/workflows/temp-fix-backlog-target-routing.yml
          git rm .github/workflows/temp-fix-backlog-target-routing-v2.yml
          git add scripts/import-starintel-backlog.py tests/test_import_starintel_backlog.py .github/workflows/temp-backlog-import.yml
          git commit -m 'fix: route backlog target documents through target dispatch'
          git push origin HEAD:main
