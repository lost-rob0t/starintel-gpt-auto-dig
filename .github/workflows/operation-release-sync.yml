name: Operation 0.9.1 release sync

on:
  push:
    branches:
      - feat/operation-dtype-151

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[release-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/operation-dtype-151
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Add operation conformance fixture and 0.9.1 release metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          fixture = Path('conformance/fixtures.py')
          text = fixture.read_text()
          needle = '''        "research-node": {\n            "objective": "Run a bounded investigation.",\n            "status": "draft",\n        },\n'''
          addition = needle + '''        "operation": {\n            "mission": "Exercise the 0.9.1 operation control-plane contract.",\n            "status": "planned",\n            "phases": [\n                {\n                    "phase_id": "plan",\n                    "objective": "Exercise cross-language operation round-trip.",\n                    "state": "planned",\n                    "depends_on": [],\n                    "dataset_binding_ids": [],\n                    "required_capability_ids": [],\n                }\n            ],\n        },\n'''
          if '"operation": {' not in text.split('def full_person', 1)[0]:
              if needle not in text:
                  raise SystemExit('minimal_data insertion point not found')
              fixture.write_text(text.replace(needle, addition, 1))

          inventory_path = Path('conformance/implementations.json')
          inventory = json.loads(inventory_path.read_text())
          inventory['release_version'] = '0.9.1'
          inventory['inventory_version'] = max(int(inventory.get('inventory_version', 1)), 2)
          inventory['release_contract'] = {
              'wire_spec_version': '0.9.0',
              'release_version': '0.9.1',
              'required_dtypes': ['operation'],
              'compatibility': 'additive-v0.9',
          }
          for implementation in inventory.get('implementations', []):
              implementation['library_release'] = '0.9.1'
          inventory_path.write_text(json.dumps(inventory, indent=2) + '\n')
          PY
      - name: Commit synced release metadata
        run: |
          if git diff --quiet -- conformance/fixtures.py conformance/implementations.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conformance/fixtures.py conformance/implementations.json
          git commit -m "test(conformance): add operation to 0.9.1 matrix [release-sync]"
          git push origin HEAD:feat/operation-dtype-151
