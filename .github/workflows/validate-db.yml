name: Validate StarIntel DB

on:
  push:
    branches: [main]
    paths:
      - "starintel_doc/**"
      - "schemas/**"
      - "skills/**"
      - "db/**"
      - "digs/**"
      - "imports/**"
      - "manifests/**"
      - "scripts/**"
      - "tests/**"
      - "AGENTS.md"
      - "docs/repository-contract.md"
      - ".github/workflows/validate-db.yml"
  pull_request:
    branches: [main]
    paths:
      - "starintel_doc/**"
      - "schemas/**"
      - "skills/**"
      - "db/**"
      - "digs/**"
      - "imports/**"
      - "manifests/**"
      - "scripts/**"
      - "tests/**"
      - "AGENTS.md"
      - "docs/repository-contract.md"
      - ".github/workflows/validate-db.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run mandatory StarIntel merge gate
        run: python3 scripts/validate-for-merge.py

  standalone-python:
    name: Standalone Python v0.9
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          repository: lost-rob0t/starintel-doc
          ref: agent/schema-org-v0.9
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m compileall -q starintel_doc
      - run: python -m unittest discover -s tests -v

  nim-runtime:
    name: Nim v0.9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: lost-rob0t/starintel-doc.nim
          ref: agent/schema-org-v0.9
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
      - run: nimble install -y
      - run: nimble test -y
