name: Validate StarIntel DB

on:
  push:
    branches: [main]
    paths:
      - "starintel_doc/**"
      - "schemas/**"
      - "skills/**"
      - "db/**"
      - "digs/**"
      - "imports/**"
      - "manifests/**"
      - "scripts/**"
      - "tests/**"
      - "AGENTS.md"
      - "docs/repository-contract.md"
      - ".github/workflows/validate-db.yml"
  pull_request:
    branches: [main]
    paths:
      - "starintel_doc/**"
      - "schemas/**"
      - "skills/**"
      - "db/**"
      - "digs/**"
      - "imports/**"
      - "manifests/**"
      - "scripts/**"
      - "tests/**"
      - "AGENTS.md"
      - "docs/repository-contract.md"
      - ".github/workflows/validate-db.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - name: Capture corpus validator output
        shell: bash
        run: python3 scripts/starintel.py validate > validation.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-validation-diagnostic
          path: validation.txt
