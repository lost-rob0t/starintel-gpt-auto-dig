name: Validate StarIntel DB

on:
  push:
    branches: [main]
    paths:
      - "starintel_doc/**"
      - "schemas/**"
      - "db/**"
      - "digs/**"
      - "imports/**"
      - "manifests/**"
      - "scripts/**"
      - "tests/**"
      - "site-assets/**"
      - "site-config.json"
      - "quasar-fork.lock.json"
      - "AGENTS.md"
      - "docs/repository-contract.md"
      - ".github/workflows/validate-db.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-db-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect validation-relevant changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if grep -Eq '^(\.github/workflows/validate-db\.yml|AGENTS\.md|docs/repository-contract\.md|starintel_doc/|schemas/|db/|digs/|imports/|manifests/|scripts/|tests/|site-assets/|site-config\.json|quasar-fork\.lock\.json)' <<<"$changed"; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          else
            echo "heavy=false" >> "$GITHUB_OUTPUT"
            echo "No corpus, schema, test, script, or site-generator changes; full gate skipped."
          fi

      - uses: actions/setup-python@v6
        if: steps.changes.outputs.heavy == 'true'
        with:
          python-version: "3.13"

      - name: Run mandatory StarIntel merge gate once
        if: steps.changes.outputs.heavy == 'true'
        run: python3 scripts/validate-for-merge.py --site
