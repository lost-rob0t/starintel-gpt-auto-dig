name: Validate StarIntel documents

on:
  push:
    branches-ignore: [main]
    paths:
      - "db/**"
      - "digs/**"
      - ".github/workflows/validate-db.yml"
      - ".github/workflows/conformance.yml"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: document-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate StarIntel documents
        run: python3 scripts/starintel.py validate --root .
