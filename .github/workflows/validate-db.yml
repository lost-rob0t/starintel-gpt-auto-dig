name: Validate StarIntel DB

on:
  push:
    branches: [main]
    paths:
      - "starintel_doc/**"
      - "schemas/**"
      - "skills/**"
      - "db/**"
      - "digs/**"
      - "imports/**"
      - "manifests/**"
      - "scripts/**"
      - "tests/**"
      - "AGENTS.md"
      - "docs/repository-contract.md"
      - ".github/workflows/validate-db.yml"
  pull_request:
    branches: [main]
    paths:
      - "starintel_doc/**"
      - "schemas/**"
      - "skills/**"
      - "db/**"
      - "digs/**"
      - "imports/**"
      - "manifests/**"
      - "scripts/**"
      - "tests/**"
      - "AGENTS.md"
      - "docs/repository-contract.md"
      - ".github/workflows/validate-db.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - name: Run compact corpus validator
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/starintel.py validate 2>&1 | tail -40
