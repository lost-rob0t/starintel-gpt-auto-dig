name: Validate StarIntel DB

on:
  push:
    branches: [main]
    paths:
      - "starintel_doc/**"
      - "schemas/**"
      - "skills/**"
      - "db/**"
      - "digs/**"
      - "imports/**"
      - "manifests/**"
      - "scripts/**"
      - "tests/**"
      - "AGENTS.md"
      - "docs/repository-contract.md"
      - ".github/workflows/validate-db.yml"
  pull_request:
    branches: [main]
    paths:
      - "starintel_doc/**"
      - "schemas/**"
      - "skills/**"
      - "db/**"
      - "digs/**"
      - "imports/**"
      - "manifests/**"
      - "scripts/**"
      - "tests/**"
      - "AGENTS.md"
      - "docs/repository-contract.md"
      - ".github/workflows/validate-db.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Run diagnostic merge gate
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.ref }}
        run: |
          set -o pipefail
          git init repo >/dev/null
          cd repo
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "${REVISION}" >/dev/null
          git checkout --detach FETCH_HEAD >/dev/null
          python3 scripts/validate-for-merge.py 2>&1 | tail -n 25
