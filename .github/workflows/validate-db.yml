name: Validate StarIntel documents

on:
  push:
    branches-ignore: [main]
    paths:
      - "db/**"
      - "digs/**"
      - "schemas/**"
      - "scripts/starintel_legacy.nim"
      - "scripts/starintel_transport.nim"
      - "scripts/starintel_validate.nim"
      - "tests/test_canonical_dataset_roots.py"
      - "tests/test_import_starintel_corpus.py"
      - "tests/test_starintel_legacy.nim"
      - "tests/test_starintel_transport.nim"
      - ".github/workflows/validate-db.yml"
  pull_request:
    paths:
      - "db/**"
      - "digs/**"
      - "schemas/**"
      - "scripts/starintel_legacy.nim"
      - "scripts/starintel_transport.nim"
      - "scripts/starintel_validate.nim"
      - "tests/test_canonical_dataset_roots.py"
      - "tests/test_import_starintel_corpus.py"
      - "tests/test_starintel_legacy.nim"
      - "tests/test_starintel_transport.nim"
      - ".github/workflows/validate-db.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: document-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  NIM_VERSION: 2.2.4
  STARINTEL_NIM_REF: b55316bae294a146523cd2f977b81096e538c86a

jobs:
  validate-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Checkout canonical StarIntel Nim runtime
        uses: actions/checkout@v6
        with:
          repository: lost-rob0t/starintel-doc.nim
          ref: ${{ env.STARINTEL_NIM_REF }}
          path: .starintel-doc-nim

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Install streaming transport tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gzip coreutils time

      - name: Build streaming validator
        run: |
          mkdir -p bin
          nim c -d:release --opt:speed --mm:orc \
            --path:scripts \
            --path:.starintel-doc-nim/src \
            --out:bin/starintel-validate \
            scripts/starintel_validate.nim

      - name: Test canonical dataset roots
        run: python -m unittest tests.test_canonical_dataset_roots

      - name: Test importer corpus duplicate invariant
        id: importer-corpus
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_import_starintel_corpus
          status=$?
          set -e
          if (( status != 0 )); then
            conflict_id=$(sed -n "s/.*conflicting duplicate _id '\([^']*\)'.*/\1/p" importer-corpus-error.txt | head -n1)
            conflict_id=${conflict_id//:/-}
            echo "conflict_id=${conflict_id:-unknown}" >> "$GITHUB_OUTPUT"
            exit "$status"
          fi
          echo "conflict_id=none" >> "$GITHUB_OUTPUT"

      - name: "Importer conflict ${{ steps.importer-corpus.outputs.conflict_id }}"
        if: ${{ always() && steps.importer-corpus.outcome == 'failure' }}
        run: cat importer-corpus-error.txt

      - name: Test Nim validator compatibility
        run: |
          nim c -r -d:release --opt:speed --mm:orc \
            --path:scripts \
            tests/test_starintel_legacy.nim
          nim c -r -d:release --opt:speed --mm:orc \
            --path:scripts \
            tests/test_starintel_transport.nim

      - name: Validate StarIntel documents and audit sources
        shell: bash
        run: |
          set -o pipefail
          set +e
          /usr/bin/time -f 'validator_elapsed=%E validator_maxrss_kb=%M' \
            bin/starintel-validate --root . 2>&1 | tee validator.log
          status=${PIPESTATUS[0]}
          set -e
          test -f unverifed
          test -f validation-errors
          echo "source-less documents: $(grep -vc '^#' unverifed || true)"
          echo "validation errors: $(grep -vc '^#' validation-errors || true)"
          exit "$status"

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starintel-validation-diagnostics
          path: |
            unverifed
            validation-errors
            validator.log
            importer-corpus-error.txt
          if-no-files-found: warn
          retention-days: 7
