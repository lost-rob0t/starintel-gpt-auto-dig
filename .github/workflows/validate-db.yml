name: Validate StarIntel documents

on:
  push:
    branches-ignore: [main]
    paths:
      - "db/**"
      - "digs/**"
      - "schemas/**"
      - "scripts/starintel_legacy.nim"
      - "scripts/starintel_transport.nim"
      - "scripts/starintel_validate.nim"
      - "tests/test_canonical_dataset_roots.py"
      - "tests/test_import_starintel_corpus.py"
      - "tests/test_starintel_legacy.nim"
      - "tests/test_starintel_transport.nim"
      - ".github/workflows/validate-db.yml"
  pull_request:
    paths:
      - "db/**"
      - "digs/**"
      - "schemas/**"
      - "scripts/starintel_legacy.nim"
      - "scripts/starintel_transport.nim"
      - "scripts/starintel_validate.nim"
      - "tests/test_canonical_dataset_roots.py"
      - "tests/test_import_starintel_corpus.py"
      - "tests/test_starintel_legacy.nim"
      - "tests/test_starintel_transport.nim"
      - ".github/workflows/validate-db.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: document-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  NIM_VERSION: 2.2.4
  STARINTEL_NIM_REF: b55316bae294a146523cd2f977b81096e538c86a

jobs:
  validate-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Checkout canonical StarIntel Nim runtime
        uses: actions/checkout@v6
        with:
          repository: lost-rob0t/starintel-doc.nim
          ref: ${{ env.STARINTEL_NIM_REF }}
          path: .starintel-doc-nim

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Install streaming transport tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gzip coreutils time

      - name: Build streaming validator
        run: |
          mkdir -p bin
          nim c -d:release --opt:speed --mm:orc \
            --path:scripts \
            --path:.starintel-doc-nim/src \
            --out:bin/starintel-validate \
            scripts/starintel_validate.nim

      - name: Test canonical dataset roots
        run: python -m unittest tests.test_canonical_dataset_roots

      - name: Probe importer corpus duplicate invariant
        id: importer-corpus
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_import_starintel_corpus
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if (( status != 0 )); then
            python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import re

          lines = [
              line
              for line in Path("importer-corpus-error.txt").read_text(encoding="utf-8").splitlines()
              if "conflicting duplicate _id" in line
          ]
          print(f"conflict_count={len(lines)}")

          def compact_id(document_id: str) -> str:
              return document_id.replace("starintel:", "").replace(":", "/")

          def packet_name(source: str) -> str:
              path = source.rsplit(":", 1)[0]
              return Path(path).parent.name.replace(":", "-")

          for index, line in enumerate(lines[:10], start=1):
              match = re.search(r"conflicting duplicate _id '([^']+)': (.+?) vs (.+)$", line)
              if not match:
                  continue
              document_id, source_a, source_b = match.groups()
              print(f"c{index}_id={compact_id(document_id)}")
              print(f"c{index}_a={packet_name(source_a)}")
              print(f"c{index}_b={packet_name(source_b)}")
          PY
          else
            echo "conflict_count=0" >> "$GITHUB_OUTPUT"
          fi

      - name: "Conflict 1 :: ${{ steps.importer-corpus.outputs.c1_id }} :: ${{ steps.importer-corpus.outputs.c1_a }} vs ${{ steps.importer-corpus.outputs.c1_b }}"
        if: ${{ steps.importer-corpus.outputs.c1_id != '' }}
        run: true
      - name: "Conflict 2 :: ${{ steps.importer-corpus.outputs.c2_id }} :: ${{ steps.importer-corpus.outputs.c2_a }} vs ${{ steps.importer-corpus.outputs.c2_b }}"
        if: ${{ steps.importer-corpus.outputs.c2_id != '' }}
        run: true
      - name: "Conflict 3 :: ${{ steps.importer-corpus.outputs.c3_id }} :: ${{ steps.importer-corpus.outputs.c3_a }} vs ${{ steps.importer-corpus.outputs.c3_b }}"
        if: ${{ steps.importer-corpus.outputs.c3_id != '' }}
        run: true
      - name: "Conflict 4 :: ${{ steps.importer-corpus.outputs.c4_id }} :: ${{ steps.importer-corpus.outputs.c4_a }} vs ${{ steps.importer-corpus.outputs.c4_b }}"
        if: ${{ steps.importer-corpus.outputs.c4_id != '' }}
        run: true
      - name: "Conflict 5 :: ${{ steps.importer-corpus.outputs.c5_id }} :: ${{ steps.importer-corpus.outputs.c5_a }} vs ${{ steps.importer-corpus.outputs.c5_b }}"
        if: ${{ steps.importer-corpus.outputs.c5_id != '' }}
        run: true
      - name: "Conflict 6 :: ${{ steps.importer-corpus.outputs.c6_id }} :: ${{ steps.importer-corpus.outputs.c6_a }} vs ${{ steps.importer-corpus.outputs.c6_b }}"
        if: ${{ steps.importer-corpus.outputs.c6_id != '' }}
        run: true
      - name: "Conflict 7 :: ${{ steps.importer-corpus.outputs.c7_id }} :: ${{ steps.importer-corpus.outputs.c7_a }} vs ${{ steps.importer-corpus.outputs.c7_b }}"
        if: ${{ steps.importer-corpus.outputs.c7_id != '' }}
        run: true
      - name: "Conflict 8 :: ${{ steps.importer-corpus.outputs.c8_id }} :: ${{ steps.importer-corpus.outputs.c8_a }} vs ${{ steps.importer-corpus.outputs.c8_b }}"
        if: ${{ steps.importer-corpus.outputs.c8_id != '' }}
        run: true
      - name: "Conflict 9 :: ${{ steps.importer-corpus.outputs.c9_id }} :: ${{ steps.importer-corpus.outputs.c9_a }} vs ${{ steps.importer-corpus.outputs.c9_b }}"
        if: ${{ steps.importer-corpus.outputs.c9_id != '' }}
        run: true
      - name: "Conflict 10 :: ${{ steps.importer-corpus.outputs.c10_id }} :: ${{ steps.importer-corpus.outputs.c10_a }} vs ${{ steps.importer-corpus.outputs.c10_b }}"
        if: ${{ steps.importer-corpus.outputs.c10_id != '' }}
        run: true

      - name: "Fail on ${{ steps.importer-corpus.outputs.conflict_count }} importer conflicts"
        if: ${{ steps.importer-corpus.outputs.status != '0' }}
        shell: bash
        run: |
          while IFS= read -r line; do
            echo "::error title=Importer duplicate::$line"
          done < importer-corpus-error.txt
          exit 1

      - name: Test Nim validator compatibility
        run: |
          nim c -r -d:release --opt:speed --mm:orc \
            --path:scripts \
            tests/test_starintel_legacy.nim
          nim c -r -d:release --opt:speed --mm:orc \
            --path:scripts \
            tests/test_starintel_transport.nim

      - name: Validate StarIntel documents and audit sources
        shell: bash
        run: |
          set -o pipefail
          set +e
          /usr/bin/time -f 'validator_elapsed=%E validator_maxrss_kb=%M' \
            bin/starintel-validate --root . 2>&1 | tee validator.log
          status=${PIPESTATUS[0]}
          set -e
          test -f unverifed
          test -f validation-errors
          echo "source-less documents: $(grep -vc '^#' unverifed || true)"
          echo "validation errors: $(grep -vc '^#' validation-errors || true)"
          exit "$status"

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starintel-validation-diagnostics
          path: |
            unverifed
            validation-errors
            validator.log
            importer-corpus-error.txt
          if-no-files-found: warn
          retention-days: 7
