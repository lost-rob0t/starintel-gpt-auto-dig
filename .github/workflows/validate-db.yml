name: Validate StarIntel DB

on:
  push:
    branches: [main]
    paths:
      - "db/**"
      - "imports/**"
      - "manifests/**"
      - "scripts/import-jsonl.py"
      - "scripts/validate-db.py"
      - ".github/workflows/validate-db.yml"
  pull_request:
    branches: [main]
    paths:
      - "db/**"
      - "imports/**"
      - "manifests/**"
      - "scripts/import-jsonl.py"
      - "scripts/validate-db.py"
      - ".github/workflows/validate-db.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate database paths and relations
        run: python3 scripts/validate-db.py
