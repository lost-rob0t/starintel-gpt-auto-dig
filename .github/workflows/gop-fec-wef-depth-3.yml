name: GOP FEC and WEF recursion depth 3

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: ["agent/gop-wef-palantir-aipac-depth-2"]
    paths:
      - "imports/gop-depth3/**"
      - ".github/workflows/gop-fec-wef-depth-3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gop-fec-wef-depth-3-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  recurse:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore depth-3 generator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts
          cat imports/gop-depth3/script-* | tr -d '\r\n ' | base64 --decode > /tmp/gop_fec_wef_depth3.py.gz
          gzip --test /tmp/gop_fec_wef_depth3.py.gz
          gzip -dc /tmp/gop_fec_wef_depth3.py.gz > scripts/gop_fec_wef_depth3.py
          chmod +x scripts/gop_fec_wef_depth3.py
          python3 -m py_compile scripts/gop_fec_wef_depth3.py

      - name: Stream FEC bulk archives
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/gop_fec_wef_depth3.py")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              "import sys\nimport urllib.request\n",
              "import sys\nimport tempfile\nimport urllib.request\n",
              1,
          )
          start = source.index("def zip_pipe_rows(")
          end = source.index("\n\ndef load_db", start)
          replacement = '''def zip_pipe_rows(url: str, fields: list[str]) -> Iterable[dict[str, str]]:
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "StarIntel-AutoDig/0.9 public-record-research"},
              )
              temp_path: Path | None = None
              try:
                  with tempfile.NamedTemporaryFile(prefix="starintel-fec-", suffix=".zip", delete=False) as temp_file:
                      temp_path = Path(temp_file.name)
                      with urllib.request.urlopen(request, timeout=180) as response:
                          downloaded = 0
                          while chunk := response.read(1024 * 1024):
                              temp_file.write(chunk)
                              downloaded += len(chunk)
                              if downloaded % (32 * 1024 * 1024) < len(chunk):
                                  print(f"downloaded {downloaded // (1024 * 1024)} MiB from {url}", flush=True)
                  print(f"processing {temp_path.stat().st_size // (1024 * 1024)} MiB archive from {url}", flush=True)
                  with zipfile.ZipFile(temp_path) as archive:
                      names = [name for name in archive.namelist() if not name.endswith("/")]
                      if not names:
                          raise RuntimeError(f"empty archive: {url}")
                      member = next((name for name in names if name.lower().endswith((".txt", ".csv"))), names[0])
                      with archive.open(member) as raw, io.TextIOWrapper(raw, encoding="latin-1", errors="replace", newline="") as text:
                          for values in csv.reader(text, delimiter="|"):
                              if not values:
                                  continue
                              values = values[: len(fields)] + [""] * max(0, len(fields) - len(values))
                              yield dict(zip(fields, values, strict=True))
              finally:
                  if temp_path is not None:
                      temp_path.unlink(missing_ok=True)
          '''
          source = source[:start] + replacement + source[end:]
          source = source.replace(
              '    committee_rows = {row["cmte_id"].upper(): row for row in zip_pipe_rows(FEC_URLS["committee_master"], COMMITTEE_FIELDS)}',
              '    print("loading FEC committee master", flush=True)\n    committee_rows = {row["cmte_id"].upper(): row for row in zip_pipe_rows(FEC_URLS["committee_master"], COMMITTEE_FIELDS)}',
              1,
          )
          source = source.replace(
              '    candidate_rows = {row["cand_id"].upper(): row for row in zip_pipe_rows(FEC_URLS["candidate_master"], CANDIDATE_FIELDS)}',
              '    print("loading FEC candidate master", flush=True)\n    candidate_rows = {row["cand_id"].upper(): row for row in zip_pipe_rows(FEC_URLS["candidate_master"], CANDIDATE_FIELDS)}',
              1,
          )
          source = source.replace(
              '    oth_rows = reconcile_oth(zip_pipe_rows(FEC_URLS["committee_transactions"], OTH_FIELDS))',
              '    print("streaming FEC committee disbursements", flush=True)\n    oth_rows = reconcile_oth(zip_pipe_rows(FEC_URLS["committee_transactions"], OTH_FIELDS))',
              1,
          )
          source = source.replace(
              '    ie_reader = csv.DictReader(io.StringIO(fetch_text(FEC_URLS["independent_expenditures"])))',
              '    print("loading FEC independent expenditures", flush=True)\n    ie_reader = csv.DictReader(io.StringIO(fetch_text(FEC_URLS["independent_expenditures"])))',
              1,
          )
          path.write_text(source, encoding="utf-8")
          PY
          python3 -m py_compile scripts/gop_fec_wef_depth3.py

      - name: Resolve official FEC and WEF records
        run: python3 scripts/gop_fec_wef_depth3.py --root . --as-of 2026-07-31T10:30:00Z

      - name: Import canonical StarIntel packet
        run: >-
          python3 scripts/starintel.py import
          digs/gop/2026-07-31-fec-wef-depth-3/starintel-documents.jsonl
          --root .
          --replace

      - name: Remove bootstrap before validation
        run: |
          rm -rf imports/gop-depth3
          rmdir imports 2>/dev/null || true

      - name: Validate corpus and site
        shell: bash
        run: |
          set +e
          python3 scripts/validate-for-merge.py --site > /tmp/gop-depth3-validation.log 2>&1
          status=$?
          cat /tmp/gop-depth3-validation.log
          if [ "$status" -ne 0 ]; then
            mkdir -p reports
            cp /tmp/gop-depth3-validation.log reports/gop-fec-wef-depth-3-validation.log
            git add reports/gop-fec-wef-depth-3-validation.log
            git config user.name "starintel-auto-dig-bot"
            git config user.email "starintel-auto-dig-bot@users.noreply.github.com"
            git commit -m "Capture GOP depth-3 validation failure"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
          exit "$status"

      - name: Commit resolved depth-3 corpus
        shell: bash
        run: |
          set -euo pipefail
          git add -A \
            scripts/gop_fec_wef_depth3.py \
            .github/workflows/gop-fec-wef-depth-3.yml \
            imports \
            digs/gop/2026-07-31-fec-wef-depth-3 \
            reports/gop-fec-wef-depth-3.json \
            db
          if git diff --cached --quiet; then
            echo "Depth-3 corpus already current"
            exit 0
          fi
          git config user.name "starintel-auto-dig-bot"
          git config user.email "starintel-auto-dig-bot@users.noreply.github.com"
          git commit -m "Resolve GOP FEC and WEF recursion depth 3"
          git push origin "HEAD:${TARGET_BRANCH}"
