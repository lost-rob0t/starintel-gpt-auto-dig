name: Generate DNC key people WEF and accountability queue

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - scripts/generate_dnc_key_people_wef_accountability.py
      - digs/dnc/2026-08-01-key-people-wef-accountability-seed/**
      - .github/workflows/dnc-key-people-wef-accountability.yml
  push:
    branches:
      - agent/dnc-key-people-wef-accountability
    paths:
      - scripts/generate_dnc_key_people_wef_accountability.py
      - digs/dnc/2026-08-01-key-people-wef-accountability-seed/**
      - .github/workflows/dnc-key-people-wef-accountability.yml

permissions:
  contents: write

concurrency:
  group: dnc-key-people-wef-accountability-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  NIM_VERSION: 2.2.4
  STARINTEL_NIM_REF: b55316bae294a146523cd2f977b81096e538c86a

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: .
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Check out canonical StarIntel Nim runtime
        uses: actions/checkout@v6
        with:
          repository: lost-rob0t/starintel-doc.nim
          ref: ${{ env.STARINTEL_NIM_REF }}
          path: .starintel-doc-nim

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install repository test dependencies
        run: python3 -m pip install --disable-pip-version-check requests beautifulsoup4 lxml httpx

      - name: Generate universal WEF and key-person accountability queues
        run: python3 scripts/generate_dnc_key_people_wef_accountability.py --all-people

      - name: Enforce GitHub-safe partitions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('digs/dnc/2026-08-01-key-people-wef-accountability')
          files = [path for path in root.rglob('*') if path.is_file()]
          if not files:
              raise SystemExit('key-person generator emitted no files')
          oversized = [(str(path), path.stat().st_size) for path in files if path.stat().st_size > 95_000_000]
          if oversized:
              raise SystemExit(f'oversized generated files: {oversized}')
          largest = max((path.stat().st_size, str(path)) for path in files)
          print({'files': len(files), 'largest': largest})
          PY

      - name: Build current canonical merge gate
        run: nimble buildFast

      - name: Validate complete repository
        run: bin/validate-for-merge

      - name: Commit generated queues
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add digs/dnc/2026-08-01-key-people-wef-accountability
          if git diff --cached --quiet; then
            echo 'Generated packet is unchanged.'
            exit 0
          fi
          git commit -m 'Materialize DNC people WEF and accountability queues'
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin HEAD:${TARGET_BRANCH}
