name: Run WEF depth 8 collector on stacked PR

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: wef-depth8-vendor-ledger-pr
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/wef-columbus-depth-7-public-records'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/wef-columbus-depth-7-public-records
          fetch-depth: 0

      - name: Run bounded collectors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          out=imports/wef-depth-8/smart-columbus-vendor-ledger
          rm -rf "$out"
          mkdir -p "$out"
          target='starintel:investigation-target:wef-depth-7-wef-columbus-public-records'

          python3 scripts/wef_depth7_scrape.py \
            --target "$target" \
            --collector legistar \
            --output "$out/legistar-observations.jsonl"

          python3 scripts/wef_depth7_scrape.py \
            --target "$target" \
            --collector auditor \
            --auditor-download \
            --auditor-hit-limit 500 \
            --output "$out/auditor-observations.jsonl"

      - name: Summarize observations
        shell: python
        run: |
          from __future__ import annotations

          import json
          from collections import Counter
          from pathlib import Path

          root = Path('imports/wef-depth-8/smart-columbus-vendor-ledger')
          rows = []
          files = []
          for path in sorted(root.glob('*-observations.jsonl')):
              parsed = [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
              rows.extend(parsed)
              files.append({'path': str(path), 'records': len(parsed)})

          summary = {
              'target_id': 'starintel:investigation-target:wef-depth-7-wef-columbus-public-records',
              'observation_count': len(rows),
              'files': files,
              'counts_by_collector': dict(sorted(Counter(row.get('collector') for row in rows).items())),
              'counts_by_kind': dict(sorted(Counter(row.get('kind') for row in rows).items())),
              'source_urls': sorted({row.get('source_url') for row in rows if row.get('source_url')}),
              'matched_keywords': dict(sorted(Counter(keyword for row in rows for keyword in row.get('matched_keywords', [])).items())),
          }
          (root / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))

      - name: Commit observations
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/run-wef-depth8-vendor-ledger.yml || true
          git add imports/wef-depth-8/smart-columbus-vendor-ledger
          if git diff --cached --quiet; then
            echo 'No collector changes to commit'
            exit 0
          fi
          git commit -m 'Collect WEF depth 8 vendor ledger observations'
          git push origin HEAD:agent/wef-columbus-depth-7-public-records
