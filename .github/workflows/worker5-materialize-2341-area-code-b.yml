name: Worker 5 materialize issue 2341 area-code shard B

on:
  push:
    branches:
      - agent/worker5-area-code-b-682-703-706-20260915
    paths:
      - digs/anarchist-violence/2026-09-15-area-codes-b-682-703-706/starintel-documents.jsonl
      - .github/workflows/worker5-materialize-2341-area-code-b.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize existing canonical relation endpoints
        shell: bash
        run: |
          set -euo pipefail
          prereqs="${RUNNER_TEMP}/worker5-existing-org-prereqs.jsonl"
          : > "${prereqs}"
          grep -F '"_id":"starintel:org:northern-virginia-mutual-aid"' \
            digs/anarchist-violence/2026-09-09-area-codes-b-559-562-571/starintel-documents.jsonl \
            >> "${prereqs}"
          grep -F '"_id":"starintel:org:athens-mutual-aid-network"' \
            digs/anarchist-violence/2026-09-09-area-code-shard-a-pass-25/starintel-documents-part-002.jsonl \
            >> "${prereqs}"
          test "$(wc -l < "${prereqs}")" -eq 2
          python3 scripts/starintel.py import "${prereqs}"

      - name: Import packet through canonical writer
        run: python3 scripts/starintel.py import digs/anarchist-violence/2026-09-15-area-codes-b-682-703-706/starintel-documents.jsonl

      - name: Commit importer-generated DB records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/
          if git diff --cached --quiet; then
            echo "No importer-generated DB changes"
            exit 0
          fi
          git commit -m "Materialize #2341 shard-B 682/703/706 records"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Validate complete StarIntel corpus
        run: python3 scripts/starintel.py validate --root .
