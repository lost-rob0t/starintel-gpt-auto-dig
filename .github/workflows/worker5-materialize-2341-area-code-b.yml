name: Worker 5 materialize issue 2341 area-code shard B

on:
  push:
    branches:
      - agent/worker5-area-code-b-724-727-730-20260915
    paths:
      - digs/anarchist-violence/2026-09-15-area-codes-b-724-727-730/starintel-documents.jsonl
      - .github/workflows/worker5-materialize-2341-area-code-b.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect executable schema authority
        run: |
          set -euo pipefail
          python3 scripts/starintel.py types
          for dtype in source org investigation-target relation research-pass; do
            python3 scripts/starintel.py schema --dtype "$dtype" >/dev/null
          done

      - name: Import packet through canonical writer
        run: python3 scripts/starintel.py import digs/anarchist-violence/2026-09-15-area-codes-b-724-727-730/starintel-documents.jsonl

      - name: Commit importer-generated DB records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/
          if git diff --cached --quiet; then
            echo "No importer-generated DB changes"
            exit 0
          fi
          git commit -m "Materialize #2341 shard-B 724/727/730 records"
          git push origin HEAD:${GITHUB_REF_NAME}
