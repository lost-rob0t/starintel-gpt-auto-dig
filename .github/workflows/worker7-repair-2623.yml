name: Worker 7 canonical timestamp repair

on:
  push:
    branches:
      - osint/2573-indivisible-dallas-network
    paths:
      - .github/workflows/worker7-repair-2623.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'worker7: canonicalize Dallas date-time fields via importer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: osint/2573-indivisible-dallas-network
          fetch-depth: 1

      - name: Verify Auto-Dig control gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          control = json.loads(Path('config/auto-dig-control.json').read_text())
          assert control.get('enabled') is True, control
          assert control.get('state') == 'running', control
          assert control.get('allow_state_advance') is True, control
          print('auto-dig control gate: running')
          PY

      - name: Verify release authority
        run: |
          set -euo pipefail
          python3 scripts/schema-release.py current
          python3 scripts/schema-release.py check
          python3 scripts/starintel.py schema --dtype source >/tmp/source-schema.json
          python3 scripts/starintel.py schema --dtype relation >/tmp/relation-schema.json

      - name: Build corrected batch outside db
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from starintel_doc.store import compact
          from starintel_doc.validation import validate_document

          packet = Path('digs/dallas/2026-09-11-indivisible-dallas-network/starintel-documents.jsonl')
          output = Path('/tmp/dallas-fixed.jsonl')
          date_only = re.compile(r'^\d{4}-\d{2}-\d{2}$')

          source_ids = {
              'starintel:source:dallasnews-22395590-olson',
              'starintel:source:dallasnews-22425580-anti-trump-march',
              'starintel:source:dallasvoice-dallas-against-the-trump-agenda',
              'starintel:source:foxnews-two-arrested-socialist-anti-trump-protest',
              'starintel:source:narativ-0908-dallas',
          }
          relation_ids = {
              'starintel:relation:data-coalition-organizes-march-2026',
              'starintel:relation:data-coalition-permit-interaction-dallas-police',
              'starintel:relation:dfw-anti-war-committee-partner-data-coalition',
              'starintel:relation:el-movimiento-partner-data-coalition',
              'starintel:relation:freedom-road-socialist-organization-partner-data-coalition',
              'starintel:relation:indivisible-dallas-coorganizes-data-coalition',
              'starintel:relation:naarpr-dfw-partner-data-coalition',
              'starintel:relation:sonja-olson-member-indivisible-dallas',
              'starintel:relation:sonja-olson-spokesperson-march-2026',
              'starintel:relation:wethepeople-dallas-coorganizes-data-coalition',
          }

          docs = [json.loads(line) for line in packet.read_text(encoding='utf-8').splitlines() if line.strip()]
          seen_sources = set()
          seen_relations = set()

          for doc in docs:
              doc_id = doc['_id']
              data = doc.get('data', {})
              if doc_id in source_ids:
                  value = data.get('published_at')
                  assert isinstance(value, str) and date_only.fullmatch(value), (doc_id, value)
                  data['published_at'] = f'{value}T00:00:00Z'
                  seen_sources.add(doc_id)
              if doc_id in relation_ids:
                  value = data.get('start_at')
                  assert isinstance(value, str) and date_only.fullmatch(value), (doc_id, value)
                  data['start_at'] = f'{value}T00:00:00Z'
                  seen_relations.add(doc_id)
              validate_document(doc)

          assert seen_sources == source_ids, (source_ids - seen_sources, seen_sources - source_ids)
          assert seen_relations == relation_ids, (relation_ids - seen_relations, seen_relations - relation_ids)
          output.write_text(''.join(compact(doc) + '\n' for doc in docs), encoding='utf-8')
          print(f'corrected sources={len(seen_sources)} relations={len(seen_relations)} documents={len(docs)}')
          PY

      - name: Write normalized DB only through canonical importer
        run: |
          set -euo pipefail
          python3 scripts/starintel.py import /tmp/dallas-fixed.jsonl --replace
          cp /tmp/dallas-fixed.jsonl digs/dallas/2026-09-11-indivisible-dallas-network/starintel-documents.jsonl

      - name: Assert correction delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          paths = [line for line in subprocess.check_output(['git','diff','--name-only'], text=True).splitlines() if line]
          packet = 'digs/dallas/2026-09-11-indivisible-dallas-network/starintel-documents.jsonl'
          db = [p for p in paths if p.startswith('db/')]
          assert packet in paths, paths
          assert len(db) == 15, db
          unexpected = [p for p in paths if p != packet and not p.startswith('db/')]
          assert not unexpected, unexpected
          print(f'correction delta: db={len(db)} packet=1')
          PY
          git diff --check

      - name: Commit canonical importer output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'starintel-auto-dig-worker-7'
          git config user.email 'actions@users.noreply.github.com'
          git add db/ digs/dallas/2026-09-11-indivisible-dallas-network/starintel-documents.jsonl
          git commit -m 'worker7: canonicalize Dallas date-time fields via importer'
          git push origin HEAD:osint/2573-indivisible-dallas-network
