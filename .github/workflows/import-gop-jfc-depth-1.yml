name: Import GOP JFC depth 1

on:
  pull_request:
    branches:
      - main
      - agent/gop-national-depth-0-rebased
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/import-gop-jfc-depth-1.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v6
        with:
          ref: agent/gop-jfc-depth-1-rebased
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Restore exact depth-1 increment
        run: |
          git fetch --no-tags --depth=1 origin da653ea163e3e60859dd32951c6ac922ea4e648b
          git checkout da653ea163e3e60859dd32951c6ac922ea4e648b -- \
            'db/analysis/starintel:analysis:gop-jfc-network-depth-1.ndjson' \
            'db/claim/starintel:claim:invest-in-america-2026-fec-summary-2026.ndjson' \
            'db/claim/starintel:claim:team-moreno-fec-summary-2026.ndjson' \
            'db/claim/starintel:claim:trump-national-committee-jfc-fec-summary-2026.ndjson' \
            'db/investigation-target/starintel:investigation-target:gop-jfc-participant-network-depth-1.ndjson' \
            'db/investigation-target/starintel:investigation-target:gop-jfc-transfer-recipient-resolution-depth-2.ndjson' \
            'db/org/starintel:org:invest-in-america-2026.ndjson' \
            'db/org/starintel:org:team-moreno.ndjson' \
            'db/org/starintel:org:trump-national-committee-jfc.ndjson' \
            'db/person/starintel:person:jennifer-rich.ndjson' \
            'db/person/starintel:person:katy-williams.ndjson' \
            'db/person/starintel:person:kristi-broghamer.ndjson' \
            'db/relation/starintel:relation:invest-in-america-2026-includes-national-committee.ndjson' \
            'db/relation/starintel:relation:jennifer-rich-treasurer-of-rnc.ndjson' \
            'db/relation/starintel:relation:katy-williams-treasurer-of-nrcc.ndjson' \
            'db/relation/starintel:relation:kristi-broghamer-treasurer-of-nrsc.ndjson' \
            'db/relation/starintel:relation:team-moreno-includes-national-committee.ndjson' \
            'db/relation/starintel:relation:trump-national-committee-jfc-includes-national-committee.ndjson' \
            'db/research-pass/starintel:research-pass:gop-jfc-network-depth-1-2026-07-31.ndjson' \
            digs/gop/2026-07-31-jfc-network-depth-1

      - name: Run mandatory merge gate
        run: python3 scripts/validate-for-merge.py

      - name: Commit imported increment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db digs/gop/2026-07-31-jfc-network-depth-1
          git diff --cached --check
          git commit -m "Restore GOP JFC depth 1 packet"
          git push origin HEAD:agent/gop-jfc-depth-1-rebased
