name: Generate DNC FEC administrative fines

on:
  workflow_dispatch:
  push:
    branches:
      - agent/dnc-fec-project-veritas-seed
    paths:
      - scripts/import_dnc_fec_administrative_fines.py
      - .github/workflows/dnc-fec-administrative-fines.yml

permissions:
  contents: write

concurrency:
  group: dnc-fec-administrative-fines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: .
      TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate official FEC administrative-fine corpus
        run: python3 scripts/import_dnc_fec_administrative_fines.py

      - name: Enforce GitHub-safe files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('digs/dnc/2026-07-31-fec-administrative-fines')
          files = [path for path in root.rglob('*') if path.is_file()]
          if not files:
              raise SystemExit('administrative-fine lane emitted no files')
          oversized = [(str(path), path.stat().st_size) for path in files if path.stat().st_size > 95_000_000]
          if oversized:
              raise SystemExit(f'oversized generated files: {oversized}')
          print({'files': len(files), 'largest': max((path.stat().st_size, str(path)) for path in files)})
          PY

      - name: Validate complete repository
        run: python3 scripts/validate-for-merge.py --site

      - name: Commit generated packet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add digs/dnc/2026-07-31-fec-administrative-fines
          if git diff --cached --quiet; then
            echo 'Generated packet is unchanged.'
            exit 0
          fi
          git commit -m 'Add FEC administrative fines involving Democratic committee leads [skip ci]'
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin HEAD:${TARGET_BRANCH}
