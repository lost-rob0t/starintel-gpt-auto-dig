name: Repair Brett Leatherman packet

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/repair-brett-leatherman-packet.yml
      - scripts/repair-brett-leatherman-packet.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/brett-leatherman-fed-wef-rebased

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Repair and validate packet
        run: PYTHONPATH=. python3 scripts/repair-brett-leatherman-packet.py

      - name: Run mandatory merge gate
        run: python3 scripts/validate-for-merge.py

      - name: Commit repaired packet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digs/fed/2026-07-31-brett-leatherman-adverse-depth-1/starintel-documents.jsonl
          git diff --cached --check
          git commit -m "Normalize Brett Leatherman litigation record"
          git push origin HEAD:agent/brett-leatherman-fed-wef-rebased
