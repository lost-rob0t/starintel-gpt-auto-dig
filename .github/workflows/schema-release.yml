name: Schema release tooling

on:
  pull_request:
    paths:
      - ".github/workflows/schema-release.yml"
      - "scripts/schema-release.py"
      - "scripts/check-starintel-schema-lock.py"
      - "scripts/sync-starintel-authority.py"
      - "tests/test_schema_release.py"
      - "schema/starintel-schema.lock.json"
      - "schema/star-lang/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/schema-release.yml"
      - "scripts/schema-release.py"
      - "scripts/check-starintel-schema-lock.py"
      - "scripts/sync-starintel-authority.py"
      - "tests/test_schema_release.py"
      - "schema/starintel-schema.lock.json"
      - "schema/star-lang/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check current release authority
        run: python3 scripts/schema-release.py check
      - name: Test read-only release resolver
        run: python3 -m unittest tests.test_schema_release -v
