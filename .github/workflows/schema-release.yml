name: Schema release tooling

on:
  pull_request:
    paths:
      - ".github/workflows/schema-release.yml"
      - "scripts/schema-release.py"
      - "tests/test_schema_release.py"
      - "schemas/starintel-doc-v0.9.0.expansion.json"
      - "schemas/starintel-doc-v0.9.0.manifest.json"
      - "conformance/__init__.py"
      - "conformance/implementations.json"
      - "conformance/fixtures.py"
      - "starintel_auto_dig.nimble"
      - "tests/test_operation_registry.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/schema-release.yml"
      - "scripts/schema-release.py"
      - "tests/test_schema_release.py"
      - "schemas/starintel-doc-v0.9.0.expansion.json"
      - "schemas/starintel-doc-v0.9.0.manifest.json"
      - "conformance/__init__.py"
      - "conformance/implementations.json"
      - "conformance/fixtures.py"
      - "starintel_auto_dig.nimble"
      - "tests/test_operation_registry.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the pinned canonical runtime
        run: python3 -m pip install "git+https://github.com/lost-rob0t/starintel-doc.git@$(jq -r .python_commit schema/starintel-runtime.lock.json)"
      - name: Checkout the pinned Nim runtime
        uses: actions/checkout@v6
        with:
          repository: lost-rob0t/starintel-doc.nim
          ref: 827f2c072e9893561a1925c47f898458bafd6759
          path: .starintel-doc-nim
      - name: Check current release authority
        run: python3 scripts/schema-release.py check
      - name: Test archived local profile release tooling
        run: python3 -m unittest tests.test_schema_release -v
