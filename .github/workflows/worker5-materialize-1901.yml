name: Worker 5 materialize request 1901

on:
  push:
    branches:
      - agent/worker5-rensselaer-parma-share-1901-20260915
    paths:
      - digs/flock/2026-09-15-request-1901-parma-incoming-share/starintel-documents.jsonl
      - .github/workflows/worker5-materialize-1901.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Import packet through canonical writer
        run: python3 scripts/starintel.py import digs/flock/2026-09-15-request-1901-parma-incoming-share/starintel-documents.jsonl

      - name: Commit importer-generated DB records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/
          if git diff --cached --quiet; then
            echo "No importer-generated DB changes"
          else
            git commit -m "Materialize #1901 canonical records"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Validate complete StarIntel corpus
        run: python3 scripts/starintel.py validate --root .
