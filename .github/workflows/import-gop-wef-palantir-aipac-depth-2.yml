name: Import GOP WEF Palantir AIPAC depth 2

on:
  pull_request:
    branches:
      - main
      - agent/gop-jfc-depth-1-rebased
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/import-gop-wef-palantir-aipac-depth-2.yml
      - scripts/repair-gop-depth2.py

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v6
        with:
          ref: agent/gop-wef-palantir-aipac-depth-2-rebased
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Restore exact depth-2 increment
        run: |
          git fetch --no-tags --depth=1 origin da653ea163e3e60859dd32951c6ac922ea4e648b
          git fetch --no-tags --depth=1 origin 5287d39628188b541ee972820d3cb1a52c46a147
          while IFS= read -r path; do
            if [ "$path" = 'db/person/starintel:person:alex-karp.ndjson' ]; then
              continue
            fi
            git checkout 5287d39628188b541ee972820d3cb1a52c46a147 -- "$path"
          done < <(git diff --name-only da653ea163e3e60859dd32951c6ac922ea4e648b 5287d39628188b541ee972820d3cb1a52c46a147)
          git show '5287d39628188b541ee972820d3cb1a52c46a147:db/person/starintel:person:alex-karp.ndjson' > /tmp/alex-karp-depth-2.ndjson

      - name: Reconcile canonical and legacy records
        run: PYTHONPATH=. python3 scripts/repair-gop-depth2.py

      - name: Run mandatory merge gate
        run: python3 scripts/validate-for-merge.py

      - name: Commit imported increment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db digs/gop/2026-07-31-wef-palantir-aipac-depth-2
          git diff --cached --check
          git commit -m "Restore GOP WEF Palantir AIPAC depth 2 packet"
          git push origin HEAD:agent/gop-wef-palantir-aipac-depth-2-rebased
