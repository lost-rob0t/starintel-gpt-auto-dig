name: Import research node schema expansion

on:
  push:
    branches: [agent/research-node-spec]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/research-node-spec
          fetch-depth: 0

      - name: Fetch expansion source branch
        run: git fetch origin agent/starintel-v0.9-field-expansion

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Import and extend schema bundle
        run: python scripts/import-research-node-expansion.py

      - name: Verify bundle metadata
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def canonicalize(value):
              if isinstance(value, list):
                  return [canonicalize(item) for item in value]
              if isinstance(value, dict):
                  return {key: canonicalize(value[key]) for key in sorted(value)}
              return value

          root = Path("schemas")
          expansion = json.loads((root / "starintel-doc-v0.9.0.expansion.json").read_text())
          manifest = json.loads((root / "starintel-doc-v0.9.0.manifest.json").read_text())
          payload = json.dumps(canonicalize(expansion), ensure_ascii=False, separators=(",", ":")).encode()
          assert manifest["expansion_content_hash"] == hashlib.sha256(payload).hexdigest()
          assert manifest["dtype_count"] == len(expansion["dtype_fields"])
          assert "research-node" in expansion["dtype_fields"]
          PY

      - name: Commit schema bundle
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/starintel-doc-v0.9.0.expansion.json schemas/starintel-doc-v0.9.0.manifest.json
          git commit -m "Add research-node schema expansion"
          git push origin HEAD:agent/research-node-spec
