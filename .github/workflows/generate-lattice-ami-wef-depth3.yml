name: Generate Lattice AMI WEF depth-3 records

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Decode research packet
        shell: bash
        run: |
          mkdir -p digs/wef/2026-07-27-lattice-ami-named-representatives-depth-3
          base64 -d .github/depth3-payload/lattice-ami-depth3.jsonl.gz.b64 \
            | gzip -d \
            > digs/wef/2026-07-27-lattice-ami-named-representatives-depth-3/starintel-documents.jsonl
          test "$(sha256sum digs/wef/2026-07-27-lattice-ami-named-representatives-depth-3/starintel-documents.jsonl | cut -d' ' -f1)" = "1ec0a36f300b56d0cbe6a89b5a204dd52c435066fef26e7739e0b28f42147361"
      - name: Run mandatory merge gate
        run: python3 scripts/validate-for-merge.py --site
      - name: Commit generated research packet
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digs/wef/2026-07-27-lattice-ami-named-representatives-depth-3/starintel-documents.jsonl
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "data: add Lattice AMI WEF depth-3 records"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
