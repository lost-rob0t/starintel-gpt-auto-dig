name: Fix FBI packet schema

on:
  push:
    branches:
      - agent/fbi-tsc-ai-procurement-lineage-depth-2
    paths:
      - scripts/fix_fbi_packet_schema.py
      - .github/workflows/fix-fbi-packet-schema.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fbi-tsc-ai-procurement-lineage-depth-2
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Repair strict schema fields
        run: python3 scripts/fix_fbi_packet_schema.py

      - name: Validate repaired corpus
        run: python3 scripts/validate-for-merge.py

      - name: Commit repairs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- digs/fed; then
            echo "No packet repairs required."
            exit 0
          fi
          git config user.name "starintel-auto-dig-maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add digs/fed
          git commit -m "Repair FBI packet schema fields"
          git push origin HEAD:agent/fbi-tsc-ai-procurement-lineage-depth-2
