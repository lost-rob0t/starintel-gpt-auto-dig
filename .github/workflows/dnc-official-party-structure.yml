name: Generate official DNC party structure

on:
  workflow_dispatch:
  push:
    branches:
      - agent/dnc-fec-project-veritas-seed
    paths:
      - scripts/import_dnc_official_party_structure.py
      - .github/workflows/dnc-official-party-structure.yml

permissions:
  contents: write

concurrency:
  group: dnc-official-party-structure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: .
      TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install official-page parser
        run: python3 -m pip install --disable-pip-version-check 'beautifulsoup4>=4.12,<5'

      - name: Generate official party-structure corpus
        run: python3 scripts/import_dnc_official_party_structure.py

      - name: Validate complete repository
        run: python3 scripts/validate-for-merge.py --site

      - name: Commit generated packet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add digs/dnc/2026-07-31-official-party-structure
          if git diff --cached --quiet; then
            echo 'Generated packet is unchanged.'
            exit 0
          fi
          git commit -m 'Add official DNC party structure [skip ci]'
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin HEAD:${TARGET_BRANCH}
