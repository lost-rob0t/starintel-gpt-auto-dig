name: Worker 6 materialize request 1902 Hudson candidate

on:
  push:
    branches:
      - agent/worker6-stewarts-hudson-candidate-1902-20260915
    paths:
      - digs/flock/2026-09-15-request-1902-hudson-candidate-resolution/starintel-documents.jsonl
      - .github/workflows/worker6-materialize-1902-hudson-candidate.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import packet through canonical writer
        run: python3 scripts/starintel.py import digs/flock/2026-09-15-request-1902-hudson-candidate-resolution/starintel-documents.jsonl

      - name: Commit importer-generated DB records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+lost-rob0t@users.noreply.github.com"
          git add db/
          if git diff --cached --quiet; then
            echo "No importer-generated DB changes"
          else
            git commit -m "Materialize #1902 Hudson candidate-resolution canonical records"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Validate complete StarIntel corpus
        run: python3 scripts/starintel.py validate --root .
