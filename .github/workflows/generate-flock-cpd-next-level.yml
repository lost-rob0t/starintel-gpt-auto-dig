name: Generate CPD Flock next-level packet

on:
  push:
    branches:
      - agent/flock-cpd-next-level
    paths:
      - scripts/generate-flock-cpd-next-level.py
      - .github/workflows/generate-flock-cpd-next-level.yml

permissions:
  contents: write

concurrency:
  group: generate-flock-cpd-next-level
  cancel-in-progress: false

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v6
        with:
          ref: agent/flock-cpd-next-level
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate packet
        run: python3 scripts/generate-flock-cpd-next-level.py

      - name: Run mandatory merge gate
        run: python3 scripts/validate-for-merge.py --site

      - name: Commit generated packet and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/generate-flock-cpd-next-level.yml
          git add scripts/generate-flock-cpd-next-level.py \
            digs/flock-safety/2026-07-26-columbus-cpd-next-level \
            .github/workflows/generate-flock-cpd-next-level.yml
          git commit -m "Add CPD Flock next-level research"
          git push origin HEAD:agent/flock-cpd-next-level
