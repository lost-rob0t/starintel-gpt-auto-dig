name: Worker 4 materialize request 2100 Axon controls

on:
  push:
    branches:
      - agent/worker4-axon-platform-controls-2100-20260915
    paths:
      - digs/axon/2026-09-15-request-2100-platform-control-baseline/starintel-documents.jsonl
      - .github/workflows/worker4-materialize-2100-axon.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove undeclared research-pass helper fields
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('digs/axon/2026-09-15-request-2100-platform-control-baseline/starintel-documents.jsonl')
          docs = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          for doc in docs:
              data = doc.get('data', {})
              data.pop('completion_state', None)
              data.pop('next_steps', None)
          path.write_text('\n'.join(json.dumps(doc, separators=(',', ':'), ensure_ascii=False) for doc in docs) + '\n')
          PY
      - name: Import packet through canonical writer
        run: python3 scripts/starintel.py import digs/axon/2026-09-15-request-2100-platform-control-baseline/starintel-documents.jsonl
      - name: Commit corrected packet and importer-generated DB records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digs/axon/2026-09-15-request-2100-platform-control-baseline/starintel-documents.jsonl db/
          if git diff --cached --quiet; then
            echo "No packet or importer-generated DB changes"
            exit 0
          fi
          git commit -m "Materialize #2100 Axon platform controls"
          git push origin HEAD:${GITHUB_REF_NAME}
