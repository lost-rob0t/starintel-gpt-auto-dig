name: Build and publish research site

on:
  push:
    branches: [main]
    paths:
      - "starintel_doc/**"
      - "schemas/**"
      - "digs/**"
      - "db/**"
      - "scripts/**"
      - "tests/**"
      - "docs/quasar-integration.md"
      - "quasar-fork.lock.json"
      - "site-assets/**"
      - "site-config.json"
      - ".github/workflows/publish-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "starintel_doc/**"
      - "schemas/**"
      - "digs/**"
      - "db/**"
      - "scripts/**"
      - "tests/**"
      - "docs/quasar-integration.md"
      - "quasar-fork.lock.json"
      - "site-assets/**"
      - "site-config.json"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Read pinned Quasar runtime
        id: quasar-pin
        run: |
          test -s quasar-fork.lock.json
          echo "quasar=$(python3 -c 'import json; print(json.load(open("quasar-fork.lock.json"))["quasar_commit"])')" >> "$GITHUB_OUTPUT"
          echo "ui=$(python3 -c 'import json; print(json.load(open("quasar-fork.lock.json"))["quasar_ui_commit"])')" >> "$GITHUB_OUTPUT"
          echo "auto_dig=$(python3 -c 'import json; print(json.load(open("quasar-fork.lock.json"))["auto_dig_version"])')" >> "$GITHUB_OUTPUT"
          echo "schema=$(python3 -c 'import json; print(json.load(open("quasar-fork.lock.json"))["starintel_schema_version"])')" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Quasar runtime
        uses: actions/checkout@v6
        with:
          repository: lost-rob0t/quasar
          ref: ${{ steps.quasar-pin.outputs.quasar }}
          path: .quasar
          submodules: recursive

      - name: Verify pinned Quasar frontend
        run: |
          test "$(git -C .quasar rev-parse HEAD)" = "${{ steps.quasar-pin.outputs.quasar }}"
          test "$(git -C .quasar/frontend rev-parse HEAD)" = "${{ steps.quasar-pin.outputs.ui }}"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .quasar/frontend/package-lock.json

      - name: Validate and build Quasar
        env:
          VITE_BASE_PATH: /quasar/app/
          VITE_AUTODIG_CORRECTION_REPO: lost-rob0t/starintel-gpt-auto-dig
          VITE_QUASAR_COMMIT: ${{ steps.quasar-pin.outputs.quasar }}
          VITE_QUASAR_UI_COMMIT: ${{ steps.quasar-pin.outputs.ui }}
          VITE_AUTODIG_VERSION: ${{ steps.quasar-pin.outputs.auto_dig }}
          VITE_STARINTEL_SCHEMA_VERSION: ${{ steps.quasar-pin.outputs.schema }}
        run: |
          npm --prefix .quasar/frontend ci
          bash .quasar/scripts/prepare-frontend.sh
          npm --prefix .quasar/frontend run check
          npm --prefix .quasar/frontend test
          npm --prefix .quasar/frontend run build

      - name: Run mandatory StarIntel merge gate
        run: python3 scripts/validate-for-merge.py

      - name: Test Quasar host integration
        run: python3 -m unittest tests.test_auto_dig_quasar

      - name: Generate research explorer
        run: |
          python scripts/build_research_site.py \
            --input digs \
            --db db \
            --output _site \
            --org-output .generated/org

      - name: Install Quasar graph editor
        run: |
          python3 scripts/build-auto-dig-quasar.py \
            --auto-dig-root . \
            --site-dir _site \
            --quasar-dist .quasar/frontend/dist \
            --quasar-commit "${{ steps.quasar-pin.outputs.quasar }}" \
            --quasar-ui-commit "${{ steps.quasar-pin.outputs.ui }}" \
            --auto-dig-version "${{ steps.quasar-pin.outputs.auto_dig }}" \
            --starintel-schema-version "${{ steps.quasar-pin.outputs.schema }}"

      - name: Validate generated artifacts
        run: |
          test -s _site/index.html
          test -s _site/search-index.json
          test -s _site/downloads/starintel-complete-corpus.jsonl
          test -s _site/downloads/starintel-complete-corpus.manifest.json
          test -s _site/downloads/starintel-evidence-seal.json
          test -s _site/evidence-seal.html
          test -s _site/assets/graph-core.mjs
          test -s _site/assets/graph-explorer.mjs
          test -s _site/assets/graph-render-scaled.mjs
          test -s _site/assets/dashboard.js
          test -s _site/assets/explorer.css
          test -s _site/quasar/index.html
          test -s _site/quasar/host.js
          test -s _site/quasar/version.json
          test -s _site/quasar/app/index.html
          test -s _site/larry-fink/index.html
          test -s _site/palantir/index.html
          test -s _site/palantir/graph.html
          test -s _site/palantir/documents.html
          test -s _site/palantir/documents.json
          test -s _site/palantir/graph.json
          test -s _site/palantir/downloads/starintel-documents.jsonl
          test -s .generated/org/palantir/index.org
          grep -q 'Download complete corpus' _site/index.html
          grep -q 'downloads/starintel-complete-corpus.jsonl' _site/index.html
          grep -q 'downloads/starintel-complete-corpus.manifest.json' _site/index.html
          grep -q 'data-evidence-seal' _site/index.html
          grep -q 'evidence-seal.html' _site/index.html
          grep -q 'graph-launch-card' _site/palantir/index.html
          grep -q '../quasar/index.html?dataset=palantir' _site/palantir/graph.html
          grep -q 'documents.json' _site/palantir/documents.html
          grep -q 'GRAPH_ROUTE = "/graph"' _site/quasar/host.js
          grep -q 'app/index.html?host=auto-dig' _site/quasar/index.html
          ! grep -q '<header' _site/quasar/index.html
          ! grep -q 'data-quasar-route' _site/quasar/index.html
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from starintel_doc.integrity import verify_corpus_seal
          from starintel_doc.validation import validate_document

          graph = json.loads(Path("_site/palantir/graph.json").read_text())
          assert graph["nodes"]
          assert graph["edges"]
          assert graph["meta"]["reviewed_nodes"] >= 0
          assert all("reviewed" in node for node in graph["nodes"])
          assert all("reviewed" in edge for edge in graph["edges"])
          assert any(
              edge["source"] == "starintel:person:alex-karp"
              and edge["target"] == "starintel:org:palantir-technologies-inc"
              and edge["label"] == "founded"
              for edge in graph["edges"]
          )
          documents = json.loads(Path("_site/palantir/documents.json").read_text())
          assert documents
          assert all(record["review"] in {"reviewed", "unreviewed"} for record in documents)
          search = json.loads(Path("_site/search-index.json").read_text())
          assert any(record["id"] == "starintel:org:palantir-technologies-inc" for record in search)

          corpus_path = Path("_site/downloads/starintel-complete-corpus.jsonl")
          corpus = [json.loads(line) for line in corpus_path.read_text().splitlines() if line.strip()]
          assert corpus
          assert len({document["_id"] for document in corpus}) == len(corpus)
          assert corpus == sorted(corpus, key=lambda document: document["_id"])
          assert len(corpus) <= len(search)

          corpus_bytes = corpus_path.read_bytes()
          manifest = json.loads(Path("_site/downloads/starintel-complete-corpus.manifest.json").read_text())
          validate_document(manifest)
          assert manifest["dtype"] == "dataset-manifest"
          assert manifest["data"]["record_count"] == len(corpus)
          assert manifest["data"]["counts_by_dtype"] == {
              dtype: sum(document["dtype"] == dtype for document in corpus)
              for dtype in sorted({document["dtype"] for document in corpus})
          }
          assert manifest["data"]["schema_versions"] == sorted({document["schema_version"] for document in corpus})
          assert manifest["data"]["files"] == [{
              "path": "starintel-complete-corpus.jsonl",
              "media_type": "application/x-ndjson",
              "size_bytes": len(corpus_bytes),
          }]
          assert manifest["data"]["hash_algorithm"] == "sha256"
          assert manifest["data"]["content_hash"] == hashlib.sha256(corpus_bytes).hexdigest()

          receipt_path = Path("_site/downloads/starintel-evidence-seal.json")
          receipt = json.loads(receipt_path.read_text())
          seal_result = verify_corpus_seal(corpus_path, receipt)
          assert seal_result["ok"], seal_result["errors"]
          assert receipt["leaf_count"] == len(corpus)
          assert receipt["corpus_file_sha256"] == hashlib.sha256(corpus_bytes).hexdigest()
          assert receipt["merkle_root_sha256"] in Path("_site/evidence-seal.html").read_text()

          version = json.loads(Path("_site/quasar/version.json").read_text())
          lock = json.loads(Path("quasar-fork.lock.json").read_text())
          assert version == lock
          PY

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Package PR build artifact
        if: github.event_name == 'pull_request'
        run: tar -czf starintel-research-site.tar.gz _site .generated/org

      - name: Upload PR build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: starintel-research-site
          path: starintel-research-site.tar.gz
          compression-level: 0
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
