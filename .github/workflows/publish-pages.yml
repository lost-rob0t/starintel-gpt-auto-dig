name: Build and publish research site

on:
  push:
    branches: [main]
    paths:
      - "digs/**"
      - "db/**"
      - "scripts/build_research_site.py"
      - "scripts/validate-db.py"
      - "scripts/starintel_site/**"
      - "site-assets/**"
      - "site-config.json"
      - ".github/workflows/publish-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "digs/**"
      - "db/**"
      - "scripts/build_research_site.py"
      - "scripts/validate-db.py"
      - "scripts/starintel_site/**"
      - "site-assets/**"
      - "site-config.json"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate Python and database
        run: |
          python -m compileall -q scripts
          python scripts/validate-db.py

      - name: Generate research explorer
        run: |
          python scripts/build_research_site.py \
            --input digs \
            --db db \
            --output _site \
            --org-output .generated/org

      - name: Validate generated artifacts
        run: |
          test -s _site/index.html
          test -s _site/larry-fink/index.html
          test -s _site/larry-fink/graph.json
          test -s _site/palantir/index.html
          test -s _site/palantir/graph.json
          test -s _site/palantir/nodes/org-palantir-technologies-inc.html
          test -s _site/palantir/downloads/starintel-documents.jsonl
          test -s .generated/org/palantir/index.org
          python - <<'PY'
          import json
          from pathlib import Path

          palantir = json.loads(Path("_site/palantir/graph.json").read_text())
          assert palantir["nodes"]
          assert palantir["edges"]
          assert any(
              edge["source"] == "starintel:person:alex-karp"
              and edge["target"] == "starintel:org:palantir-technologies-inc"
              and edge["label"] == "founded"
              for edge in palantir["edges"]
          )

          search = json.loads(Path("_site/search-index.json").read_text())
          assert any(
              record["target"] == "palantir"
              and record["id"] == "starintel:org:palantir-technologies-inc"
              for record in search
          )

          html = Path("_site/larry-fink/index.html").read_text()
          assert "Fascism fit" not in html
          assert "Corporatism and fascism comparison matrix" not in html
          print("validated", len(palantir["nodes"]), "Palantir nodes and", len(palantir["edges"]), "edges")
          PY

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Upload PR build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: starintel-research-site
          path: |
            _site
            .generated/org
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
