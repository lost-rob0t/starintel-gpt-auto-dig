name: Build and publish research site

on:
  push:
    branches: [main]
    paths:
      - "starintel_doc/**"
      - "schemas/**"
      - "digs/**"
      - "db/**"
      - "scripts/**"
      - "tests/**"
      - "docs/quasar-integration.md"
      - "docs/evidence-seal.md"
      - "docs/pages-site-size-architecture.md"
      - "quasar-fork.lock.json"
      - "site-assets/**"
      - "site-config.json"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-main
  cancel-in-progress: true

env:
  NIM_VERSION: 2.2.4
  STARINTEL_NIM_REF: b55316bae294a146523cd2f977b81096e538c86a
  PAGES_SAFE_BUDGET_BYTES: "750000000"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Checkout canonical StarIntel Nim runtime
        uses: actions/checkout@v6
        with:
          repository: lost-rob0t/starintel-doc.nim
          ref: ${{ env.STARINTEL_NIM_REF }}
          path: .starintel-doc-nim

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install transport helpers
        run: |
          sudo apt-get update
          sudo apt-get install --yes gzip unzip coreutils

      - name: Build StarIntel Nim pipeline
        run: nimble buildFast

      - name: Validate corpus and emit source audit
        run: |
          bin/starintel-validate --root .
          test -f unverifed
          echo "source-less documents: $(grep -vc '^#' unverifed || true)"

      - name: Generate bounded Pages site and canonical bulk shards
        env:
          BULK_TAG: auto-dig-data-${{ github.sha }}
        run: |
          BULK_BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${BULK_TAG}"
          bin/starintel-site \
            --input digs \
            --db db \
            --output _site \
            --org-output .generated/org \
            --bulk-output .generated/bulk \
            --bulk-base-url "$BULK_BASE_URL"
          python3 scripts/externalize_search_indexes.py \
            --site _site \
            --transport pages-static
          test -s _site/index.html
          test -s _site/search-index.json
          test -d _site/indexes/records
          test -d _site/indexes/search
          test -n "$(find _site/indexes/records -name '*.json' -print -quit)"
          test -n "$(find _site/indexes/search -name '*.json' -print -quit)"
          test -s _site/downloads/starintel-complete-corpus.manifest.json
          test -s .generated/bulk/starintel-complete-corpus.jsonl
          test ! -d _site/org
          test -z "$(find _site -name starintel-documents.jsonl -print -quit)"

      - name: Package deterministic release assets
        env:
          BULK_TAG: auto-dig-data-${{ github.sha }}
        run: |
          BULK_BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${BULK_TAG}"
          python3 scripts/package_bulk_release.py \
            --bulk .generated/bulk \
            --site _site \
            --output .generated/release \
            --base-url "$BULK_BASE_URL"
          test -s .generated/release/starintel-bulk-release.manifest.json
          test -n "$(find .generated/release -name '*.jsonl.gz' -print -quit)"

      - name: Publish evidence seal over canonical bulk stream
        run: |
          python3 scripts/evidence-seal.py publish \
            .generated/bulk/starintel-complete-corpus.jsonl \
            _site
          python3 scripts/evidence-seal.py verify \
            .generated/bulk/starintel-complete-corpus.jsonl \
            _site/downloads/starintel-evidence-seal.json

      - name: Read pinned Quasar runtime
        id: quasar-pin
        run: |
          test -s quasar-fork.lock.json
          echo "quasar=$(python3 -c 'import json; print(json.load(open("quasar-fork.lock.json"))["quasar_commit"])')" >> "$GITHUB_OUTPUT"
          echo "ui=$(python3 -c 'import json; print(json.load(open("quasar-fork.lock.json"))["quasar_ui_commit"])')" >> "$GITHUB_OUTPUT"
          echo "auto_dig=$(python3 -c 'import json; print(json.load(open("quasar-fork.lock.json"))["auto_dig_version"])')" >> "$GITHUB_OUTPUT"
          echo "schema=$(python3 -c 'import json; print(json.load(open("quasar-fork.lock.json"))["starintel_schema_version"])')" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Quasar runtime
        uses: actions/checkout@v6
        with:
          repository: lost-rob0t/quasar
          ref: ${{ steps.quasar-pin.outputs.quasar }}
          path: .quasar
          submodules: recursive

      - name: Verify pinned Quasar frontend
        run: |
          test "$(git -C .quasar rev-parse HEAD)" = "${{ steps.quasar-pin.outputs.quasar }}"
          test "$(git -C .quasar/frontend rev-parse HEAD)" = "${{ steps.quasar-pin.outputs.ui }}"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .quasar/frontend/package-lock.json

      - name: Validate and build Quasar
        env:
          VITE_BASE_PATH: /quasar/app/
          VITE_AUTODIG_CORRECTION_REPO: lost-rob0t/starintel-gpt-auto-dig
          VITE_QUASAR_COMMIT: ${{ steps.quasar-pin.outputs.quasar }}
          VITE_QUASAR_UI_COMMIT: ${{ steps.quasar-pin.outputs.ui }}
          VITE_AUTODIG_VERSION: ${{ steps.quasar-pin.outputs.auto_dig }}
          VITE_STARINTEL_SCHEMA_VERSION: ${{ steps.quasar-pin.outputs.schema }}
        run: |
          npm --prefix .quasar/frontend ci
          bash .quasar/scripts/prepare-frontend.sh
          npm --prefix .quasar/frontend run check
          npm --prefix .quasar/frontend test
          npm --prefix .quasar/frontend run build

      - name: Install Quasar graph editor
        run: |
          python3 scripts/build-auto-dig-quasar.py \
            --auto-dig-root . \
            --site-dir _site \
            --quasar-dist .quasar/frontend/dist \
            --quasar-commit "${{ steps.quasar-pin.outputs.quasar }}" \
            --quasar-ui-commit "${{ steps.quasar-pin.outputs.ui }}" \
            --auto-dig-version "${{ steps.quasar-pin.outputs.auto_dig }}" \
            --starintel-schema-version "${{ steps.quasar-pin.outputs.schema }}"

      - name: Validate final Pages artifact
        run: |
          test -s _site/index.html
          test -s _site/search-index.json
          test -d _site/indexes/records
          test -d _site/indexes/search
          test -s _site/downloads/starintel-complete-corpus.manifest.json
          test -s _site/downloads/starintel-bulk-release.manifest.json
          test -s _site/downloads/starintel-evidence-seal.json
          test -s _site/evidence-seal.html
          test -s _site/quasar/app/index.html
          test -s _site/quasar/version.json
          grep -q 'data-evidence-seal' _site/index.html
          grep -q 'starintel-complete-corpus.manifest.json' _site/evidence-seal.html
          python3 - <<'PY'
          from pathlib import Path
          total = sum(p.stat().st_size for p in Path('_site').rglob('*') if p.is_file())
          budget = int('${{ env.PAGES_SAFE_BUDGET_BYTES }}')
          print(f'final_pages_bytes={total} budget={budget}')
          if total >= budget:
              raise SystemExit(f'Pages artifact exceeds safe budget: {total} >= {budget}')
          PY

      - name: Verify bounded Pages search transport
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          site = Path('_site')
          config = json.loads((site / 'search-index.json').read_text())
          if config.get('format') != 'starintel-pages-static-index-v1':
              raise SystemExit(f"unexpected search transport: {config.get('format')!r}")
          candidates = [
              ('records', config['records']['pages'][0]),
              ('search', next(
                  segment
                  for segments in config['search']['segments'].values()
                  for segment in segments
              )),
          ]
          for group, segment in candidates:
              path = site / segment['url']
              payload = path.read_bytes()
              if len(payload) != int(segment['length']):
                  raise SystemExit(f'{group} segment length mismatch')
              digest = hashlib.sha256(payload).hexdigest()
              if digest != segment['sha256']:
                  raise SystemExit(f'{group} segment digest mismatch')
              json.loads(payload)
              print(f'{group}_pages_segment=PASS bytes={len(payload)} path={path}')
          PY

      - name: Create immutable bulk release
        env:
          GH_TOKEN: ${{ github.token }}
          BULK_TAG: auto-dig-data-${{ github.sha }}
        run: |
          if gh release view "$BULK_TAG" >/dev/null 2>&1; then
            gh release delete "$BULK_TAG" --cleanup-tag --yes
          fi
          gh release create "$BULK_TAG" \
            --target "$GITHUB_SHA" \
            --title "Auto-Dig bulk corpus ${GITHUB_SHA::12}" \
            --notes "Canonical StarIntel bulk corpus shards and dataset membership references for ${GITHUB_SHA}. Browser search indexes are served as bounded same-origin GitHub Pages segments."
          gh release upload "$BULK_TAG" .generated/release/* --clobber

      - name: Upload source audit
        uses: actions/upload-artifact@v4
        with:
          name: starintel-unverifed-source-audit
          path: unverifed
          if-no-files-found: error
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
