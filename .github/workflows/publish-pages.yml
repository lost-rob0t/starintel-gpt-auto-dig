name: Build and publish research site

on:
  push:
    branches: [main]
    paths:
      - "starintel_doc/**"
      - "schemas/**"
      - "digs/**"
      - "db/**"
      - "scripts/**"
      - "tests/**"
      - "docs/quasar-integration.md"
      - "docs/evidence-seal.md"
      - "quasar-fork.lock.json"
      - "site-assets/**"
      - "site-config.json"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build Nim site materializer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nim
          mkdir -p .generated/bin
          nim c -d:release --opt:speed --hints:off --warnings:off \
            -o:.generated/bin/materialize-site-input \
            scripts/materialize_site_input.nim
          echo "STARINTEL_SITE_MATERIALIZER=$GITHUB_WORKSPACE/.generated/bin/materialize-site-input" >> "$GITHUB_ENV"

      - name: Read pinned Quasar runtime
        id: quasar-pin
        run: |
          test -s quasar-fork.lock.json
          echo "quasar=$(python3 -c 'import json; print(json.load(open("quasar-fork.lock.json"))["quasar_commit"])')" >> "$GITHUB_OUTPUT"
          echo "ui=$(python3 -c 'import json; print(json.load(open("quasar-fork.lock.json"))["quasar_ui_commit"])')" >> "$GITHUB_OUTPUT"
          echo "auto_dig=$(python3 -c 'import json; print(json.load(open("quasar-fork.lock.json"))["auto_dig_version"])')" >> "$GITHUB_OUTPUT"
          echo "schema=$(python3 -c 'import json; print(json.load(open("quasar-fork.lock.json"))["starintel_schema_version"])')" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Quasar runtime
        uses: actions/checkout@v6
        with:
          repository: lost-rob0t/quasar
          ref: ${{ steps.quasar-pin.outputs.quasar }}
          path: .quasar
          submodules: recursive

      - name: Verify pinned Quasar frontend
        run: |
          test "$(git -C .quasar rev-parse HEAD)" = "${{ steps.quasar-pin.outputs.quasar }}"
          test "$(git -C .quasar/frontend rev-parse HEAD)" = "${{ steps.quasar-pin.outputs.ui }}"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .quasar/frontend/package-lock.json

      - name: Validate and build Quasar
        env:
          VITE_BASE_PATH: /quasar/app/
          VITE_AUTODIG_CORRECTION_REPO: lost-rob0t/starintel-gpt-auto-dig
          VITE_QUASAR_COMMIT: ${{ steps.quasar-pin.outputs.quasar }}
          VITE_QUASAR_UI_COMMIT: ${{ steps.quasar-pin.outputs.ui }}
          VITE_AUTODIG_VERSION: ${{ steps.quasar-pin.outputs.auto_dig }}
          VITE_STARINTEL_SCHEMA_VERSION: ${{ steps.quasar-pin.outputs.schema }}
        run: |
          npm --prefix .quasar/frontend ci
          bash .quasar/scripts/prepare-frontend.sh
          npm --prefix .quasar/frontend run check
          npm --prefix .quasar/frontend test
          npm --prefix .quasar/frontend run build

      - name: Validate StarIntel corpus before native build
        run: |
          python3 scripts/validate-for-merge.py
          echo "STARINTEL_CORPUS_VALIDATED=1" >> "$GITHUB_ENV"

      - name: Generate research explorer once
        run: |
          python3 scripts/build_research_site.py \
            --input digs \
            --db db \
            --output _site \
            --org-output .generated/org

      - name: Install Quasar graph editor
        run: |
          python3 scripts/build-auto-dig-quasar.py \
            --auto-dig-root . \
            --site-dir _site \
            --quasar-dist .quasar/frontend/dist \
            --quasar-commit "${{ steps.quasar-pin.outputs.quasar }}" \
            --quasar-ui-commit "${{ steps.quasar-pin.outputs.ui }}" \
            --auto-dig-version "${{ steps.quasar-pin.outputs.auto_dig }}" \
            --starintel-schema-version "${{ steps.quasar-pin.outputs.schema }}"

      - name: Validate publish artifacts and evidence seal
        run: |
          test -s _site/index.html
          test -s _site/search-index.json
          test -s _site/downloads/starintel-complete-corpus.jsonl
          test -s _site/downloads/starintel-complete-corpus.manifest.json
          test -s _site/downloads/starintel-evidence-seal.json
          test -s _site/evidence-seal.html
          test -s _site/quasar/app/index.html
          test -s _site/quasar/version.json
          python3 scripts/evidence-seal.py verify \
            _site/downloads/starintel-complete-corpus.jsonl \
            _site/downloads/starintel-evidence-seal.json
          grep -q 'data-evidence-seal' _site/index.html
          grep -q 'evidence-seal.html' _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
