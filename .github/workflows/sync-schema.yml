name: Consume the StarLang generated release
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify immutable upstream release bytes
        run: python3 scripts/sync-starintel-schema.py
      - name: Install the pinned runtime
        run: python3 -m pip install "git+https://github.com/lost-rob0t/starintel-doc.git@$(jq -r .python_commit schema/starintel-runtime.lock.json)" fastapi httpx
      - name: Checkout the pinned Nim runtime
        uses: actions/checkout@v6
        with:
          repository: lost-rob0t/starintel-doc.nim
          ref: 827f2c072e9893561a1925c47f898458bafd6759
          path: .starintel-doc-nim
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.4"
      - name: Build the actual canonical storage validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpcre3
          mkdir -p bin
          nim c -d:release --path:scripts --path:.starintel-doc-nim/src --out:bin/starintel-validate scripts/starintel_validate.nim
      - name: Verify shared runtime authority and actual wire boundaries
        run: |
          python3 scripts/schema-release.py check
          python3 -m unittest tests.test_starlang_consumer backend.tests.test_app -v
