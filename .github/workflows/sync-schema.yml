name: Verify Star-Lang snapshot

on:
  pull_request:
    paths:
      - "schema/starintel-schema.lock.json"
      - "schema/star-lang/**"
      - "scripts/check-starintel-schema-lock.py"
      - "scripts/sync-starintel-authority.py"
      - ".github/workflows/sync-schema.yml"
  push:
    branches:
      - main
    paths:
      - "schema/starintel-schema.lock.json"
      - "schema/star-lang/**"
      - "scripts/check-starintel-schema-lock.py"
      - "scripts/sync-starintel-authority.py"
      - ".github/workflows/sync-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify the pinned Star-Lang snapshot
        run: python3 scripts/check-starintel-schema-lock.py
      - name: Verify read-only release resolution
        run: python3 scripts/schema-release.py check
