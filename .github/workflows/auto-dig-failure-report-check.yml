name: Auto-Dig failure report check

on:
  pull_request:
    paths:
      - agents/auto_dig_failure_report.py
      - agents/test_auto_dig_failure_report.py
      - .github/workflows/auto-dig-prolog-failure-report.yml
      - .github/workflows/auto-dig-failure-report-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Run secret-redaction regression tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=agents python3 agents/test_auto_dig_failure_report.py

      - name: Compile failure reporter
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            agents/auto_dig_failure_report.py \
            agents/test_auto_dig_failure_report.py
