name: Generate DNC membership roster

on:
  workflow_dispatch:
  push:
    branches:
      - agent/dnc-fec-project-veritas-seed
    paths:
      - scripts/import_dnc_membership_roster.py
      - .github/workflows/dnc-membership-roster.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/import_dnc_membership_roster.py
      - .github/workflows/dnc-membership-roster.yml

permissions:
  contents: write

concurrency:
  group: dnc-bulk-generation-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.ref == 'agent/dnc-fec-project-veritas-seed')
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate historical membership corpus
        run: python3 scripts/import_dnc_membership_roster.py

      - name: Validate complete repository
        run: python3 scripts/validate-for-merge.py --site

      - name: Commit generated packet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add digs/dnc/2026-07-31-membership-roster-2025
          if git diff --cached --quiet; then
            echo 'Generated packet is unchanged.'
            exit 0
          fi
          git commit -m 'Add January 2025 DNC membership roster corpus [skip ci]'
          git push origin HEAD:${TARGET_BRANCH}
