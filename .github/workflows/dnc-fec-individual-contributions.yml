name: Generate DNC FEC people and employment

on:
  workflow_dispatch:
  push:
    branches:
      - agent/dnc-fec-project-veritas-seed
    paths:
      - scripts/import_dnc_fec_individual_contributions.py
      - .github/workflows/dnc-fec-individual-contributions.yml

permissions:
  contents: write

concurrency:
  group: dnc-fec-individual-contributions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: .
      TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate official FEC contributor and employment corpus
        run: python3 scripts/import_dnc_fec_individual_contributions.py

      - name: Validate complete repository
        run: python3 scripts/validate-for-merge.py --site

      - name: Commit generated packet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add digs/dnc/2026-07-31-fec-individual-contributions-2026
          if git diff --cached --quiet; then
            echo 'Generated packet is unchanged.'
            exit 0
          fi
          git commit -m 'Add DNC FEC people employment and contribution corpus [skip ci]'
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin HEAD:${TARGET_BRANCH}
