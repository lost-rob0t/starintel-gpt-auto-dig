name: StarIntel authority and binding pins

on:
  pull_request:
    paths:
      - "schema/**"
      - "conformance/implementations.json"
      - "scripts/check-starintel-schema-lock.py"
      - ".github/workflows/conformance.yml"
  push:
    branches:
      - main
    paths:
      - "schema/**"
      - "conformance/implementations.json"
      - "scripts/check-starintel-schema-lock.py"
      - ".github/workflows/conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Auto-Dig consumer
        uses: actions/checkout@v6

      - name: Checkout Star-Lang authority
        uses: actions/checkout@v6
        with:
          repository: lost-rob0t/star-lang
          ref: 919833266723edc9bddb337d606f72ae25fb8ced
          path: implementations/star-lang

      - name: Checkout Python binding
        uses: actions/checkout@v6
        with:
          repository: lost-rob0t/starintel-doc
          ref: 2ed4593c9a0a1520019c54888bff2cbdcb17df11
          path: implementations/python

      - name: Checkout JavaScript binding
        uses: actions/checkout@v6
        with:
          repository: lost-rob0t/starintel_doc.js
          ref: b7217fe20d518994bed0679bef6886a521af7f5a
          path: implementations/js

      - name: Checkout Common Lisp binding
        uses: actions/checkout@v6
        with:
          repository: lost-rob0t/star-cl
          ref: 2ecbf77f99730e1e7423c87c40ea53f0b7afb4dd
          path: implementations/cl

      - name: Checkout Nim binding
        uses: actions/checkout@v6
        with:
          repository: lost-rob0t/starintel-doc.nim
          ref: 665aec86d554ecb804c48e22befbf608b76e5a38
          path: implementations/nim

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify authority snapshot and every binding lock
        run: >-
          python3 scripts/check-starintel-schema-lock.py
          --canonical-root implementations/star-lang
          --binding-root implementations/python
          --binding-root implementations/js
          --binding-root implementations/cl
          --binding-root implementations/nim
