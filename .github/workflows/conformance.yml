name: StarIntel conformance

on:
  pull_request:
  push:
    branches: [main, agent/research-node-spec]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

jobs:
  schema-bundle:
    if: github.ref == 'refs/heads/agent/research-node-spec' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout conformance source
        uses: actions/checkout@v6
        with:
          ref: agent/research-node-spec
          fetch-depth: 0

      - name: Fetch field expansion source
        run: git fetch origin agent/starintel-v0.9-field-expansion

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Import research-node expansion
        run: python scripts/import-research-node-expansion.py

      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/starintel-doc-v0.9.0.expansion.json schemas/starintel-doc-v0.9.0.manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add research-node schema expansion"
          git push origin HEAD:agent/research-node-spec

  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout conformance source
        uses: actions/checkout@v6

      - name: Checkout Python implementation
        uses: actions/checkout@v6
        with:
          repository: lost-rob0t/starintel-doc
          ref: 1b53ee39528e92625f1fcd4971a4193c033dd584
          path: implementations/python

      - name: Checkout JavaScript implementation
        uses: actions/checkout@v6
        with:
          repository: lost-rob0t/starintel_doc.js
          ref: b5dc62d28388b6ceb6db52e27eaa0622fda37ddb
          path: implementations/js

      - name: Checkout Common Lisp implementation
        uses: actions/checkout@v6
        with:
          repository: lost-rob0t/star-cl
          ref: 20d8b560e6fbed366f56b636448302a3e7238506
          path: implementations/cl

      - name: Checkout Nim implementation
        uses: actions/checkout@v6
        with:
          repository: lost-rob0t/starintel-doc.nim
          ref: fc08a9c8fd1eaf524baba2ac918414c0e4874ab5
          path: implementations/nim

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: implementations/js/package-lock.json

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.4"

      - name: Install system runtimes
        run: |
          sudo apt-get update
          sudo apt-get install --yes sbcl curl

      - name: Install Python and JavaScript dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema dataclasses-json ulid-py
          npm install --prefix implementations/js

      - name: Install v0.9 Common Lisp dependencies
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://beta.quicklisp.org/quicklisp.lisp --output /tmp/quicklisp.lisp
          sbcl --non-interactive \
            --load /tmp/quicklisp.lisp \
            --eval '(quicklisp-quickstart:install :path (merge-pathnames "quicklisp/" (user-homedir-pathname)))' \
            --eval '(quit)'
          cat >/tmp/install-starintel-deps.lisp <<'LISP'
          (load (merge-pathnames "quicklisp/setup.lisp" (user-homedir-pathname)))
          (ql:quickload '(:com.inuoe.jzon :cl-ppcre) :silent t)
          (quit)
          LISP
          sbcl --script /tmp/install-starintel-deps.lisp

      - name: Build Nim adapter
        run: |
          mkdir -p artifacts
          set -o pipefail
          nim c -d:release \
            --path:implementations/nim/src \
            --out:implementations/nim/starintel_conformance \
            implementations/nim/src/starintel_conformance.nim \
            2>&1 | tee artifacts/nim-build.log

      - name: Check generated schema drift
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          from starintel_doc.spec import document_schema

          Path("artifacts/generated-starintel-doc-v0.9.0.schema.json").write_text(
              json.dumps(document_schema(), ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          if ! cmp schemas/starintel-doc-v0.9.0.schema.json artifacts/generated-starintel-doc-v0.9.0.schema.json; then
            diff -u schemas/starintel-doc-v0.9.0.schema.json artifacts/generated-starintel-doc-v0.9.0.schema.json \
              > artifacts/schema-drift.diff || true
            exit 1
          fi

      - name: Run reference fixture tests
        run: |
          set -o pipefail
          python -m unittest tests.test_conformance 2>&1 | tee artifacts/reference-tests.log

      - name: Run ordered language matrix
        run: |
          set -o pipefail
          python -m conformance.runner test \
            --adapter "python=sh -c 'cd implementations/python && python -m starintel_doc.conformance_adapter'" \
            --adapter "js=node implementations/js/bin/starintel-conformance.js" \
            --adapter "cl=sbcl --script implementations/cl/bin/starintel-conformance.lisp" \
            --adapter "nim=implementations/nim/starintel_conformance" \
            2>&1 | tee artifacts/matrix.log

      - name: Export fixtures
        if: always()
        run: |
          mkdir -p artifacts
          python -m conformance.runner dump-fixtures --output artifacts/fixtures-v0.9.0.json

      - name: Upload conformance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starintel-conformance
          path: artifacts/
          if-no-files-found: error
