name: Dark Academia RAND Bilderberg expansion

on:
  push:
    branches: ["agent/dark-academia-rand-bilderberg-wave-2"]
    paths:
      - "imports/dark-academia-wave2/**"
      - "scripts/run_with_membership_url_capture.py"
      - "scripts/membership_url_candidates.py"
      - ".github/workflows/dark-academia-rand-bilderberg-wave-2.yml"
  pull_request:
    branches: [main]
    paths:
      - "imports/dark-academia-wave2/**"
      - "scripts/run_with_membership_url_capture.py"
      - "scripts/membership_url_candidates.py"
      - ".github/workflows/dark-academia-rand-bilderberg-wave-2.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: dark-academia-rand-bilderberg-wave-2
  cancel-in-progress: true

jobs:
  scrape-import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore verified wave-two scraper and targets
        shell: bash
        run: |
          set -euo pipefail
          echo "26dc09aa4077bc25f7187e1979002392da8ca183afeb0c7bb528b337560825c2  imports/dark-academia-wave2/scraper.py.gz" | sha256sum --check --strict
          echo "df8d6ecc5105d89b7e9a312e153c33a7388c730a48aef6ea0a2934a5a47057f2  imports/dark-academia-wave2/targets.json.gz" | sha256sum --check --strict
          mkdir -p scripts config reports
          gzip -dc imports/dark-academia-wave2/scraper.py.gz > scripts/scrape_dark_academia_memberships.py
          gzip -dc imports/dark-academia-wave2/targets.json.gz > config/dark-academia-targets.json
          python -m py_compile scripts/scrape_dark_academia_memberships.py scripts/run_with_membership_url_capture.py scripts/membership_url_candidates.py
          python -m json.tool config/dark-academia-targets.json >/dev/null

      - name: Normalize legacy email schema key
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/scrape_dark_academia_memberships.py")
          source = path.read_text(encoding="utf-8")
          source = source.replace('"email_type"', '"type"').replace("'email_type'", "'type'")
          path.write_text(source, encoding="utf-8")
          PY

      - name: Install public-web parsing dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Scrape RAND, Bilderberg, and expanded official rosters
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/run_with_membership_url_capture.py \
            --log reports/membership-url-observations-wave-2.jsonl \
            -- scripts/scrape_dark_academia_memberships.py --root .

      - name: Extract and filter roster-list surfaces
        if: always()
        shell: bash
        run: |
          python scripts/membership_url_candidates.py \
            --input config/dark-academia-targets.json \
            --input reports/membership-url-observations-wave-2.jsonl \
            --glob 'reports/dark-academia-membership-recursion*.json' \
            --report reports/membership-list-candidates-wave-2.raw.json
          python - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import urlsplit

          source = Path("reports/membership-list-candidates-wave-2.raw.json")
          output = Path("reports/membership-list-candidates-wave-2.json")
          report = json.loads(source.read_text())
          list_word = re.compile(r"(?:^|[-_])(members?|membership|participants?|attendees?|delegates?|experts?|fellows?|leadership|staff|team|trustees?|boards?|committees?|directory|roster)(?:$|[-_\d])", re.I)
          strong_text = re.compile(r"\b(?:people directory|member(?:ship)? (?:directory|list|roster)|participant(?:s)? (?:list|roster)|board of (?:directors|trustees)|leadership team|committee members?|council members?)\b", re.I)
          profile_roots = {"people", "experts", "members", "fellows", "staff", "team", "advisers", "advisors", "trustees", "participants"}
          def stem(value):
              return re.sub(r"\.(?:html?|php|aspx?)$", "", value.lower())
          def keep(candidate):
              parts = [stem(part) for part in urlsplit(candidate["url"]).path.split("/") if part]
              if not parts or parts == ["news"]:
                  return False
              last = parts[-1]
              if len(parts) >= 2 and parts[-2] in profile_roots and not list_word.search(last):
                  return False
              evidence = " ".join(str(candidate.get(key) or "") for key in ("label", "evidence"))
              return bool(list_word.search(last) or strong_text.search(evidence))
          dedup = {candidate["url"]: candidate for candidate in report.get("candidates", []) if keep(candidate)}
          result = {**report, "candidate_count": len(dedup), "candidates": list(dedup.values())}
          output.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Close superseded homepage and profile tickets
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from urllib.parse import urlsplit
          repo = os.environ["GITHUB_REPOSITORY"]
          issues = json.loads(subprocess.run([
              "gh", "issue", "list", "--repo", repo, "--state", "open",
              "--search", '"membership-list-url-sha256:" in:body', "--limit", "1000",
              "--json", "number,title,body"
          ], check=True, text=True, capture_output=True).stdout or "[]")
          profile_roots = {"people", "experts", "members", "fellows", "staff", "team", "advisers", "advisors", "trustees", "participants"}
          list_terms = profile_roots | {"leadership", "board", "boards", "committee", "committees", "directory", "membership", "roster", "attendees", "delegates"}
          for issue in issues:
              if not issue["title"].startswith("Scrape membership list:"):
                  continue
              match = re.search(r"^- \*\*URL:\*\*\s+(https?://\S+)", issue.get("body") or "", re.M)
              if not match:
                  continue
              parts = [re.sub(r"\.(?:html?|php|aspx?)$", "", p.lower()) for p in urlsplit(match.group(1)).path.split("/") if p]
              invalid = not parts or parts == ["news"] or (len(parts) >= 2 and parts[-2] in profile_roots and parts[-1] not in list_terms)
              if invalid:
                  subprocess.run([
                      "gh", "issue", "close", str(issue["number"]), "--repo", repo,
                      "--reason", "not planned",
                      "--comment", "Closed after classifier correction: this is a homepage, individual profile, or non-roster page rather than a membership-list surface."
                  ], check=True)
          PY

      - name: Create one deduplicated issue per roster-list URL
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, tempfile
          from pathlib import Path
          from urllib.parse import urlsplit
          repo = os.environ["GITHUB_REPOSITORY"]
          source = Path("reports/membership-list-candidates-wave-2.json")
          output = Path("reports/membership-list-issues-wave-2.json")
          candidates = json.loads(source.read_text()).get("candidates", []) if source.exists() else []
          if len(candidates) > 500:
              raise SystemExit(f"Refusing unexpected issue fanout of {len(candidates)} list surfaces")
          results = []
          for candidate in candidates:
              marker = f"membership-list-url-sha256:{candidate['digest']}"
              existing = json.loads(subprocess.run([
                  "gh", "issue", "list", "--repo", repo, "--state", "all",
                  "--search", f'"{marker}" in:body', "--limit", "1",
                  "--json", "number,url,state"
              ], check=True, text=True, capture_output=True).stdout or "[]")
              if existing:
                  results.append({**candidate, "status": "existing", **existing[0]})
                  continue
              org = candidate.get("organization") or urlsplit(candidate["url"]).hostname or "unknown organization"
              label = candidate.get("label") or urlsplit(candidate["url"]).path.rstrip("/").split("/")[-1] or "membership list"
              body = f"""<!-- {marker} -->
## Membership-list scraper target

- **Organization:** {org}
- **Dataset:** `{candidate.get('dataset') or 'unresolved'}`
- **URL:** {candidate['url']}
- **Page label:** {candidate.get('label') or 'unresolved'}
- **Discovered from:** `{candidate.get('discovered_from') or 'unknown'}`

## Required parser work

- [ ] Verify this official public roster-list surface.
- [ ] Add or extend the organization-specific parser.
- [ ] Traverse pagination, year archives, regions, tabs, and linked roster pages.
- [ ] Preserve roles, affiliations, dates/years, regions, and source provenance.
- [ ] Record only contacts explicitly published by the organization.
- [ ] Import through the canonical StarIntel writer and validate the corpus.
- [ ] Add regression coverage for this URL.
"""
              with tempfile.NamedTemporaryFile("w", encoding="utf-8", delete=False) as handle:
                  handle.write(body)
                  body_path = handle.name
              try:
                  issue_url = subprocess.run([
                      "gh", "issue", "create", "--repo", repo,
                      "--title", f"Scrape membership list: {org} — {label}"[:240],
                      "--body-file", body_path
                  ], check=True, text=True, capture_output=True).stdout.strip()
              finally:
                  Path(body_path).unlink(missing_ok=True)
              results.append({**candidate, "status": "created", "issue_url": issue_url})
          output.write_text(json.dumps({
              "candidate_count": len(candidates),
              "created_count": sum(x["status"] == "created" for x in results),
              "existing_count": sum(x["status"] == "existing" for x in results),
              "results": results,
          }, indent=2, sort_keys=True) + "\n")
          PY

      - name: Remove bootstrap before corpus validation
        run: |
          rm -rf imports/dark-academia-wave2
          rmdir imports 2>/dev/null || true

      - name: Validate complete StarIntel corpus
        run: python scripts/starintel.py validate --root .

      - name: Commit expanded AutoDig corpus
        run: |
          set -euo pipefail
          git add -A scripts config imports digs/dark-academia reports db
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "starintel-auto-dig-bot"
          git config user.email "starintel-auto-dig-bot@users.noreply.github.com"
          git commit -m "Expand Dark Academia RAND and Bilderberg graph"
          git push origin "HEAD:${TARGET_BRANCH}"
