name: Dark Academia RAND Bilderberg expansion

on:
  push:
    branches:
      - "agent/dark-academia-rand-bilderberg-wave-2"
    paths:
      - "imports/dark-academia-wave2/**"
      - "scripts/run_with_membership_url_capture.py"
      - "scripts/membership_url_candidates.py"
      - ".github/workflows/dark-academia-rand-bilderberg-wave-2.yml"
  pull_request:
    branches:
      - main
    paths:
      - "imports/dark-academia-wave2/**"
      - "scripts/run_with_membership_url_capture.py"
      - "scripts/membership_url_candidates.py"
      - ".github/workflows/dark-academia-rand-bilderberg-wave-2.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: dark-academia-rand-bilderberg-wave-2
  cancel-in-progress: true

jobs:
  scrape-import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore verified wave-two scraper and targets
        shell: bash
        run: |
          set -euo pipefail
          echo "26dc09aa4077bc25f7187e1979002392da8ca183afeb0c7bb528b337560825c2  imports/dark-academia-wave2/scraper.py.gz" | sha256sum --check --strict
          echo "df8d6ecc5105d89b7e9a312e153c33a7388c730a48aef6ea0a2934a5a47057f2  imports/dark-academia-wave2/targets.json.gz" | sha256sum --check --strict
          mkdir -p scripts config reports
          gzip --decompress --stdout imports/dark-academia-wave2/scraper.py.gz > scripts/scrape_dark_academia_memberships.py
          gzip --decompress --stdout imports/dark-academia-wave2/targets.json.gz > config/dark-academia-targets.json
          echo "46b5100baae4323c8a1c9cd20b35ed7362f99e533cb0a71a90b4b868a5b73b78  scripts/scrape_dark_academia_memberships.py" | sha256sum --check --strict
          echo "1266126cdb1a4375c48e4f5c24b07de096e2a6d84fdf3f0a90d817b80065907c  config/dark-academia-targets.json" | sha256sum --check --strict
          chmod +x \
            scripts/scrape_dark_academia_memberships.py \
            scripts/run_with_membership_url_capture.py \
            scripts/membership_url_candidates.py

      - name: Replace undeclared legacy email field
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/scrape_dark_academia_memberships.py")
          source = path.read_text(encoding="utf-8")
          replacements = source.count('"email_type"') + source.count("'email_type'")
          if replacements == 0:
              raise SystemExit("email_type generator key was not found; refusing an unverified patch")
          source = source.replace('"email_type"', '"type"').replace("'email_type'", "'type'")
          path.write_text(source, encoding="utf-8")
          print(f"Replaced {replacements} email_type key occurrence(s) with schema field type")
          PY

      - name: Install public-web parsing dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Scrape RAND, Bilderberg, and expanded official rosters
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/run_with_membership_url_capture.py \
            --log reports/membership-url-observations-wave-2.jsonl \
            -- scripts/scrape_dark_academia_memberships.py --root .

      - name: Extract strict membership-list URL candidates
        if: always()
        run: |
          python scripts/membership_url_candidates.py \
            --input config/dark-academia-targets.json \
            --input reports/membership-url-observations-wave-2.jsonl \
            --glob 'reports/dark-academia-membership-recursion*.json' \
            --report reports/membership-list-candidates-wave-2.json

      - name: Close known homepage false positives
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for issue in {112..132} {134..138}; do
            payload="$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json state,title,body 2>/dev/null || true)"
            [ -n "$payload" ] || continue
            state="$(jq -r '.state' <<<"$payload")"
            title="$(jq -r '.title' <<<"$payload")"
            body="$(jq -r '.body' <<<"$payload")"
            if [ "$state" = "OPEN" ] \
              && [[ "$title" == "Scrape membership list:"* ]] \
              && grep -q 'membership-list-url-sha256:' <<<"$body"; then
              gh issue close "$issue" \
                --repo "$GITHUB_REPOSITORY" \
                --reason "not planned" \
                --comment "Closed after strict roster-URL classifier correction: this ticket represented a homepage or other non-roster surface."
            fi
          done

      - name: Create one deduplicated issue per membership-list URL
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          from urllib.parse import urlsplit

          source = Path("reports/membership-list-candidates-wave-2.json")
          output = Path("reports/membership-list-issues-wave-2.json")
          repository = os.environ["GITHUB_REPOSITORY"]
          candidates = json.loads(source.read_text(encoding="utf-8")).get("candidates", []) if source.exists() else []
          results = []

          for candidate in candidates:
              digest = candidate["digest"]
              marker = f"membership-list-url-sha256:{digest}"
              search = subprocess.run(
                  ["gh", "issue", "list", "--repo", repository, "--state", "all", "--search", f'"{marker}" in:body', "--limit", "1", "--json", "number,url,state"],
                  check=True,
                  text=True,
                  capture_output=True,
              )
              matches = json.loads(search.stdout or "[]")
              if matches:
                  results.append({**candidate, "status": "existing", **matches[0]})
                  continue

              organization = candidate.get("organization") or urlsplit(candidate["url"]).hostname or "unknown organization"
              label = candidate.get("label") or urlsplit(candidate["url"]).path.rstrip("/").split("/")[-1] or "membership list"
              title = f"Scrape membership list: {organization} — {label}"[:240]
              body = f"""<!-- {marker} -->
          ## Membership-list scraper target

          - **Organization:** {organization}
          - **Dataset:** `{candidate.get('dataset') or 'unresolved'}`
          - **URL:** {candidate['url']}
          - **Page label:** {candidate.get('label') or 'unresolved'}
          - **Discovered from:** `{candidate.get('discovered_from') or 'unknown'}`

          ## Required parser work

          - [ ] Verify this official public roster surface.
          - [ ] Add or extend an organization-specific parser.
          - [ ] Traverse pagination, year archives, regions, tabs, and linked roster pages.
          - [ ] Preserve roles, affiliations, dates/years, regions, and source provenance.
          - [ ] Record only contact details explicitly published by the organization.
          - [ ] Import through the canonical StarIntel writer and validate the corpus.
          - [ ] Add regression coverage for this URL.

          ```text
          {(candidate.get('evidence') or '')[:1200]}
          ```
          """
              with tempfile.NamedTemporaryFile("w", encoding="utf-8", delete=False) as handle:
                  handle.write(body)
                  body_path = handle.name
              try:
                  created = subprocess.run(
                      ["gh", "issue", "create", "--repo", repository, "--title", title, "--body-file", body_path],
                      check=True,
                      text=True,
                      capture_output=True,
                  ).stdout.strip()
              finally:
                  Path(body_path).unlink(missing_ok=True)
              results.append({**candidate, "status": "created", "url": candidate["url"], "issue_url": created})

          output.write_text(
              json.dumps(
                  {
                      "candidate_count": len(candidates),
                      "created_count": sum(item["status"] == "created" for item in results),
                      "existing_count": sum(item["status"] == "existing" for item in results),
                      "results": results,
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          print(output.read_text(encoding="utf-8"))
          PY

      - name: Remove bootstrap before corpus validation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf imports/dark-academia-wave2
          rmdir imports 2>/dev/null || true

      - name: Validate complete StarIntel corpus
        run: python scripts/starintel.py validate --root .

      - name: Commit expanded AutoDig corpus
        shell: bash
        run: |
          set -euo pipefail
          git add -A \
            scripts/scrape_dark_academia_memberships.py \
            scripts/run_with_membership_url_capture.py \
            scripts/membership_url_candidates.py \
            config/dark-academia-targets.json \
            imports \
            digs/dark-academia \
            reports/dark-academia-membership-recursion-wave-2.json \
            reports/dark-academia-membership-recursion-wave-2.md \
            reports/membership-url-observations-wave-2.jsonl \
            reports/membership-list-candidates-wave-2.json \
            reports/membership-list-issues-wave-2.json \
            db
          if git diff --cached --quiet; then
            echo "Dark Academia wave-two corpus already current"
            exit 0
          fi
          git config user.name "starintel-auto-dig-bot"
          git config user.email "starintel-auto-dig-bot@users.noreply.github.com"
          git commit -m "Expand Dark Academia RAND and Bilderberg graph"
          git push origin "HEAD:${TARGET_BRANCH}"
