name: Auto-Dig Prolog actor

on:
  workflow_dispatch:
    inputs:
      force_issue:
        description: Optional investigation-target issue number to force for this run
        required: false
        type: string
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/auto-dig-prolog-actor.yml'
      - 'agents/auto_dig_*.pl'
      - 'agents/test_auto_dig_*.pl'
      - 'scripts/apply_prolog_rlm_hotfix.py'

permissions:
  contents: write
  issues: write

concurrency:
  group: auto-dig-prolog-actor
  cancel-in-progress: false

env:
  PROLOG_RLM_REF: a89711d504e6cc6c3fac789b7f0b6b0453aea23b
  LIVE_TEST_ISSUE: '2284'

jobs:
  actor:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[auto-dig-live-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Auto-Dig
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out pinned Prolog-RLM
        uses: actions/checkout@v4
        with:
          repository: lost-rob0t/prolog-rlm
          ref: ${{ env.PROLOG_RLM_REF }}
          path: .prolog-rlm

      - name: Verify exact Prolog-RLM checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .prolog-rlm rev-parse HEAD)" = "$PROLOG_RLM_REF"

      - name: Apply pinned Prolog-RLM hotfixes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_prolog_rlm_hotfix.py .prolog-rlm

      - name: Install SWI-Prolog
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends swi-prolog-nox
          swipl --version

      - name: Gate pinned runtime and Auto-Dig harness
        shell: bash
        run: |
          set -euo pipefail
          (
            cd .prolog-rlm
            swipl -q -s test/check_runtime.pl
            swipl -q -s test/load_all.pl
            swipl -q -s bin/prolog-rlm.pl -- agent --json >/dev/null
            swipl -q -s test/rlm_cli_test.pl -g 'run_tests,halt'
            swipl -q -s test/rlm_native_tool_test.pl -g 'run_tests,halt'
          ) 2>&1 | tee "$RUNNER_TEMP/prolog-rlm-smoke.log"

          if grep -F 'Singleton variables: [Phase]' "$RUNNER_TEMP/prolog-rlm-smoke.log"; then
            echo 'Pinned Prolog-RLM still emits the Phase singleton warning.' >&2
            exit 1
          fi

          swipl \
            -q \
            -p "library=$GITHUB_WORKSPACE/.prolog-rlm/prolog" \
            -s agents/test_auto_dig_prolog_actor.pl \
            -g 'run_tests,halt' \
            2>&1 | tee "$RUNNER_TEMP/auto-dig-actor-tests.log"

          swipl \
            -q \
            -p "library=$GITHUB_WORKSPACE/.prolog-rlm/prolog" \
            -s agents/test_auto_dig_rlm_runner.pl \
            -g 'run_tests,halt' \
            2>&1 | tee "$RUNNER_TEMP/auto-dig-rlm-runner-tests.log"

          swipl \
            -q \
            -p "library=$GITHUB_WORKSPACE/.prolog-rlm/prolog" \
            -s agents/test_auto_dig_provider_retry_hotfix.pl \
            -g 'run_tests,halt' \
            2>&1 | tee "$RUNNER_TEMP/auto-dig-provider-retry-hotfix-tests.log"

          swipl \
            -q \
            -s agents/test_auto_dig_model_router.pl \
            -g 'run_tests,halt' \
            2>&1 | tee "$RUNNER_TEMP/auto-dig-model-router-tests.log"

          swipl \
            -q \
            -p "library=$GITHUB_WORKSPACE/.prolog-rlm/prolog" \
            -s agents/test_auto_dig_mcp_tools.pl \
            -g 'run_tests,halt' \
            2>&1 | tee "$RUNNER_TEMP/auto-dig-mcp-tools-tests.log"

          swipl \
            -q \
            -p "library=$GITHUB_WORKSPACE/.prolog-rlm/prolog" \
            -s agents/test_auto_dig_mcp_runner.pl \
            -g 'run_tests,halt' \
            2>&1 | tee "$RUNNER_TEMP/auto-dig-mcp-runner-tests.log"

      - name: Snapshot investigation queue
        id: queue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_ISSUE: ${{ inputs.force_issue || '' }}
        run: |
          set -euo pipefail
          python3 scripts/auto-dig-prolog-queue.py \
            --repo "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/queue.json" \
            ${FORCE_ISSUE:+--force-issue "$FORCE_ISSUE"}
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          queue = json.loads(Path(os.environ['RUNNER_TEMP'], 'queue.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"count={queue['count']}\n")
          PY

      - name: Load durable actor state
        if: steps.queue.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .auto-dig/prolog-actor
          if [[ ! -f .auto-dig/prolog-actor/state.pl ]]; then
            printf 'actor_state(last_issue(none), last_success(none)).\n' > .auto-dig/prolog-actor/state.pl
          fi

      - name: Let supervised Prolog actor select work
        if: steps.queue.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          swipl -q \
            -p "library=$GITHUB_WORKSPACE/.prolog-rlm/prolog" \
            -s agents/auto_dig_prolog_actor.pl \
            -g "auto_dig_prolog_actor:choose_from_files('$RUNNER_TEMP/queue.json','.auto-dig/prolog-actor/state.pl','$RUNNER_TEMP/decision.json','$RUNNER_TEMP/actor.trace'),halt"

      - name: Report idle actor
        if: steps.queue.outputs.count == '0'
        shell: bash
        run: echo 'No open investigation-target issues; actor is idle.'

      - name: Prepare isolated run branch and context
        if: steps.queue.outputs.count != '0'
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/auto-dig-prolog-prepare.py \
            --decision "$RUNNER_TEMP/decision.json" \
            --run-root "agent-runs/auto-dig-prolog" \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Select model route in Prolog
        if: steps.queue.outputs.count != '0'
        id: route
        shell: bash
        run: |
          set -euo pipefail
          swipl -q \
            -s agents/auto_dig_model_router.pl \
            -g "auto_dig_model_router:route_from_file('$RUNNER_TEMP/decision.json','$RUNNER_TEMP/model-route.env'),halt"
          cat "$RUNNER_TEMP/model-route.env" >> "$GITHUB_OUTPUT"

      - name: Run bounded native direct Prolog-RLM web research
        if: steps.queue.outputs.count != '0'
        id: live
        continue-on-error: true
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          AUTO_DIG_MODEL: ${{ steps.route.outputs.model }}
          AUTO_DIG_PROVIDER: ${{ steps.route.outputs.provider }}
          AUTO_DIG_BASE_URL: ${{ steps.route.outputs.base_url }}
          AUTO_DIG_API_KEY_ENV: ${{ steps.route.outputs.api_key_env }}
          AUTO_DIG_MAX_MODEL_CALLS: ${{ steps.route.outputs.max_model_calls }}
          AUTO_DIG_MAX_TOOL_CALLS: ${{ steps.route.outputs.max_tool_calls }}
          AUTO_DIG_MAX_CONTEXT_OPS: ${{ steps.route.outputs.max_context_ops }}
          AUTO_DIG_MAX_ITERATIONS: ${{ steps.route.outputs.max_iterations }}
          AUTO_DIG_MAX_TOTAL_TOKENS: ${{ steps.route.outputs.max_total_tokens }}
          AUTO_DIG_MAX_OUTPUT_BYTES: ${{ steps.route.outputs.max_output_bytes }}
          AUTO_DIG_PLANNER_MAX_TOKENS: ${{ steps.route.outputs.planner_max_tokens }}
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          test -n "${BRAVE_API_KEY:-}"
          swipl -q \
            -p "library=$GITHUB_WORKSPACE/.prolog-rlm/prolog" \
            -s agents/auto_dig_rlm_runner.pl \
            -g "auto_dig_rlm_runner:run_from_files('${{ steps.prepare.outputs.context_file }}','${{ steps.prepare.outputs.run_dir }}'),halt"

      - name: Emit sanitized live failure report
        if: steps.queue.outputs.count != '0' && steps.live.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/auto-dig-prolog-failure-report.py \
            --run-dir "${{ steps.prepare.outputs.run_dir }}" \
            --output "${{ steps.prepare.outputs.run_dir }}/failure-report.md"

      - name: Push successful actor run branch
        if: steps.queue.outputs.count != '0' && steps.live.outcome == 'success'
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'auto-dig-prolog-actor[bot]'
          git config user.email 'auto-dig-prolog-actor@users.noreply.github.com'
          git add -- "${{ steps.prepare.outputs.run_dir }}"
          git diff --cached --quiet && {
            echo 'Actor reported success but produced no run artifact to commit.' >&2
            exit 1
          }
          git commit -m "auto-dig: Prolog actor issue #${{ steps.prepare.outputs.issue_number }}"
          git push --set-upstream origin "${{ steps.prepare.outputs.branch }}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Advance durable state only after successful push
        if: steps.queue.outputs.count != '0' && steps.live.outcome == 'success' && steps.push.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .auto-dig/prolog-actor
          printf 'actor_state(last_issue(%s), last_success(%s)).\n' \
            "${{ steps.prepare.outputs.issue_number }}" \
            "${{ steps.push.outputs.commit }}" \
            > .auto-dig/prolog-actor/state.pl

      - name: Post run receipt on investigation target
        if: steps.queue.outputs.count != '0' && steps.live.outcome == 'success' && steps.push.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/auto-dig-prolog-receipt.py \
            --repo "$GITHUB_REPOSITORY" \
            --issue "${{ steps.prepare.outputs.issue_number }}" \
            --branch "${{ steps.prepare.outputs.branch }}" \
            --commit "${{ steps.push.outputs.commit }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-dir "${{ steps.prepare.outputs.run_dir }}"

      - name: Upload actor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-dig-prolog-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/prolog-rlm-smoke.log
            ${{ runner.temp }}/auto-dig-actor-tests.log
            ${{ runner.temp }}/auto-dig-rlm-runner-tests.log
            ${{ runner.temp }}/auto-dig-provider-retry-hotfix-tests.log
            ${{ runner.temp }}/auto-dig-model-router-tests.log
            ${{ runner.temp }}/auto-dig-mcp-tools-tests.log
            ${{ runner.temp }}/auto-dig-mcp-runner-tests.log
            ${{ runner.temp }}/queue.json
            ${{ runner.temp }}/decision.json
            ${{ runner.temp }}/actor.trace
            agent-runs/auto-dig-prolog/**

      - name: Fail workflow if live research failed
        if: steps.queue.outputs.count != '0' && steps.live.outcome != 'success'
        shell: bash
        run: exit 1
