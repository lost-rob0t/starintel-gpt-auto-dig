name: Weekly InfluenceWatch import

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum profile count; 0 imports every discovered profile
        required: false
        default: "0"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: influencewatch-weekly-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      INFLUENCEWATCH_AUTHORIZED: "1"
      UPDATE_BRANCH: automation/influence-watch-db-weekly
      LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '0' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare update branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${UPDATE_BRANCH}:refs/remotes/origin/${UPDATE_BRANCH}" || true
          git switch -C "${UPDATE_BRANCH}" "${GITHUB_SHA}"

      - name: Refresh InfluenceWatch dataset
        shell: bash
        run: |
          set -euo pipefail
          RUN_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "RUN_STARTED_AT=${RUN_STARTED_AT}" >> "${GITHUB_ENV}"

          args=(
            --crawl
            --delay 1
            --output imports/influence-watch-db.jsonl
            --import-db
            --replace
          )
          if [[ -n "${LIMIT}" && "${LIMIT}" != "0" ]]; then
            args+=(--limit "${LIMIT}")
          fi

          python3 scripts/import_influencewatch.py "${args[@]}"
          python3 scripts/validate-for-merge.py --site

      - name: Commit dataset update
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A db/

          if git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git commit -m "Update InfluenceWatch dataset"
          git push --force-with-lease origin "${UPDATE_BRANCH}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Open or update dataset pull request
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf -v body '%s\n\n%s' \
            "Weekly authorized InfluenceWatch refresh started at ${RUN_STARTED_AT}." \
            "The crawler enforced one request per second, generated a per-run HA-SCRAPED identifier with openssl, imported through scripts/starintel.py, and passed the repository merge gate."
          number="$(gh pr list \
            --head "${UPDATE_BRANCH}" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "${number}" ]]; then
            gh pr edit "${number}" \
              --title "Update InfluenceWatch dataset" \
              --body "${body}"
          else
            gh pr create \
              --head "${UPDATE_BRANCH}" \
              --base main \
              --title "Update InfluenceWatch dataset" \
              --body "${body}"
          fi
