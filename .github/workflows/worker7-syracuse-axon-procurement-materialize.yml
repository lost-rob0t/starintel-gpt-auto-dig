name: Worker 7 Syracuse Axon procurement materialization

on:
  push:
    branches:
      - agent/worker7-syracuse-axon-procurement-20260915
    paths:
      - .github/workflows/worker7-syracuse-axon-procurement-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: agent/worker7-syracuse-axon-procurement-20260915
  PACKET: digs/flock/2026-09-15-request-1903-syracuse-axon-procurement-baseline/starintel-documents.jsonl
  NIM_VERSION: 2.2.4
  STARINTEL_NIM_REF: b55316bae294a146523cd2f977b81096e538c86a

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check StarIntel release authority and executable dtypes
        run: |
          python3 scripts/schema-release.py current
          python3 scripts/schema-release.py check
          python3 scripts/starintel.py types
          python3 scripts/starintel.py schema --dtype source >/dev/null
          python3 scripts/starintel.py schema --dtype analysis >/dev/null
          python3 scripts/starintel.py schema --dtype research-pass >/dev/null

      - name: Import normalized DB records through canonical batch path
        run: python3 scripts/starintel.py import "${PACKET}"

      - name: Checkout canonical StarIntel Nim runtime
        uses: actions/checkout@v6
        with:
          repository: lost-rob0t/starintel-doc.nim
          ref: ${{ env.STARINTEL_NIM_REF }}
          path: .starintel-doc-nim

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Run canonical merge and site gate
        run: |
          nimble buildFast -y
          bin/validate-for-merge --site

      - name: Commit importer-generated DB records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add db
          if git diff --cached --quiet; then
            echo 'No DB changes to materialize.'
            exit 0
          fi
          git commit -m 'Materialize Syracuse Axon procurement packet'
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin HEAD:"${TARGET_BRANCH}"
