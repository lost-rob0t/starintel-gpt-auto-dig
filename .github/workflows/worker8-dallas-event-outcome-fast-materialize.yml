# Retry after validating research-pass fields against live executable schema.
name: Worker 8 Dallas protest outcome fast materialization

on:
  push:
    branches:
      - agent/worker8-dallas-event-outcome-2576-20260915
    paths:
      - .github/workflows/worker8-dallas-event-outcome-fast-materialize.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: agent/worker8-dallas-event-outcome-2576-20260915
  PACKET: digs/dallas/2026-09-15-request-2576-dallas-event-outcome/starintel-documents.jsonl

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify release authority and import normalized DB records
        run: |
          python3 scripts/schema-release.py current
          python3 scripts/schema-release.py check
          python3 scripts/starintel.py schema --dtype source >/dev/null
          python3 scripts/starintel.py schema --dtype analysis >/dev/null
          python3 scripts/starintel.py schema --dtype research-pass >/dev/null
          python3 scripts/starintel.py import "${PACKET}"

      - name: Commit importer-generated DB records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add db
          if git diff --cached --quiet; then
            echo 'No DB changes to materialize.'
            exit 0
          fi
          git commit -m 'Materialize Dallas protest outcome packet'
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin HEAD:"${TARGET_BRANCH}"
