name: Bootstrap Repository Tree

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap-repository.yml"
  pull_request:
    branches: [main]
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap-repository.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-repository-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out writable branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Reconstruct repository archive
        shell: bash
        run: |
          set -u
          : > /tmp/bootstrap-diagnostics.txt
          find bootstrap -maxdepth 1 -type f -printf '%f %s bytes\n' | sort | tee -a /tmp/bootstrap-diagnostics.txt
          cat \
            bootstrap/archive.b64.00 \
            bootstrap/archive.b64.01 \
            bootstrap/archive.b64.02 \
            bootstrap/archive.fix.03.0 \
            bootstrap/archive.fix.03.1 \
            bootstrap/archive.fix.04.0 \
            bootstrap/archive.fix.04.1 \
            bootstrap/archive.b64.05 \
            > /tmp/starintel-repository.b64
          wc -c /tmp/starintel-repository.b64 | tee -a /tmp/bootstrap-diagnostics.txt
          base64 --decode /tmp/starintel-repository.b64 > /tmp/starintel-repository.tar.xz
          decode_status=$?
          printf 'base64_status=%s\n' "$decode_status" | tee -a /tmp/bootstrap-diagnostics.txt
          sha256sum /tmp/starintel-repository.tar.xz | tee -a /tmp/bootstrap-diagnostics.txt
          xz --test /tmp/starintel-repository.tar.xz
          xz_status=$?
          printf 'xz_status=%s\n' "$xz_status" | tee -a /tmp/bootstrap-diagnostics.txt
          exit 0

      - name: Upload bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-diagnostics
          path: |
            /tmp/bootstrap-diagnostics.txt
            /tmp/starintel-repository.tar.xz
          if-no-files-found: warn

      - name: Verify and extract repository archive
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^base64_status=0$' /tmp/bootstrap-diagnostics.txt
          grep -q '^xz_status=0$' /tmp/bootstrap-diagnostics.txt
          echo "28e1c6291deb4a51b09e8f71f62a0081a2c9968ad01659be56374f73eb71fba6  /tmp/starintel-repository.tar.xz" | sha256sum --check --strict
          tar --extract --xz --file /tmp/starintel-repository.tar.xz
          mv lisp/starintel/second-brain.el lisp/starintel/starintel-second-brain.el
          mv lisp/starintel/pages.el lisp/starintel/starintel-pages.el
          rm -rf bootstrap /tmp/starintel-repository.b64 /tmp/starintel-repository.tar.xz /tmp/bootstrap-diagnostics.txt

      - name: Validate database
        run: python3 scripts/validate-db.py

      - name: Validate browser JavaScript
        run: node --check pages/static/site.js

      - name: Install Emacs publishing dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --quiet emacs-nox sqlite3
          emacs --version | head -1

      - name: Build Org-roam publication
        shell: bash
        run: |
          set +e
          bash scripts/publish-pages > /tmp/publish-pages.log 2>&1
          publish_status=$?
          printf 'publish_status=%s\n' "$publish_status" > /tmp/publish-status.txt
          cat /tmp/publish-pages.log
          exit 0

      - name: Upload Org-roam publisher diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: org-roam-publisher-diagnostics
          path: |
            /tmp/publish-pages.log
            /tmp/publish-status.txt
          if-no-files-found: warn

      - name: Verify Org-roam publication
        shell: bash
        run: grep -q '^publish_status=0$' /tmp/publish-status.txt

      - name: Validate published links
        run: python3 scripts/check-pages-links.py _site

      - name: Commit materialized tree
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "starintel-auto-publisher"
          git config user.email "starintel-auto-publisher@users.noreply.github.com"
          git checkout HEAD -- .github/workflows
          git clean -fd -- .github/workflows
          git add -A
          if git diff --cached --quiet; then
            echo "Repository tree is already materialized"
            exit 0
          fi
          git commit -m "Publish Palantir StarIntel dataset and roam corpus"
          git push origin "HEAD:${TARGET_BRANCH}"
