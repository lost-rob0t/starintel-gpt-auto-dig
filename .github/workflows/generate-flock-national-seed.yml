name: Generate Flock national seed

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  statuses: write
  pull-requests: read

concurrency:
  group: generate-flock-national-state-locality-seed
  cancel-in-progress: false

jobs:
  generate-and-validate:
    if: github.head_ref == 'agent/flock-national-state-locality-seed' || github.ref_name == 'agent/flock-national-state-locality-seed'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: agent/flock-national-state-locality-seed
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: agent/flock-national-state-locality-seed
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make generator directly executable from scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/generate-flock-national-seed.py")
          source = path.read_text(encoding="utf-8")
          if "import sys\n" not in source:
              source = source.replace("import re\n", "import re\nimport sys\n", 1)
          marker = "from starintel_doc.validation import validate_document"
          bootstrap = "sys.path.insert(0, str(Path(__file__).resolve().parents[1]))\n\n" + marker
          if bootstrap not in source:
              source = source.replace(marker, bootstrap, 1)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Generate packet
        id: generate
        shell: bash
        run: |
          set +e
          python3 scripts/generate-flock-national-seed.py > /tmp/flock-generator.log 2>&1
          STATUS=$?
          cat /tmp/flock-generator.log
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit exact generator diagnostic
        if: steps.generate.outputs.status != '0'
        run: |
          mkdir -p digs/flock-safety/2026-07-25-national-state-locality-seed
          cp /tmp/flock-generator.log digs/flock-safety/2026-07-25-national-state-locality-seed/generator-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]]@users.noreply.github.com"
          git add scripts/generate-flock-national-seed.py \
            digs/flock-safety/2026-07-25-national-state-locality-seed/generator-failure.log
          git commit -m "Capture Flock generator failure"
          git push origin HEAD:"$BRANCH"
          exit 1

      - name: Run mandatory merge gate before commit
        if: steps.generate.outputs.status == '0'
        run: python3 scripts/validate-for-merge.py --site

      - name: Commit generated packet and remove one-shot workflow
        if: steps.generate.outputs.status == '0'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f digs/flock-safety/2026-07-25-national-state-locality-seed/generator-failure.log
          rm .github/workflows/generate-flock-national-seed.yml
          git add scripts/generate-flock-national-seed.py \
            digs/flock-safety/2026-07-25-national-state-locality-seed \
            .github/workflows/generate-flock-national-seed.yml
          git commit -m "Seed Flock national state locality research"
          git push origin HEAD:"$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch canonical validator on generated head
        if: steps.generate.outputs.status == '0'
        id: dispatch
        run: |
          SHA="${{ steps.commit.outputs.sha }}"
          gh api --method POST "repos/$REPOSITORY/statuses/$SHA" \
            -f state=pending \
            -f context='StarIntel merge gate' \
            -f description='Canonical validation dispatched'
          gh workflow run validate-db.yml --ref "$BRANCH"
          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID=$(gh run list \
              --workflow validate-db.yml \
              --branch "$BRANCH" \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" \
              | head -n1)
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$RUN_ID" ]; then
            gh api --method POST "repos/$REPOSITORY/statuses/$SHA" \
              -f state=error \
              -f context='StarIntel merge gate' \
              -f description='Validator run was not located'
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Require validation on generated head
        if: steps.generate.outputs.status == '0'
        run: |
          SHA="${{ steps.commit.outputs.sha }}"
          RUN_ID="${{ steps.dispatch.outputs.run_id }}"
          if gh run watch "$RUN_ID" --exit-status; then
            gh api --method POST "repos/$REPOSITORY/statuses/$SHA" \
              -f state=success \
              -f context='StarIntel merge gate' \
              -f description='Canonical validation passed'
          else
            gh api --method POST "repos/$REPOSITORY/statuses/$SHA" \
              -f state=failure \
              -f context='StarIntel merge gate' \
              -f description='Canonical validation failed'
            exit 1
          fi
