name: Use canonical StarIntel schema origin

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/use-canonical-schema-origin.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace fake schema origin
        shell: bash
        run: |
          set -euo pipefail
          old='https://starintel.dev/schema/starintel-doc-v0.9.0.json'
          new='https://spec.starintel.actor/schema/starintel-doc-v0.9.0.json'
          mapfile -d '' files < <(grep -RIlZ --exclude-dir=.git -- "$old" .)
          ((${#files[@]} > 0)) || {
            echo "No matching schema references found"
            exit 1
          }
          for file in "${files[@]}"; do
            sed -i "s#${old}#${new}#g" "$file"
          done
          git rm .github/workflows/use-canonical-schema-origin.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "${files[@]}"
          git commit -m 'Use canonical StarIntel schema origin'
          git push origin HEAD:main
