name: Import current Global Shapers API

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/import_global_shapers_members_api.py"
      - ".github/workflows/import-global-shapers-current-api.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-global-shapers-current-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install API importer dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Import complete current public roster
        run: |
          python scripts/import_global_shapers_members_api.py \
            --root . \
            --minimum-people 4600 \
            --max-pages 100 \
            --timeout 90

      - name: Verify exact current roster invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/global-shapers-current-api.json").read_text(encoding="utf-8"))
          assert report["status"] == "complete", report
          assert report["people"] >= 4600, report["people"]
          assert report["packet"]["counts_by_dtype"]["person"] == report["people"]
          assert report["page_count_with_data"] >= 20
          assert report["pages"][-1]["rows"] == 0
          if report["expected_live_member_count"] is not None:
              assert report["people"] == report["expected_live_member_count"], (
                  report["people"], report["expected_live_member_count"]
              )
          print(json.dumps({
              "raw_rows": report["raw_rows"],
              "unique_people": report["people"],
              "duplicate_rows_removed": report["identity"]["duplicate_rows_removed"],
              "hubs": report["identity"]["hubs"],
              "statuses": report["identity"]["status_counts"],
              "identity_kinds": report["identity"]["identity_kinds"],
              "documents": report["packet"]["documents"],
          }, indent=2))
          PY
          python scripts/starintel.py validate --root .

      - name: Commit verified current roster packet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            digs/global-shapers/global-shapers-current-members-api \
            imports/global-shapers/generated-hub-urls.txt \
            imports/global-shapers/generated-current-profile-seeds.jsonl \
            reports/global-shapers-current-api.json \
            reports/global-shapers-current-api.md
          if ! git diff --cached --quiet; then
            count=$(python -c 'import json; print(json.load(open("reports/global-shapers-current-api.json"))["people"])')
            git commit -m "Import ${count} current Global Shapers profiles"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Upload API import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-shapers-current-api
          path: |
            reports/global-shapers-current-api.json
            reports/global-shapers-current-api.md
            imports/global-shapers/generated-current-profile-seeds.jsonl
          if-no-files-found: warn
          retention-days: 14
