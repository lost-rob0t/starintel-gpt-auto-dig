name: Validate StarIntel v0.9 schema bundle

on:
  push:
    branches:
      - "agent/starintel-v0.9-field-expansion"
    paths:
      - "starintel_doc/**"
      - "schemas/starintel-doc-v0.9.0.*.json"
      - "tests/test_v09_expansion.py"
      - "scripts/validate-for-merge.py"
      - ".github/workflows/sync-v09-schema.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate-for-merge.py --skip-git-diff-check
      - name: Materialize expanded schema as an artifact
        run: python -m starintel_doc schema --output /tmp/starintel-doc-v0.9.0.expanded.schema.json
      - uses: actions/upload-artifact@v4
        with:
          name: starintel-doc-v0.9.0-expanded-schema
          path: /tmp/starintel-doc-v0.9.0.expanded.schema.json
