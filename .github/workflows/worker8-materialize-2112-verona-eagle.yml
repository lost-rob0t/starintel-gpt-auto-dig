name: Worker 8 materialize request 2112 Verona Eagle offboarding

on:
  push:
    branches:
      - agent/worker8-flock-2112-verona-eagle-20260915
    paths:
      - digs/flock/2026-09-15-request-2112-verona-eagle-offboarding/starintel-documents.jsonl
      - .github/workflows/worker8-materialize-2112-verona-eagle.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import packet through canonical writer
        run: python3 scripts/starintel.py import digs/flock/2026-09-15-request-2112-verona-eagle-offboarding/starintel-documents.jsonl

      - name: Validate complete StarIntel corpus
        run: python3 scripts/starintel.py validate --root .

      - name: Commit importer-generated DB records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/
          if git diff --cached --quiet; then
            echo "No importer-generated DB changes"
            exit 0
          fi
          git commit -m "Materialize #2112 Verona and Eagle offboarding records"
          git push origin HEAD:${GITHUB_REF_NAME}
