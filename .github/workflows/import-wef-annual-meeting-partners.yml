name: Verify imported WEF Annual Meeting partners

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate imported corpus
        run: |
          python3 scripts/import_wef_annual_meeting_partners.py --root . --verify-only
          python3 scripts/starintel.py validate --root .
