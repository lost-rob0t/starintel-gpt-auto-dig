name: Dark Academia institutions and foundations expansion

on:
  push:
    branches: ["agent/dark-academia-institutions-foundations-wave-3"]
    paths:
      - "imports/dark-academia-wave3/**"
      - ".github/workflows/dark-academia-institutions-foundations-wave-3.yml"
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - "imports/dark-academia-wave3/**"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: dark-academia-institutions-foundations-wave-3
  cancel-in-progress: true

jobs:
  scrape-import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Load membership-list guard from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          for path in \
            scripts/run_with_membership_url_capture.py \
            scripts/membership_list_surface_candidates.py \
            scripts/sync_membership_list_issues.py; do
            mkdir -p "$(dirname "$path")"
            git show "origin/main:${path}" > "$path"
            chmod +x "$path"
          done

      - name: Cancel stale fan-out and drain invalid tickets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/sync_membership_list_issues.py \
            --repository "$GITHUB_REPOSITORY" \
            --cleanup-only \
            --report reports/membership-list-cleanup-wave-3.json

      - name: Restore wave-three scraper and targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts config reports
          cat imports/dark-academia-wave3/scraper-* | tr -d '\r\n ' | base64 --decode > /tmp/wave3-scraper.py.gz
          cat imports/dark-academia-wave3/targets-* | tr -d '\r\n ' | base64 --decode > /tmp/wave3-targets.json.gz
          gzip --test /tmp/wave3-scraper.py.gz
          gzip --test /tmp/wave3-targets.json.gz
          gzip -dc /tmp/wave3-scraper.py.gz > scripts/scrape_dark_academia_memberships.py
          gzip -dc /tmp/wave3-targets.json.gz > config/dark-academia-targets.json
          python -m py_compile scripts/scrape_dark_academia_memberships.py
          python -m json.tool config/dark-academia-targets.json >/dev/null

      - name: Normalize legacy email schema key
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/scrape_dark_academia_memberships.py")
          source = path.read_text(encoding="utf-8")
          path.write_text(
              source.replace('"email_type"', '"type"').replace("'email_type'", "'type'"),
              encoding="utf-8",
          )
          PY

      - name: Harden public-person name classifier
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/scrape_dark_academia_memberships.py")
          source = path.read_text(encoding="utf-8")
          old = '''    def looks_like_name(self, value: str) -> bool:
        value = self.clean_text(value)
        if not 3 <= len(value) <= 100 or value.lower() in NAME_STOPWORDS:
            return False
        if any(ch in value for ch in "{}[]<>@") or re.search(r"https?://", value):
            return False
        words = [w for w in re.split(r"\\s+", value) if w]
        if not 2 <= len(words) <= 8:
            return False
        alpha = sum(ch.isalpha() for ch in value)
        return alpha >= max(3, int(len(value) * 0.55))
'''
          new = '''    def looks_like_name(self, value: str) -> bool:
        value = self.clean_text(value)
        if not 3 <= len(value) <= 100 or value.lower() in NAME_STOPWORDS:
            return False
        if any(ch in value for ch in "{}[]<>@") or re.search(r"https?://", value):
            return False
        words = [w for w in re.split(r"\\s+", value) if w]
        if not 2 <= len(words) <= 8:
            return False
        alpha = sum(ch.isalpha() for ch in value)
        if alpha < max(3, int(len(value) * 0.55)):
            return False

        # High-precision public-person extraction: generic page headings, topic labels,
        # program names, navigation text, and geographic surfaces are evidence of a
        # page, not evidence of a human identity. False negatives remain coverage gaps;
        # false person identities would poison the canonical graph.
        non_person_terms = {
            "about", "action", "affairs", "agreement", "agreements", "announcements",
            "artificial", "background", "board", "california", "careers", "center",
            "climate", "coalition", "committee", "communications", "conflict", "council",
            "development", "directors", "division", "donor", "donors", "economics",
            "education", "energy", "environment", "events", "executives", "explore",
            "fellows", "financial", "foundation", "global", "governance", "health",
            "history", "impact", "industry", "initiative", "institute", "institution",
            "institutional", "intelligence", "international", "jobs", "leadership",
            "media", "member", "members", "membership", "museum", "national", "network",
            "news", "nuclear", "office", "operations", "people", "policy", "press",
            "privacy", "profile", "profiles", "program", "project", "regional", "releases",
            "research", "researchers", "security", "services", "society", "staff",
            "statements", "strategy", "support", "sustainability", "team", "technology",
            "terms", "terrorism", "topic", "topics", "trustees", "university", "volunteers",
            "war", "weapons", "website", "what", "who", "you",
        }
        name_particles = {
            "al", "bin", "binti", "da", "das", "de", "del", "della", "den", "der",
            "di", "dos", "du", "el", "la", "le", "st", "van", "von",
        }
        suffixes = {"ii", "iii", "iv", "jr", "sr"}
        normalized = [re.sub(r"[^a-z]+", "", word.lower()) for word in words]
        if any(term in non_person_terms for term in normalized):
            return False

        name_like = 0
        for word, token in zip(words, normalized):
            if not token:
                continue
            if token in name_particles or token in suffixes:
                continue
            bare = word.strip(".,()[]{}")
            if len(token) == 1 and bare[:1].isalpha():
                name_like += 1
                continue
            if bare[:1].isupper() or bare.isupper():
                name_like += 1
                continue
            return False
        return name_like >= 2
'''
          if source.count(old) != 1:
              raise SystemExit(f"expected one looks_like_name implementation, found {source.count(old)}")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY

      - name: Install public-web parsing dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Verify public-person classifier regressions
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("scripts/scrape_dark_academia_memberships.py")
          spec = importlib.util.spec_from_file_location("wave3_scraper", path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          scraper = module.Scraper({}, Path("."))

          false_people = [
              "Afghanistan war",
              "Board of Trustees",
              "Explore fellows",
              "Artificial Intelligence",
              "Climate Change Policy",
              "Global Health",
              "Research Teams",
              "Our History",
              "News and Announcements",
          ]
          real_people = [
              "Bruce Schneier",
              "H. R. McMaster",
              "Niall Ferguson",
              "José María de la Torre",
              "Jean-Pierre Dupont",
              "Abdul Rahman al-Sayed",
          ]
          bad = [value for value in false_people if scraper.looks_like_name(value)]
          missed = [value for value in real_people if not scraper.looks_like_name(value)]
          if bad or missed:
              raise SystemExit(f"person classifier regression: false_people={bad!r} missed_people={missed!r}")
          print(f"person classifier guard OK: rejected={len(false_people)} accepted={len(real_people)}")
          PY

      - name: Scrape institutional and foundation rosters
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/run_with_membership_url_capture.py \
            --log reports/membership-url-observations-wave-3.jsonl \
            -- scripts/scrape_dark_academia_memberships.py --root .

      - name: Verify generated public-person semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          packet = Path("digs/dark-academia/dark-academia-membership-recursion-wave-3-2026-07-31/starintel-documents.jsonl")
          if not packet.is_file():
              raise SystemExit(f"canonical packet missing: {packet}")
          known_false_people = {
              "afghanistan war",
              "board of trustees",
              "explore fellows",
              "artificial intelligence",
              "climate change policy",
              "global health",
              "research teams",
              "our history",
              "news and announcements",
          }
          offenders = []
          people = 0
          for line in packet.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              doc = json.loads(line)
              if doc.get("dtype") != "person":
                  continue
              people += 1
              data = doc.get("data") if isinstance(doc.get("data"), dict) else {}
              name = str(data.get("name") or data.get("full_name") or doc.get("title") or "").strip().lower()
              if name in known_false_people:
                  offenders.append(doc.get("_id"))
          if offenders:
              raise SystemExit(f"non-person page labels survived canonical generation: {offenders[:20]!r}")
          print(f"generated public-person semantic guard OK: people={people}")
          PY

      - name: Extract strict roster-list surfaces
        if: always()
        run: |
          python scripts/membership_list_surface_candidates.py \
            --input config/dark-academia-targets.json \
            --input reports/membership-url-observations-wave-3.jsonl \
            --glob 'reports/dark-academia-membership-recursion*.json' \
            --report reports/membership-list-candidates-wave-3.json

      - name: Reject query-addressed profile details
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import parse_qsl, urlsplit

          path = Path("reports/membership-list-candidates-wave-3.json")
          value = json.loads(path.read_text(encoding="utf-8"))
          candidates = value.get("candidates", [])
          if not isinstance(candidates, list):
              raise SystemExit("candidate report has no candidates list")

          profile_query_roots = {
              "people", "experts", "members", "fellows", "staff", "team",
              "advisers", "advisors", "trustees", "participants", "profiles",
              "profile", "bios", "bio", "biographies", "biography",
          }
          kept = []
          rejected = []
          for item in candidates:
              if not isinstance(item, dict):
                  kept.append(item)
                  continue
              url = str(item.get("url") or "")
              parts = urlsplit(url)
              segments = [segment.lower() for segment in parts.path.split("/") if segment]
              query_keys = {key.lower() for key, _ in parse_qsl(parts.query, keep_blank_values=True)}
              if segments and segments[-1] in profile_query_roots and "id" in query_keys:
                  rejected.append(url)
                  continue
              kept.append(item)

          value["candidates"] = kept
          value["candidate_count"] = len(kept)
          value["rejected_profile_query_count"] = len(rejected)
          value["rejected_profile_query_examples"] = rejected[:20]
          path.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({
              "before": len(candidates),
              "rejected_profile_query_count": len(rejected),
              "after": len(kept),
              "examples": rejected[:10],
          }, indent=2))
          if len(kept) > 500:
              raise SystemExit(f"candidate fan-out still exceeds safety ceiling after profile filtering: {len(kept)}")
          PY

      - name: Diagnose roster-list candidate fan-out
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("reports/membership-list-candidates-wave-3.json")
          if not path.is_file():
              raise SystemExit("candidate report missing")
          value = json.loads(path.read_text(encoding="utf-8"))
          candidates = value.get("candidates", [])
          if not isinstance(candidates, list):
              raise SystemExit("candidate report has no candidates list")
          print(json.dumps({
              "candidate_count": len(candidates),
              "rejected_profile_query_count": value.get("rejected_profile_query_count", 0),
              "first_urls": [item.get("url") for item in candidates[:10] if isinstance(item, dict)],
          }, indent=2))
          PY

      - name: Synchronize roster-list issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/sync_membership_list_issues.py \
            --repository "$GITHUB_REPOSITORY" \
            --cleanup \
            --candidates reports/membership-list-candidates-wave-3.json \
            --report reports/membership-list-issues-wave-3.json

      - name: Preserve issue-sync diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dark-academia-wave3-issue-sync-diagnostics
          path: |
            reports/membership-list-candidates-wave-3.json
            reports/membership-list-issues-wave-3.json
            reports/membership-list-cleanup-wave-3.json
            reports/membership-url-observations-wave-3.jsonl
          if-no-files-found: warn
          retention-days: 7

      - name: Remove bootstrap before corpus validation
        run: |
          rm -rf imports/dark-academia-wave3
          rmdir imports 2>/dev/null || true

      - name: Validate complete StarIntel corpus
        run: python scripts/starintel.py validate --root .

      - name: Commit expanded AutoDig corpus
        shell: bash
        run: |
          set -euo pipefail
          git add -A scripts config imports digs/dark-academia reports db
          if git diff --cached --quiet; then
            echo "Wave-three corpus already current"
            exit 0
          fi
          git config user.name "starintel-auto-dig-bot"
          git config user.email "starintel-auto-dig-bot@users.noreply.github.com"
          git commit -m "Expand Dark Academia institutions and foundations graph"
          git push origin "HEAD:${TARGET_BRANCH}"
