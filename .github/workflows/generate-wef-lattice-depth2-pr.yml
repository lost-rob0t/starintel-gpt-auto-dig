name: Generate WEF Lattice depth-2 records

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Assemble source records
        shell: bash
        run: |
          cat .github/wef-payload-depth2/part-* > /tmp/records.jsonl.gz.b64
          test "$(sha256sum /tmp/records.jsonl.gz.b64 | cut -d' ' -f1)" = "8917e59b554a1c42281a8f03f0bbae274b426f868c5f8c81f3517d43964f978f"
          base64 -d /tmp/records.jsonl.gz.b64 | gzip -d > /tmp/records.jsonl
          test "$(wc -l < /tmp/records.jsonl)" -eq 23
      - name: Import through canonical writer
        run: python3 scripts/starintel.py import /tmp/records.jsonl
      - name: Run mandatory merge gate
        run: python3 scripts/validate-for-merge.py --site
      - name: Commit generated database records
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db
          if git diff --cached --quiet; then
            echo "No generated DB changes"
            exit 0
          fi
          git commit -m "data: recurse Lattice AMI WEF investigation to depth 2"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
