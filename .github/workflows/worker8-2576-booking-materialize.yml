name: Worker 8 #2576 booking materialize

on:
  push:
    branches:
      - agent/worker8-dallas-booking-charges-20260915

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[worker8-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/worker8-dallas-booking-charges-20260915
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inspect executable StarIntel schema
        run: |
          python3 scripts/schema-release.py current
          python3 scripts/schema-release.py check
          python3 scripts/starintel.py types
          python3 scripts/starintel.py schema --dtype source >/tmp/source-schema.json
          python3 scripts/starintel.py schema --dtype analysis >/tmp/analysis-schema.json
          python3 scripts/starintel.py schema --dtype research-pass >/tmp/research-pass-schema.json

      - name: Materialize through canonical importer
        run: |
          python3 scripts/starintel.py import digs/dallas/2026-09-15-request-2576-booking-charge-followup/starintel-documents.jsonl

      - name: Commit normalized records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add db/
          if git diff --cached --quiet; then
            echo 'No normalized DB changes to commit.'
          else
            git commit -m 'Materialize #2576 booking-charge follow-up [worker8-materialized]'
            git push origin HEAD:agent/worker8-dallas-booking-charges-20260915
          fi
