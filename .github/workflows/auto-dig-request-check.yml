name: Auto-Dig request queue checks

on:
  push:
    branches-ignore:
      - main
    paths:
      - scripts/auto_dig_request.py
      - tests/test_auto_dig_request.py
      - .github/ISSUE_TEMPLATE/auto-dig-request.yml
      - .github/workflows/auto-dig-request.yml
      - .github/workflows/auto-dig-request-check.yml
      - docs/auto-dig-requests.md
  pull_request:
    paths:
      - scripts/auto_dig_request.py
      - tests/test_auto_dig_request.py
      - .github/ISSUE_TEMPLATE/auto-dig-request.yml
      - .github/workflows/auto-dig-request.yml
      - .github/workflows/auto-dig-request-check.yml
      - docs/auto-dig-requests.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-dig-request-queue-${{ github.ref }}
  cancel-in-progress: true

env:
  NIM_VERSION: 2.2.4
  STARINTEL_NIM_REF: 827f2c072e9893561a1925c47f898458bafd6759

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Checkout canonical StarIntel Nim runtime
        uses: actions/checkout@v4
        with:
          repository: lost-rob0t/starintel-doc.nim
          ref: ${{ env.STARINTEL_NIM_REF }}
          path: .starintel-doc-nim

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the pinned canonical Python runtime and PCRE
        run: |
          python3 -m pip install "git+https://github.com/lost-rob0t/starintel-doc.git@$(jq -r .python_commit schema/starintel-runtime.lock.json)"
          sudo apt-get update
          sudo apt-get install --yes libpcre3

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}

      - name: Compile request helper
        run: python3 -m py_compile scripts/auto_dig_request.py tests/test_auto_dig_request.py

      - name: Run request queue tests
        run: python3 -m unittest tests.test_auto_dig_request -v

      - name: Build fast validator and site tools
        run: nimble buildFast

      - name: Run canonical merge gate
        run: bin/validate-for-merge --site
