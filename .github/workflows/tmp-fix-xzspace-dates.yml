name: TEMP normalize xzspace dates

on:
  push:
    branches:
      - replay/2401-xzspace-current-main
    paths:
      - ".github/workflows/tmp-fix-xzspace-dates.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: replay/2401-xzspace-current-main
          fetch-depth: 0
      - name: Normalize current-schema timestamps and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("digs/xzspace-starintel/2026-09-08-attribution/starintel-documents.jsonl")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(r'("(?:published_at|founded_at)":")([0-9]{4}-[0-9]{2}-[0-9]{2})(")')
          updated, count = pattern.subn(r'\1\2T00:00:00Z\3', text)
          if count == 0:
              raise SystemExit("no date-only published_at/founded_at values found")
          path.write_text(updated, encoding="utf-8")
          print(f"normalized {count} date-only timestamps")
          PY
          rm .github/workflows/tmp-fix-xzspace-dates.yml
          git config user.name "starintel-ci"
          git config user.email "starintel-ci@users.noreply.github.com"
          git add digs/xzspace-starintel/2026-09-08-attribution/starintel-documents.jsonl
          git add -u .github/workflows/tmp-fix-xzspace-dates.yml
          git diff --cached --check
          git commit -m "fix: normalize xzspace dates for current schema"
          git push origin HEAD:replay/2401-xzspace-current-main
