name: Temporary PR 78 takeover runner

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: read

jobs:
  repair:
    if: github.event.pull_request.number == 1956
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/pr-78-takeover-fix
          fetch-depth: 0

      - name: Diagnose compact Shapers transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import lzma
          import string
          from pathlib import Path

          directory = Path('imports/.wef-shapers-compact')
          encoded = ''.join(
              ''.join(path.read_text(encoding='utf-8').lstrip('\ufeff').split())
              for path in sorted(directory.glob('part-*'))
          )
          print('original_chars', len(encoded))
          encoded = encoded[:151_980] + '1' + encoded[151_980:]
          print('inserted_chars', len(encoded))
          alphabet = string.ascii_uppercase + string.ascii_lowercase + string.digits + '+/'

          def progress(compressed: bytes, chunk_size: int = 256) -> tuple[int, bool, int]:
              decoder = lzma.LZMADecompressor()
              offset = 0
              output = 0
              while offset < len(compressed):
                  chunk = compressed[offset:offset + chunk_size]
                  try:
                      data = decoder.decompress(chunk)
                  except lzma.LZMAError:
                      return offset, False, output
                  output += len(data)
                  offset += len(chunk)
                  if decoder.eof:
                      return len(compressed), True, output
              return offset, decoder.eof, output

          candidates = []
          for position in range(160_350, 160_650):
              original = encoded[position]
              for character in alphabet:
                  if character == original:
                      continue
                  candidate = encoded[:position] + character + encoded[position + 1:]
                  try:
                      compressed = base64.b64decode(candidate, validate=True)
                  except Exception:
                      continue
                  consumed, eof, output = progress(compressed)
                  candidates.append((consumed, eof, output, position, original, character))
          candidates.sort(reverse=True)
          print('TOP_CANDIDATES')
          for item in candidates[:40]:
              print(item)

          for consumed, eof, output, position, original, character in candidates[:40]:
              if not eof:
                  continue
              repaired = encoded[:position] + character + encoded[position + 1:]
              compressed = base64.b64decode(repaired, validate=True)
              payload = lzma.decompress(compressed)
              print('SUCCESS', position, original, character, len(payload), payload[:80])
              Path('/tmp/repaired-layer.bin').write_bytes(payload)
              break
          PY
