name: Temporary PR 78 takeover runner

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: read

jobs:
  inspect-history:
    if: github.event.pull_request.number == 1956
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/pr-78-takeover-fix
          fetch-depth: 0

      - name: Inspect original Global Shapers commit history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/import-wef-global-shapers-alumni
          echo '=== PR 76 commits and paths ==='
          git log --reverse --format='COMMIT %H %s' --name-status d6726c15969f34fc0aa72b7da9d6be538081e569..42e2b3426f8d87ba136a11ec133b8dd74dc3ac5f
          echo '=== Shapers-related objects across all refs ==='
          git rev-list --objects --all \
            | grep -Ei 'shapers|global-shapers|wef.*alumni' \
            | sort -k2,2 -u
          echo '=== Large blobs introduced in PR 76 ==='
          python3 - <<'PY'
          from __future__ import annotations

          import subprocess

          commits = subprocess.check_output(
              ["git", "rev-list", "--reverse", "d6726c15969f34fc0aa72b7da9d6be538081e569..42e2b3426f8d87ba136a11ec133b8dd74dc3ac5f"],
              text=True,
          ).splitlines()
          seen: set[str] = set()
          for commit in commits:
              lines = subprocess.check_output(
                  ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", commit],
                  text=True,
              ).splitlines()
              for path in lines:
                  key = f"{commit}:{path}"
                  try:
                      blob = subprocess.check_output(["git", "rev-parse", key], text=True).strip()
                      if blob in seen:
                          continue
                      seen.add(blob)
                      size = int(subprocess.check_output(["git", "cat-file", "-s", blob], text=True))
                  except subprocess.CalledProcessError:
                      continue
                  if size >= 5000:
                      print(commit, blob, size, path)
          PY
