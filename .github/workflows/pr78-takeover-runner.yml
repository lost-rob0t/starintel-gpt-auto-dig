name: Temporary PR 78 takeover runner

on:
  pull_request:
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 1956
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/pr-78-takeover-fix
          fetch-depth: 0

      - name: Execute branch repair script
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/python3 <<'PY'/,/^          PY$/p" .github/workflows/pr78-takeover.yml \
            | sed '1d;$d;s/^          //' > /tmp/pr78-takeover.py
          python3 /tmp/pr78-takeover.py
          rm -f .github/workflows/pr78-takeover.yml .pr78-takeover-trigger
          python3 -m compileall -q scripts tests
          python3 -m unittest \
            tests.test_build_research_site \
            tests.test_dataset_catalog \
            tests.test_wef_shapers_transport -v
          python3 scripts/validate-for-merge.py

          git config user.name "starintel-auto-dig-maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Repair nested Global Shapers site materialization"
          git push origin HEAD:agent/pr-78-takeover-fix
