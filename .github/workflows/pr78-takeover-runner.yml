name: Temporary PR 78 takeover runner

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.number == 1956
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/pr-78-takeover-fix
          fetch-depth: 0

      - name: Build clean verified replacement
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          recovery_commit=59c498e218861c9c1a9fac28dc5c2700103e8d89
          packet=digs/wef/global-shapers-legacy-intact-prefix
          mkdir -p "$packet" reports tests
          for path in \
            "$packet/starintel-documents.jsonl.gz.b64.part-000" \
            "$packet/starintel-documents.jsonl.gz.b64.part-001" \
            "$packet/starintel-documents.jsonl.gz.b64.parts"
          do
            mkdir -p "$(dirname "$path")"
            git show "$recovery_commit:$path" > "$path"
          done

          cat > reports/wef-global-shapers-intact-prefix.json <<'JSON'
          {
            "dataset": "wef",
            "missing_suffix_status": "requires-live-and-archive-reconstruction",
            "packet": {
              "base64_parts": [
                "starintel-documents.jsonl.gz.b64.part-000",
                "starintel-documents.jsonl.gz.b64.part-001"
              ],
              "counts_by_dtype": {
                "org": 1,
                "person": 2736,
                "relation": 5472
              },
              "documents": 8209,
              "gzip_sha256": "74ea52f893a42edfb71dbd4c8863d35ac29ac46f81b1536b2c9e904588552acd",
              "output_sha256": "0589735d353f868c5a97b82e9ad043aee14a8873c36d8318a6ce7572b4f09b17"
            },
            "packet_path": "digs/wef/global-shapers-legacy-intact-prefix",
            "prefix": {
              "first_rejected_record": {
                "byte_offset": 492185,
                "error": "Extra data: line 1 column 70 (char 69)",
                "kind": "invalid-json",
                "physical_line": 2737
              },
              "people": 2736,
              "rejected_suffix_bytes": 6220,
              "unique_ids": 2736,
              "valid_jsonl_bytes": 492185
            },
            "run": "global-shapers-legacy-intact-prefix",
            "source_encoded_sha256": "6b68da79a4d04f2f9becdf23671182557d7395aed661aaf800f2984001c4928c",
            "status": "partial-intact-prefix",
            "transport": {
              "compressed_bytes": 180040,
              "compressed_bytes_consumed": 113999,
              "decompressed_bytes_before_error": 498405,
              "encoded_characters": 240055,
              "encoded_data_characters": 240053,
              "valid_jsonl_bytes": 492185,
              "xz_eof": false,
              "xz_error": "LZMAError: Corrupt input data"
            }
          }
          JSON

          cat > reports/wef-global-shapers-intact-prefix.md <<'EOF'
          # Intact prefix of retained Global Shapers alumni transport

          - Intact people recovered before corruption: **2,736**
          - Canonical documents emitted: **8,209**
          - Person documents: **2,736**
          - Relations: **5,472**
          - XZ corruption begins after compressed byte: **113,999**
          - Valid JSONL bytes preserved: **492,185**
          - Canonical output SHA-256: `0589735d353f868c5a97b82e9ad043aee14a8873c36d8318a6ce7572b4f09b17`

          The retained transport is corrupted after this verified prefix. These rows are preserved as evidence-backed seeds. The missing 1,326-person suffix requires reconstruction from live and archived official Global Shapers pages.
          EOF

          cat > "$packet/RECOVERY.md" <<'EOF'
          # Global Shapers legacy transport recovery

          This packet contains the verified intact prefix of the historical Global Shapers alumni transport:

          - 2,736 person documents
          - 5,472 `member_of` relations
          - 1 Global Shapers organization
          - 8,209 canonical StarIntel documents total
          - canonical JSONL SHA-256: `0589735d353f868c5a97b82e9ad043aee14a8873c36d8318a6ce7572b4f09b17`

          Repository history contains only two source snapshots. The compact snapshot is malformed base64 and corrupt during XZ decoding; the fallback snapshot is truncated after 10,000 encoded characters. No historical branch contains the previously claimed reproducible 4,062-person / 12,187-document packet.

          The first 2,736 rows decode as complete JSON records and were imported through the canonical legacy importer. The remaining 1,326-person suffix is not guessed or synthesized. It remains queued for reconstruction from live and archived official Global Shapers sources.
          EOF

          cat > tests/test_wef_shapers_intact_prefix.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import sys
          import unittest
          from collections import Counter
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          if str(ROOT) not in sys.path:
              sys.path.insert(0, str(ROOT))

          from starintel_doc.store import read_transport


          class WefShapersIntactPrefixTests(unittest.TestCase):
              def test_verified_packet_count_types_and_digest(self) -> None:
                  packet = (
                      ROOT
                      / "digs"
                      / "wef"
                      / "global-shapers-legacy-intact-prefix"
                      / "starintel-documents.jsonl.gz.b64.parts"
                  )
                  payload = read_transport(packet)
                  documents = [json.loads(line) for line in payload.splitlines() if line.strip()]
                  self.assertEqual(len(documents), 8_209)
                  self.assertEqual(
                      Counter(document["dtype"] for document in documents),
                      Counter({"person": 2_736, "relation": 5_472, "org": 1}),
                  )
                  canonical = "".join(
                      json.dumps(document, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n"
                      for document in documents
                  )
                  self.assertEqual(
                      hashlib.sha256(canonical.encode()).hexdigest(),
                      "0589735d353f868c5a97b82e9ad043aee14a8873c36d8318a6ce7572b4f09b17",
                  )

              def test_recovery_report_is_explicitly_partial(self) -> None:
                  report = json.loads(
                      (ROOT / "reports" / "wef-global-shapers-intact-prefix.json").read_text(encoding="utf-8")
                  )
                  self.assertEqual(report["status"], "partial-intact-prefix")
                  self.assertEqual(report["prefix"]["people"], 2_736)
                  self.assertEqual(report["packet"]["documents"], 8_209)
                  self.assertEqual(
                      report["missing_suffix_status"],
                      "requires-live-and-archive-reconstruction",
                  )


          if __name__ == "__main__":
              unittest.main()
          PY

          python3 -m compileall -q scripts tests
          python3 -m unittest tests.test_wef_shapers_intact_prefix -v
          python3 scripts/validate-for-merge.py

          git config user.name "starintel-auto-dig-maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add "$packet" reports/wef-global-shapers-intact-prefix.json reports/wef-global-shapers-intact-prefix.md tests/test_wef_shapers_intact_prefix.py
          git commit -m "Index verified Global Shapers intact prefix"
          git push --force-with-lease origin HEAD:agent/pr-78-takeover-fix
