name: Build sharded DNC FEC people index

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - scripts/materialize_dnc_fec_people_index.py
      - .github/workflows/dnc-fec-people-index.yml

permissions:
  contents: write

concurrency:
  group: dnc-fec-people-index-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.ref == 'agent/dnc-fec-project-veritas-seed')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: .
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize canonical partitions
        run: python3 scripts/materialize_dnc_fec_people_index.py

      - name: Validate repository corpus
        run: python3 scripts/validate-for-merge.py

      - name: Commit generated partitions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add digs/dnc/2026-07-31-fec-people-employment-2026-*
          if git diff --cached --quiet; then
            echo 'Generated partitions are unchanged.'
            exit 0
          fi
          git commit -m 'Add sharded DNC FEC people and employment index [skip ci]'
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin HEAD:${TARGET_BRANCH}
