description = "StarLang-generated StarIntel consumer and historical research corpus tooling"
requires-python = ">=3.11"
dependencies = [
  "starintel-doc @ git+https://github.com/lost-rob0t/starintel-doc.git@ac015a5d92a1d9587e5dc7764dd9e0a150a6d0a8",
  "websocket-client>=1.9,<2",
]

[project.scripts]
