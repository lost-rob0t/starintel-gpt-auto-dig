[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "starintel-doc-auto-dig"
version = "0.9.0"
description = "Canonical StarIntel v0.9.0 document fork and auto-dig tooling"
requires-python = ">=3.11"

[project.scripts]
starintel = "starintel_doc.cli:main"

[tool.setuptools]
packages = ["starintel_doc"]

[tool.unittest]
start-directory = "tests"
